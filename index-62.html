/* ==================================================================
   Semear — estilos
   ------------------------------------------------------------------
   Direção visual: "vigília noturna". Fundo índigo profundo, um único
   acento em ouro de vela, tipografia serifada (Fraunces) para os
   momentos de leitura e Sora para os controles. O ouro aparece pouco,
   sempre onde há ação ou escritura — é o que dá identidade à tela.
   ================================================================== */

/* ------------------------------ Tokens ------------------------------ */
:root {
  /* Cores */
  --tinta:      #080B16;
  --superficie: #111629;
  --elevada:    #171D34;
  --filete:     #242C46;
  --ouro:       #E7B84B;
  --ouro-suave: #F2D28C;
  --vellum:     #F1EBE0;
  --neutro:     #8A93AE;
  --erro:       #E2726E;
  --ok:         #6FC59B;

  /* Tipografia fluida */
  --f-display: 'Fraunces', Georgia, serif;
  --f-ui: 'Sora', system-ui, -apple-system, sans-serif;
  --t-xs: clamp(.68rem, .66rem + .1vw, .74rem);
  --t-sm: clamp(.78rem, .75rem + .15vw, .86rem);
  --t-md: clamp(.9rem, .87rem + .2vw, 1rem);
  --t-lg: clamp(1.05rem, 1rem + .4vw, 1.28rem);
  --t-xl: clamp(1.4rem, 1.2rem + 1vw, 2.1rem);
  --t-2xl: clamp(2rem, 1.5rem + 2.4vw, 3.4rem);

  /* Espaço e forma */
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --lateral-largura: 264px;
  --sombra: 0 20px 50px rgba(0, 0, 0, .45);
  --brilho-ouro: 0 0 0 1px rgba(231, 184, 75, .28), 0 12px 32px rgba(231, 184, 75, .12);
}

/* ------------------------------ Reset ------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100dvh;
  background: var(--tinta);
  color: var(--vellum);
  font-family: var(--f-ui);
  font-size: var(--t-md);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* Brilho ambiente: a "vela" atrás de toda a interface. */
body::before {
  content: '';
  position: fixed;
  inset: -20vh 0 auto 0;
  height: 70vh;
  background:
    radial-gradient(60% 60% at 22% 0%, rgba(231, 184, 75, .10), transparent 70%),
    radial-gradient(50% 50% at 85% 10%, rgba(93, 106, 214, .12), transparent 70%);
  pointer-events: none;
  z-index: 0;
}

h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
canvas { display: block; }
.sem-rolagem { overflow: hidden; }

:focus-visible {
  outline: 2px solid var(--ouro);
  outline-offset: 2px;
  border-radius: 6px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ------------------------------ Casco ------------------------------- */
.app {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: var(--lateral-largura) 1fr;
  min-height: 100dvh;
}

.lateral {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 22px 16px 18px;
  border-right: 1px solid var(--filete);
  background: linear-gradient(180deg, rgba(17, 22, 41, .92), rgba(8, 11, 22, .92));
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  height: 100dvh;
}

.lateral__topo { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lateral__fechar { display: none; }

.marca { display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; }
.marca__broto {
  display: grid;
  place-items: center;
  width: 40px; height: 40px;
  border-radius: 13px;
  color: var(--ouro);
  background: radial-gradient(circle at 50% 120%, rgba(231, 184, 75, .35), rgba(23, 29, 52, .9));
  box-shadow: var(--brilho-ouro);
}
.marca__texto strong { display: block; font-family: var(--f-display); font-size: 1.02rem; letter-spacing: -.015em; }
.marca__texto small { display: block; color: var(--neutro); font-size: var(--t-xs); }

/* Navegação */
.nav { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; }
.nav-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 12px;
  border-radius: var(--r-sm);
  color: var(--neutro);
  text-decoration: none;
  font-size: var(--t-sm);
  transition: background .18s ease, color .18s ease;
}
.nav-item:hover { background: rgba(255, 255, 255, .04); color: var(--vellum); }
.nav-item__icone { display: grid; place-items: center; opacity: .9; }
.nav-item--ativo { background: rgba(231, 184, 75, .09); color: var(--vellum); }
.nav-item--ativo .nav-item__icone { color: var(--ouro); }
.nav-item__marca {
  position: absolute; left: 0; top: 50%;
  width: 2px; height: 0; border-radius: 2px;
  background: var(--ouro);
  transform: translateY(-50%);
  transition: height .2s ease;
}
.nav-item--ativo .nav-item__marca { height: 20px; }

.lateral__rodape { margin-top: auto; display: grid; gap: 8px; font-size: var(--t-xs); color: var(--neutro); }
.selo-local {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 11px;
  border: 1px solid var(--filete);
  border-radius: 999px;
  background: rgba(255, 255, 255, .02);
}
.selo-local::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--ok); box-shadow: 0 0 8px var(--ok);
}
.rodape-linha { display: flex; justify-content: space-between; align-items: center; }

.link {
  background: none; border: 0; padding: 0; cursor: pointer;
  color: var(--ouro); font-size: var(--t-xs); text-decoration: underline;
  text-underline-offset: 3px;
}

/* Conteúdo */
.conteudo { display: flex; flex-direction: column; min-width: 0; }

.topo {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px;
  padding: 16px clamp(16px, 3vw, 34px);
  border-bottom: 1px solid var(--filete);
  background: rgba(8, 11, 22, .78);
  backdrop-filter: blur(12px);
}
.topo__menu { display: none; }
.topo__titulos { flex: 1; min-width: 0; }
.topo__titulos h1 { font-family: var(--f-display); font-size: var(--t-lg); }
.topo__titulos p { color: var(--neutro); font-size: var(--t-xs); }

.area { padding: clamp(18px, 3vw, 34px); display: grid; gap: 22px; }
.tela--entrando { animation: surgir .32s ease both; }
@keyframes surgir { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.veu {
  position: fixed; inset: 0; z-index: 30;
  background: rgba(4, 6, 12, .65);
  backdrop-filter: blur(2px);
  opacity: 0; pointer-events: none;
  transition: opacity .22s ease;
}
.veu--visivel { opacity: 1; pointer-events: auto; }

/* ------------------------------ Botões ------------------------------ */
.botao {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px;
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  background: rgba(255, 255, 255, .05);
  color: var(--vellum);
  font-size: var(--t-sm); font-weight: 500;
  cursor: pointer;
  transition: transform .12s ease, background .18s ease, border-color .18s ease, opacity .18s ease;
}
.botao:hover { background: rgba(255, 255, 255, .09); }
.botao:active { transform: translateY(1px); }
.botao:disabled { opacity: .5; cursor: progress; }

.botao--principal {
  background: linear-gradient(180deg, var(--ouro-suave), var(--ouro));
  color: #1B1405;
  font-weight: 600;
  box-shadow: 0 10px 24px rgba(231, 184, 75, .18);
}
.botao--principal:hover { background: linear-gradient(180deg, #F7DFA8, #EFC55F); }

.botao--fantasma { background: transparent; border-color: var(--filete); }
.botao--fantasma:hover { background: rgba(255, 255, 255, .05); border-color: #33406A; }

.botao--grande { width: 100%; padding: 15px 20px; font-size: var(--t-md); border-radius: var(--r-md); }
.botao--pequeno { padding: 7px 12px; font-size: var(--t-xs); }
.botao--icone { padding: 9px; border-radius: 10px; }
.botao--bloco { flex: 1; }
.esta-favorito { color: var(--ouro); border-color: rgba(231, 184, 75, .4); }

/* ------------------------------ Painel ------------------------------ */
/* Cartão do tema do dia: a "página iluminada", com filete de ouro na
   margem esquerda, como um manuscrito. É o elemento-assinatura do app. */
.destaque {
  position: relative;
  padding: clamp(22px, 3vw, 40px) clamp(20px, 3vw, 44px);
  border: 1px solid var(--filete);
  border-left: 2px solid var(--ouro);
  border-radius: var(--r-lg);
  background:
    radial-gradient(80% 120% at 0% 0%, rgba(231, 184, 75, .10), transparent 60%),
    linear-gradient(160deg, var(--elevada), var(--superficie));
  overflow: hidden;
}
.destaque__selo {
  font-size: var(--t-xs); letter-spacing: .18em; text-transform: uppercase;
  color: var(--ouro);
}
.destaque__tema {
  font-family: var(--f-display);
  font-size: var(--t-2xl);
  font-style: italic;
  font-weight: 500;
  line-height: 1.05;
  margin: 6px 0 14px;
}
.destaque__versiculo {
  margin: 0;
  max-width: 62ch;
  font-family: var(--f-display);
  font-size: var(--t-lg);
  line-height: 1.5;
  color: rgba(241, 235, 224, .92);
}
.destaque__ref {
  margin-top: 10px;
  font-size: var(--t-xs);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--neutro);
}
.destaque__acoes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }

/* Métricas */
.metricas { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.metrica {
  padding: 16px 18px;
  border: 1px solid var(--filete);
  border-radius: var(--r-md);
  background: var(--superficie);
}
.metrica__icone { color: var(--ouro); opacity: .85; }
.metrica__valor { font-family: var(--f-display); font-size: 1.9rem; line-height: 1.1; margin-top: 6px; }
.metrica__rotulo { font-size: var(--t-xs); color: var(--neutro); }

.painel-colunas { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }

.cartao {
  padding: 18px 20px;
  border: 1px solid var(--filete);
  border-radius: var(--r-md);
  background: var(--superficie);
}
.cartao__cabecalho { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.cartao__cabecalho h3 { font-family: var(--f-display); font-size: var(--t-md); }
.cartao__nota { font-size: var(--t-xs); color: var(--neutro); }
.cartao__vazio { font-size: var(--t-sm); color: var(--neutro); }

.ranking { list-style: none; margin: 0; padding: 0; display: grid; gap: 11px; }
.ranking__item { display: grid; grid-template-columns: 1fr 2fr auto; align-items: center; gap: 10px; font-size: var(--t-sm); }
.ranking__barra { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .06); overflow: hidden; }
.ranking__barra i { display: block; height: 100%; background: linear-gradient(90deg, rgba(231,184,75,.45), var(--ouro)); }
.ranking__valor { color: var(--neutro); font-size: var(--t-xs); }

.lista-simples { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; font-size: var(--t-sm); }
.lista-simples li {
  display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: baseline;
  padding-bottom: 9px; border-bottom: 1px solid rgba(255, 255, 255, .05);
}
.lista-simples li:last-child { border-bottom: 0; padding-bottom: 0; }
.lista-simples__tema, .lista-simples__data { font-size: var(--t-xs); color: var(--neutro); }

/* ------------------------------ Estúdio ----------------------------- */
.estudio { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 380px); gap: clamp(18px, 3vw, 34px); align-items: start; }
.estudio__controles { display: grid; gap: 18px; }
.estudio__linha { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }

.campo {
  padding: 16px 18px;
  border: 1px solid var(--filete);
  border-radius: var(--r-md);
  background: var(--superficie);
}
.campo__cabecalho { margin-bottom: 12px; }
.campo__cabecalho h3 { font-size: var(--t-sm); font-weight: 600; letter-spacing: .01em; }
.campo__cabecalho p { font-size: var(--t-xs); color: var(--neutro); margin-top: 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 8px 14px;
  border: 1px solid var(--filete);
  border-radius: 999px;
  background: transparent;
  color: var(--neutro);
  font-size: var(--t-sm);
  cursor: pointer;
  transition: all .16s ease;
}
.chip:hover { color: var(--vellum); border-color: #35406B; }
.chip--ativo {
  background: rgba(231, 184, 75, .12);
  border-color: rgba(231, 184, 75, .55);
  color: var(--ouro-suave);
}

.cores { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
.cor {
  width: 32px; height: 32px; padding: 0; cursor: pointer;
  border: 1px solid rgba(255, 255, 255, .16);
  border-radius: 10px;
  background: var(--amostra, #fff);
  transition: transform .14s ease, box-shadow .14s ease;
}
.cor:hover { transform: translateY(-2px); }
.cor--ativa { box-shadow: 0 0 0 2px var(--tinta), 0 0 0 4px var(--ouro); }
.cor--livre {
  display: grid; place-items: center; overflow: hidden;
  background: conic-gradient(from 210deg, #E7B84B, #6FC59B, #7E8BE8, #E2726E, #E7B84B);
}
.cor--livre input { width: 44px; height: 44px; border: 0; background: none; opacity: 0; cursor: pointer; }

.area-arquivo {
  display: flex; align-items: center; gap: 13px;
  padding: 15px 16px;
  border: 1px dashed #333E66;
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: border-color .18s ease, background .18s ease;
}
.area-arquivo:hover { border-color: var(--ouro); background: rgba(231, 184, 75, .05); }
.area-arquivo__icone { color: var(--ouro); }
.area-arquivo strong { display: block; font-size: var(--t-sm); font-weight: 500; }
.area-arquivo small { display: block; font-size: var(--t-xs); color: var(--neutro); }

.lista-fundos { margin-top: 12px; }
.lista-fundos__vazio { font-size: var(--t-xs); color: var(--neutro); margin-bottom: 8px; }
.gradientes { display: flex; gap: 7px; flex-wrap: wrap; }
.gradiente { width: 34px; height: 46px; border-radius: 8px; border: 1px solid var(--filete); }
.fundos-escolhidos { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fundo-tag {
  display: inline-flex; align-items: center; gap: 6px;
  max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  padding: 6px 11px;
  border: 1px solid var(--filete);
  border-radius: 999px;
  font-size: var(--t-xs);
  color: var(--neutro);
}

/* Busca automática de fundos */
.auto-fundos {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid rgba(255, 255, 255, .06);
}
.auto-fundos__painel { margin-top: 8px; display: grid; gap: 8px; }
.auto-fundos__linha { display: flex; gap: 8px; flex-wrap: wrap; }
.entrada {
  flex: 1; min-width: 170px;
  padding: 9px 13px;
  border: 1px solid var(--filete);
  border-radius: var(--r-sm);
  background: rgba(255, 255, 255, .03);
  font-size: var(--t-sm);
  outline: none;
}
.entrada:focus { border-color: var(--ouro); }
.entrada::placeholder { color: #5F6884; }
.auto-fundos__nota { font-size: var(--t-xs); color: var(--neutro); line-height: 1.5; }
.auto-fundos__nota a { color: var(--ouro); }
.auto-fundos__nota--aviso { color: var(--ouro-suave); }
.fundo-tag--aviso { border-color: rgba(231, 184, 75, .45); color: var(--ouro-suave); }

/* Áudio: música e narração */
.linha-audio {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  margin-top: 10px;
}
.controle-volume { display: flex; align-items: center; gap: 8px; font-size: var(--t-xs); color: var(--neutro); }
.controle-volume input[type="range"] { width: 110px; accent-color: var(--ouro); }
.lista-musicas { margin-top: 10px; display: grid; gap: 8px; }
.fundo-tag__x {
  border: 0; background: none; padding: 0 0 0 2px; cursor: pointer;
  color: var(--neutro); font-size: 14px; line-height: 1;
}
.fundo-tag__x:hover { color: var(--erro); }
.card__trilha {
  position: absolute; left: 8px; right: 8px; bottom: 44px;
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 999px;
  background: rgba(8, 11, 22, .72);
  font-size: var(--t-xs); color: var(--neutro);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.controle-volume b { color: var(--vellum); font-weight: 500; min-width: 34px; }

/* Modal de legenda */
.modal__caixa--texto {
  width: min(520px, 92vw);
  padding: 22px;
  border: 1px solid var(--filete);
  border-radius: var(--r-lg);
  background: var(--superficie);
  justify-items: stretch;
  max-height: 86dvh;
  overflow-y: auto;
}
.modal__titulo { font-family: var(--f-display); font-size: var(--t-md); padding-right: 30px; }
.legenda-texto {
  margin: 0;
  padding: 14px 16px;
  border: 1px solid var(--filete);
  border-radius: var(--r-sm);
  background: rgba(0, 0, 0, .25);
  font-family: var(--f-ui);
  font-size: var(--t-sm);
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}
.hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
.hashtags span {
  padding: 4px 9px;
  border: 1px solid var(--filete);
  border-radius: 999px;
  font-size: var(--t-xs);
  color: var(--ouro-suave);
}
.modal__acoes { display: flex; gap: 9px; flex-wrap: wrap; }
.modal__acoes .botao { flex: 1; }

.opcao { display: flex; align-items: center; gap: 10px; font-size: var(--t-sm); padding: 5px 0; cursor: pointer; }
.opcao input { width: 17px; height: 17px; accent-color: var(--ouro); cursor: pointer; }

.dica { font-size: var(--t-xs); color: var(--neutro); text-align: center; }

/* Prévia em formato de celular */
.previa-sticky { position: sticky; top: 96px; display: grid; gap: 14px; justify-items: center; }
.celular {
  position: relative;
  padding: 9px;
  border: 1px solid var(--filete);
  border-radius: 30px;
  background: linear-gradient(160deg, #1C2340, #0C1020);
  box-shadow: var(--sombra), 0 0 60px rgba(231, 184, 75, .07);
}
.celular canvas {
  width: min(300px, 68vw);
  height: auto;
  aspect-ratio: 9 / 16;
  border-radius: 22px;
  background: #000;
}
.celular__brilho {
  position: absolute; inset: auto 22% -14px; height: 26px;
  background: radial-gradient(50% 100% at 50% 0%, rgba(231, 184, 75, .3), transparent 70%);
  filter: blur(6px);
  pointer-events: none;
}
.previa-info { display: grid; gap: 9px; justify-items: center; text-align: center; }
.previa-info__ref { font-size: var(--t-xs); letter-spacing: .16em; text-transform: uppercase; color: var(--neutro); }

/* ------------------------------ Vídeos ------------------------------ */
.barra-lote {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px;
  padding: 14px 18px;
  border: 1px solid var(--filete);
  border-radius: var(--r-md);
  background: var(--superficie);
}
.barra-lote__titulo { font-family: var(--f-display); font-size: var(--t-md); }
.barra-lote__meta { font-size: var(--t-xs); color: var(--neutro); }
.barra-lote__acoes { display: flex; gap: 9px; flex-wrap: wrap; }

.grade-cards { min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }

.card {
  display: flex; flex-direction: column; min-width: 0;
  border: 1px solid var(--filete);
  border-radius: var(--r-md);
  background: var(--superficie);
  overflow: hidden;
  transition: border-color .2s ease, transform .2s ease;
}
.card:hover { border-color: #35406B; transform: translateY(-2px); }

/* A miniatura inteira é o alvo da prévia. O selo de play fica num canto:
   no centro ele cobria justamente o versículo, que é o que se quer ler. */
.card__midia { position: relative; background: #000; cursor: pointer; }
.card__canvas { width: 100%; height: auto; aspect-ratio: 9 / 16; display: block; }
.card__midia::after {
  content: '';
  position: absolute; inset: 0;
  background: rgba(231, 184, 75, 0);
  transition: background .2s ease;
  pointer-events: none;
}
.card__midia:hover::after { background: rgba(231, 184, 75, .08); }
.card__midia:focus-visible { outline: 2px solid var(--ouro); outline-offset: -2px; }

.card__play {
  position: absolute; left: 8px; bottom: 8px;
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: rgba(8, 11, 22, .72);
  backdrop-filter: blur(4px);
  color: var(--vellum);
}
.card__duracao {
  position: absolute; right: 8px; bottom: 8px;
  padding: 3px 8px; border-radius: 999px;
  background: rgba(8, 11, 22, .72);
  font-size: var(--t-xs); color: var(--vellum);
}

.card__corpo { padding: 14px 15px; display: grid; gap: 7px; flex: 1; }
.card__texto {
  font-family: var(--f-display);
  font-size: var(--t-sm);
  line-height: 1.5;
  color: rgba(241, 235, 224, .9);
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
.card__ref { font-size: var(--t-xs); letter-spacing: .12em; text-transform: uppercase; color: var(--ouro); }

.card__acoes { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 15px 15px; }
.card__acoes .botao { min-width: 0; }
.card__acoes .botao--pequeno { flex: 1; }
/* O botão principal ocupa a linha inteira: em card estreito, três botões
   lado a lado estouravam a largura e criavam rolagem horizontal. */
.card__acoes .botao--bloco { flex: 1 0 100%; }

.card__progresso { padding: 0 15px 14px; display: grid; gap: 6px; }
.card__progresso .barra { height: 4px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.card__progresso .barra span {
  display: block; height: 100%; width: 0;
  background: linear-gradient(90deg, var(--ouro-suave), var(--ouro));
  transition: width .2s ease;
}
.card__progresso p { font-size: var(--t-xs); color: var(--neutro); }
.link-manual {
  display: block;
  padding: 8px 10px;
  border: 1px solid rgba(231, 184, 75, .4);
  border-radius: var(--r-sm);
  background: rgba(231, 184, 75, .08);
  color: var(--ouro-suave);
  font-size: var(--t-xs);
  text-align: center;
  text-decoration: none;
}
.link-manual:hover { background: rgba(231, 184, 75, .15); }

/* ------------------------------ Listas ------------------------------ */
.filtros { display: flex; flex-wrap: wrap; gap: 10px; }
.campo-busca {
  flex: 1; min-width: 220px;
  display: flex; align-items: center; gap: 10px;
  padding: 11px 15px;
  border: 1px solid var(--filete);
  border-radius: var(--r-sm);
  background: var(--superficie);
  color: var(--neutro);
}
.campo-busca input { flex: 1; border: 0; background: none; outline: none; color: var(--vellum); font-size: var(--t-sm); }
.campo-busca input::placeholder { color: #5F6884; }

.seletor {
  padding: 11px 15px;
  border: 1px solid var(--filete);
  border-radius: var(--r-sm);
  background: var(--superficie);
  font-size: var(--t-sm);
  cursor: pointer;
}
.seletor option { background: var(--elevada); }

.resultado-contagem { font-size: var(--t-xs); color: var(--neutro); }

.lista-versiculos { display: grid; gap: 10px; }
.linha-versiculo {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px;
  padding: 15px 17px;
  border: 1px solid var(--filete);
  border-radius: var(--r-md);
  background: var(--superficie);
  transition: border-color .18s ease;
}
.linha-versiculo:hover { border-color: #35406B; }
.linha-versiculo__conteudo { flex: 1; min-width: 220px; }
.linha-versiculo__texto { font-family: var(--f-display); font-size: var(--t-sm); line-height: 1.55; }
.linha-versiculo__meta { margin-top: 5px; font-size: var(--t-xs); color: var(--neutro); }
.linha-versiculo__meta strong { color: var(--ouro); font-weight: 500; }
.linha-versiculo__acoes { display: flex; gap: 8px; }

/* ------------------------------ Vazios ------------------------------ */
.vazio {
  display: grid; justify-items: center; gap: 11px; text-align: center;
  padding: clamp(34px, 7vw, 72px) 20px;
  border: 1px dashed var(--filete);
  border-radius: var(--r-lg);
  background: rgba(17, 22, 41, .5);
}
.vazio--compacto { padding: 34px 20px; }
.vazio__icone {
  display: grid; place-items: center; width: 54px; height: 54px;
  border-radius: 18px; color: var(--ouro);
  background: rgba(231, 184, 75, .1);
}
.vazio h3 { font-family: var(--f-display); font-size: var(--t-lg); }
.vazio p { font-size: var(--t-sm); color: var(--neutro); max-width: 42ch; }

/* ------------------------------ Modal ------------------------------- */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; }
.modal__fundo { position: absolute; inset: 0; background: rgba(4, 6, 12, .82); backdrop-filter: blur(6px); }
.modal__caixa { position: relative; display: grid; gap: 14px; justify-items: center; animation: surgir .25s ease both; }
.modal__fechar {
  position: absolute; top: -6px; right: -6px; z-index: 2;
  background: rgba(8, 11, 22, .8); border: 1px solid var(--filete);
}
.celular--modal canvas { width: min(360px, 78vw); }
.modal__ref { font-size: var(--t-xs); letter-spacing: .16em; text-transform: uppercase; color: var(--neutro); }

/* ------------------------------ Avisos ------------------------------ */
.toast-area {
  position: fixed; right: 18px; bottom: 18px; z-index: 80;
  display: grid; gap: 9px; max-width: min(360px, calc(100vw - 36px));
}
.toast {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 15px;
  border: 1px solid var(--filete);
  border-radius: var(--r-sm);
  background: rgba(23, 29, 52, .96);
  box-shadow: var(--sombra);
  font-size: var(--t-sm);
  opacity: 0; transform: translateY(10px);
  transition: opacity .24s ease, transform .24s ease;
}
.toast--visivel { opacity: 1; transform: none; }
.toast__icone { display: grid; place-items: center; padding-top: 1px; }
.toast--ok .toast__icone { color: var(--ok); }
.toast--erro .toast__icone { color: var(--erro); }
.toast--aviso .toast__icone, .toast--info .toast__icone { color: var(--ouro); }

/* --------------------------- Carregamento --------------------------- */
.carregando {
  position: fixed; inset: 0; z-index: 90;
  display: grid; place-content: center; justify-items: center; gap: 16px;
  padding: 24px; text-align: center;
  background: var(--tinta);
  color: var(--neutro);
  font-size: var(--t-sm);
}
.carregando__broto {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--ouro);
  box-shadow: 0 0 26px 8px rgba(231, 184, 75, .35);
  animation: tremular 1.5s ease-in-out infinite;
}
@keyframes tremular {
  0%, 100% { transform: scale(1); opacity: .85; }
  50% { transform: scale(1.35); opacity: 1; }
}

.falha { max-width: 560px; display: grid; gap: 12px; justify-items: center; }
.falha__icone { color: var(--erro); }
.falha h2 { font-family: var(--f-display); font-size: var(--t-lg); color: var(--vellum); }
.falha pre {
  width: 100%; margin: 0; padding: 14px 16px;
  border: 1px solid var(--filete); border-radius: var(--r-sm);
  background: var(--superficie); color: var(--vellum);
  font-size: var(--t-xs); text-align: left; overflow-x: auto;
}
.falha__nota { font-size: var(--t-xs); }
.falha code { color: var(--ouro-suave); }

/* --------------------------- Responsivo ----------------------------- */
@media (max-width: 1080px) {
  .estudio { grid-template-columns: 1fr; }
  .previa-sticky { position: static; }
  .estudio__previa { order: -1; }
}

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }

    position: fixed; inset: 0 auto 0 0; z-index: 40;

  }
  .lateral--aberta { transform: none; }

}

}

/* ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ */

}

   "livro": "Romanos",

  },
  {

   "capitulo": 5,

  {

  },
  {

  },
  {

  },

   "capitulo": 39,

  },

   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0007",
   "texto": "É melhor refugiar-se no Senhor do que confiar nos príncipes.",
   "referencia": "Salmos 118:9",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0008",
   "texto": "A tua palavra é fiel a toda prova, por isso o teu servo a ama.",
   "referencia": "Salmos 119:140",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0009",
   "texto": "Ordenaste os teus testemunhos com retidão, e com toda a fidelidade.",
   "referencia": "Salmos 119:138",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0010",
   "texto": "O cobiçoso levanta contendas; mas o que confia no Senhor prosperará.",
   "referencia": "Provérbios 28:25",
   "livro": "Provérbios",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0011",
   "texto": "Escolhi o caminho da fidelidade; diante de mim pus as tuas ordenanças.",
   "referencia": "Salmos 119:30",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0012",
   "texto": "O mensageiro perverso faz cair no mal; mas o embaixador fiel traz saúde.",
   "referencia": "Provérbios 13:17",
   "livro": "Provérbios",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0013",
   "texto": "O receio do homem lhe arma laços; mas o que confia no Senhor está seguro.",
   "referencia": "Provérbios 29:25",
   "livro": "Provérbios",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0014",
   "texto": "A benignidade e a fidelidade se encontraram; a justiça e a paz se beijaram.",
   "referencia": "Salmos 85:10",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0015",
   "texto": "Bete. O coração do seu marido confia nela, e não lhe haverá falta de lucro.",
   "referencia": "Provérbios 31:11",
   "livro": "Provérbios",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0016",
   "texto": "em Deus ponho a minha confiança, e não terei medo; que me pode fazer o homem?",
   "referencia": "Salmos 56:11",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0017",
   "texto": "Ó Senhor dos exércitos, bem-aventurado o homem que em ti põe a sua confiança.",
   "referencia": "Salmos 84:12",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0018",
   "texto": "Porque o Senhor será a tua confiança, e guardará os teus pés de serem presos.",
   "referencia": "Provérbios 3:26",
   "livro": "Provérbios",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0019",
   "texto": "O sábio escala a cidade dos valentes, e derriba a fortaleza em que ela confia.",
   "referencia": "Provérbios 21:22",
   "livro": "Provérbios",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0020",
   "texto": "A tua benignidade, Senhor, chega até os céus, e a tua fidelidade até as nuvens.",
   "referencia": "Salmos 36:5",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0021",
   "texto": "Muitos há que proclamam a sua própria bondade; mas o homem fiel, quem o achará?",
   "referencia": "Provérbios 20:6",
   "livro": "Provérbios",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0022",
   "texto": "Pois o rei confia no Senhor; e pela bondade do Altíssimo permanecerá inabalável.",
   "referencia": "Salmos 21:7",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0023",
   "texto": "O que anda mexericando revela segredos; mas o fiel de espírito encobre o negócio.",
   "referencia": "Provérbios 11:13",
   "livro": "Provérbios",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0024",
   "texto": "O ímpio tem muitas dores, mas aquele que confia no Senhor, a misericórdia o cerca.",
   "referencia": "Salmos 32:10",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0025",
   "texto": "No temor do Senhor há firme confiança; e os seus filhos terão um lugar de refúgio.",
   "referencia": "Provérbios 14:26",
   "livro": "Provérbios",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0026",
   "texto": "Porque a palavra do Senhor é reta; e todas as suas obras são feitas com fidelidade.",
   "referencia": "Salmos 33:4",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0027",
   "texto": "Para que a tua confiança esteja no Senhor, a ti tos fiz saber hoje, sim, a ti mesmo.",
   "referencia": "Provérbios 22:19",
   "livro": "Provérbios",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0028",
   "texto": "O que confia no seu próprio coração é insensato; mas o que anda sabiamente será livre.",
   "referencia": "Provérbios 28:26",
   "livro": "Provérbios",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0029",
   "texto": "Confia no Senhor e faze o bem; assim habitarás na terra, e te alimentarás em segurança.",
   "referencia": "Salmos 37:3",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0030",
   "texto": "Aquele que confia nas suas riquezas, cairá; mas os justos reverdecerão como a folhagem.",
   "referencia": "Provérbios 11:28",
   "livro": "Provérbios",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0031",
   "texto": "Como dente quebrado, e pé deslocado, é a confiança no homem desleal, no dia da angústia.",
   "referencia": "Provérbios 25:19",
   "livro": "Provérbios",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0032",
   "texto": "Preserva a minha vida, pois sou piedoso; o Deus meu, salva o teu servo, que em ti confia.",
   "referencia": "Salmos 86:2",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0033",
   "texto": "Bem sei eu, ó Senhor, que os teus juízos são retos, e que em tua fidelidade me afligiste.",
   "referencia": "Salmos 119:75",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0034",
   "texto": "A tua fidelidade estende-se de geração a geração; tu firmaste a terra, e firme permanece.",
   "referencia": "Salmos 119:90",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0035",
   "texto": "Quem é fiel na retidão encaminha, para a vida, e aquele que segue o mal encontra a morte.",
   "referencia": "Provérbios 11:19",
   "livro": "Provérbios",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0036",
   "texto": "Os céus louvarão as tuas maravilhas, ó Senhor, e a tua fidelidade na assembléia dos santos.",
   "referencia": "Salmos 89:5",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0037",
   "texto": "O que atenta prudentemente para a palavra prosperará; e feliz é aquele que confia no Senhor.",
   "referencia": "Provérbios 16:20",
   "livro": "Provérbios",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0038",
   "texto": "Ó Senhor, Deus dos exércitos, quem é poderoso como tu, Senhor, com a tua fidelidade ao redor de ti?",
   "referencia": "Salmos 89:8",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0039",
   "texto": "Porque o Senhor é bom; a sua benignidade dura para sempre, e a sua fidelidade de geração em geração.",
   "referencia": "Salmos 100:5",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0040",
   "texto": "Porventura não erram os que maquinam o mal? mas há beneficência e fidelidade para os que planejam o bem.",
   "referencia": "Provérbios 14:22",
   "livro": "Provérbios",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0041",
   "texto": "A lei do Senhor é perfeita, e refrigera a alma; o testemunho do Senhor é fiel, e dá sabedoria aos simples.",
   "referencia": "Salmos 19:7",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0042",
   "texto": "A minha fidelidade, porém, e a minha benignidade estarão com ele, e em meu nome será exaltado o seu poder.",
   "referencia": "Salmos 89:24",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0043",
   "texto": "Cantarei para sempre as benignidades do Senhor; com a minha boca proclamarei a todas as gerações a tua fidelidade.",
   "referencia": "Salmos 89:1",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0044",
   "texto": "diante do Senhor, porque ele vem, porque vem julgar a terra: julgará o mundo com justiça e os povos com a sua fidelidade.",
   "referencia": "Salmos 96:13",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0045",
   "texto": "Bem-aventurado o homem que faz do Senhor a sua confiança, e que não atenta para os soberbos nem para os apóstatas mentirosos.",
   "referencia": "Salmos 40:4",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0046",
   "texto": "Como o frescor de neve no tempo da sega, assim é o mensageiro fiel para com os que o enviam, porque refrigera o espírito dos seus senhores.",
   "referencia": "Provérbios 25:13",
   "livro": "Provérbios",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0047",
   "texto": "Ainda que um exército se acampe contra mim, o meu coração não temerá; ainda que a guerra se levante contra mim, conservarei a minha confiança.",
   "referencia": "Salmos 27:3",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0048",
   "texto": "Porque não há fidelidade na boca deles; as suas entranhas são verdadeiras maldades, a sua garganta é um sepulcro aberto; lisonjeiam com a sua língua.",
   "referencia": "Salmos 5:9",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0049",
   "texto": "Eu, porém, faço a minha oração a ti, ó Senhor, em tempo aceitável; ouve-me, ó Deus, segundo a grandeza da tua benignidade, segundo a fidelidade da tua salvação.",
   "referencia": "Salmos 69:13",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0050",
   "texto": "Inclino-me para o teu santo templo, e louvo o teu nome pela tua benignidade, e pela tua fidelidade; pois engrandeceste acima de tudo o teu nome e a tua palavra.",
   "referencia": "Salmos 138:2",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0051",
   "texto": "Não ocultei dentro do meu coração a tua justiça; apregoei a tua fidelidade e a tua salvação; não escondi da grande congregação a tua benignidade e a tua verdade.",
   "referencia": "Salmos 40:10",
   "livro": "Salmos",
   "tema": "Fé",
   "origem": "ampliado"
  },
  {
   "id": "amp-0052",
   "texto": "Os meus olhos desfalecem à espera da tua salvação e da promessa da tua justiça.",
   "referencia": "Salmos 119:123",
   "livro": "Salmos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0053",
   "texto": "Ó minha alma, espera silenciosa somente em Deus, porque dele vem a minha esperança.",
   "referencia": "Salmos 62:5",
   "livro": "Salmos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0054",
   "texto": "Porque na esperança fomos salvos. Ora, a esperança que se vê não é esperança; pois o que alguém vê, como o espera?",
   "referencia": "Romanos 8:24",
   "livro": "Romanos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0055",
   "texto": "Confirma a tua promessa ao teu servo, que se inclina ao teu temor.",
   "referencia": "Salmos 119:38",
   "livro": "Salmos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0056",
   "texto": "Lembra-te da palavra dada ao teu servo, na qual me fizeste esperar.",
   "referencia": "Salmos 119:49",
   "livro": "Salmos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0057",
   "texto": "Não digas: vingar-me-ei do mal; espera pelo Senhor e ele te livrará.",
   "referencia": "Provérbios 20:22",
   "livro": "Provérbios",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0058",
   "texto": "A nossa alma espera no Senhor; ele é o nosso auxílio e o nosso escudo.",
   "referencia": "Salmos 33:20",
   "livro": "Salmos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0059",
   "texto": "A esperança dos justos é alegria; mas a expectação dos ímpios perecerá.",
   "referencia": "Provérbios 10:28",
   "livro": "Provérbios",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0060",
   "texto": "Morrendo o ímpio, perece a sua esperança; e a expectativa da iniqüidade.",
   "referencia": "Provérbios 11:7",
   "livro": "Provérbios",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0061",
   "texto": "Somente em Deus espera silenciosa a minha alma; dele vem a minha salvação.",
   "referencia": "Salmos 62:1",
   "livro": "Salmos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0062",
   "texto": "Corrige a teu filho enquanto há esperança; mas não te incites a destruí-lo.",
   "referencia": "Provérbios 19:18",
   "livro": "Provérbios",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0063",
   "texto": "Isto é a minha consolação na minha angústia, que a tua promessa me vivifica.",
   "referencia": "Salmos 119:50",
   "livro": "Salmos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0064",
   "texto": "Antecipo-me à alva da manhã e clamo; aguardo com esperança as tuas palavras.",
   "referencia": "Salmos 119:147",
   "livro": "Salmos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0065",
   "texto": "A esperança adiada entristece o coração; mas o desejo cumprido é árvore devida.",
   "referencia": "Provérbios 13:12",
   "livro": "Provérbios",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0066",
   "texto": "Esperei com paciência pelo Senhor, e ele se inclinou para mim e ouviu o meu clamor.",
   "referencia": "Salmos 40:1",
   "livro": "Salmos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0067",
   "texto": "O cavalo é vã esperança para a vitória; não pode livrar ninguém pela sua grande força.",
   "referencia": "Salmos 33:17",
   "livro": "Salmos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0068",
   "texto": "Nota o homem íntegro, e considera o reto, porque há para o homem de paz um porvir feliz.",
   "referencia": "Salmos 37:37",
   "livro": "Salmos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0069",
   "texto": "Vês um homem precipitado nas suas palavras? Maior esperança há para o tolo do que para ele.",
   "referencia": "Provérbios 29:20",
   "livro": "Provérbios",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0070",
   "texto": "votos que os meus lábios pronunciaram e a minha boca prometeu, quando eu estava na angústia.",
   "referencia": "Salmos 66:14",
   "livro": "Salmos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0071",
   "texto": "Vês um homem que é sábio a seus próprios olhos? Maior esperança há para o tolo do que para ele.",
   "referencia": "Provérbios 26:12",
   "livro": "Provérbios",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0072",
   "texto": "Estou cansado de clamar; secou-se-me a garganta; os meus olhos desfalecem de esperar por meu Deus.",
   "referencia": "Salmos 69:3",
   "livro": "Salmos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0073",
   "texto": "Pois o necessitado não será esquecido para sempre, nem a esperança dos pobres será frustrada perpetuamente.",
   "referencia": "Salmos 9:18",
   "livro": "Salmos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0074",
   "texto": "Ampara-me conforme a tua palavra, para que eu viva; e não permitas que eu seja envergonhado na minha esperança.",
   "referencia": "Salmos 119:116",
   "livro": "Salmos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0075",
   "texto": "Quanto a Deus, o seu caminho é perfeito; a promessa do Senhor é provada; ele é um escudo para todos os que nele confiam.",
   "referencia": "Salmos 18:30",
   "livro": "Salmos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0076",
   "texto": "Espera no Senhor, e segue o seu caminho, e ele te exaltará para herdares a terra; tu o verás quando os ímpios forem exterminados.",
   "referencia": "Salmos 37:34",
   "livro": "Salmos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0077",
   "texto": "Descansa no Senhor, e espera nele; não te enfades por causa daquele que prospera em seu caminho, por causa do homem que executa maus desígnios.",
   "referencia": "Salmos 37:7",
   "livro": "Salmos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0078",
   "texto": "Por que estás abatida, ó minha alma, e por que te perturbas dentro de mim? Espera em Deus, pois ainda o louvarei, a ele que é o meu socorro, e o meu Deus.",
   "referencia": "Salmos 42:11",
   "livro": "Salmos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0079",
   "texto": "Afrontas quebrantaram-me o coração, e estou debilitado. Esperei por alguém que tivesse compaixão, mas não houve nenhum; e por consoladores, mas não os achei.",
   "referencia": "Salmos 69:20",
   "livro": "Salmos",
   "tema": "Esperança",
   "origem": "ampliado"
  },
  {
   "id": "amp-0080",
   "texto": "O meu povo habitará em morada de paz, em moradas bem seguras, e em lugares quietos de descanso.",
   "referencia": "Isaías 32:18",
   "livro": "Isaías",
   "tema": "Paz",
   "origem": "ampliado"
  },
  {
   "id": "amp-0081",
   "texto": "Não tenho repouso, nem sossego, nem descanso; mas vem a perturbação.",

   "tema": "Paz",
   "origem": "ampliado"
  },
  {

   "texto": "Eu sou pela paz; mas quando falo, eles são pela guerra.",

   "origem": "ampliado"
  },
  {

   "livro": "Provérbios",
   "tema": "Paz",
   "origem": "ampliado"
  },
  {
   "id": "amp-0084",
   "texto": "Volta, minha alma, ao teu repouso, pois o Senhor te fez bem.",

   "tema": "Paz",
   "origem": "ampliado"
  },
  {

   "texto": "Que os montes tragam paz ao povo, como também os outeiros, com justiça.",

   "livro": "Salmos",
   "tema": "Paz",
   "origem": "ampliado"
  },
  {

   "texto": "Haja paz dentro de teus muros, e prosperidade dentro dos teus palácios.",
   "referencia": "Salmos 122:7",
   "livro": "Salmos",
   "tema": "Paz",
   "origem": "ampliado"
  },
  {
   "id": "amp-0087",

   "livro": "Provérbios",
   "tema": "Paz",
   "origem": "ampliado"
  },
  {

   "texto": "Os seus caminhos são caminhos de delícias, e todas as suas veredas são paz.",
   "referencia": "Provérbios 3:17",
   "livro": "Provérbios",
   "tema": "Paz",
   "origem": "ampliado"
  },
  {
   "id": "amp-0089",

   "livro": "Salmos",
   "tema": "Paz",
   "origem": "ampliado"
  },
  {
   "id": "amp-0090",
   "texto": "O coração tranqüilo é a vida da carne; a inveja, porém, é a podridão dos ossos.",

   "livro": "Provérbios",
   "tema": "Paz",
   "origem": "ampliado"
  },
  {
   "id": "amp-0091",
   "texto": "Nos seus dias floresça a justiça, e haja abundância de paz enquanto durar a lua.",
   "referencia": "Salmos 72:7",
   "livro": "Salmos",
   "tema": "Paz",
   "origem": "ampliado"
  },
  {
   "id": "amp-0092",
   "texto": "Este é o lugar do meu repouso para sempre; aqui habitarei, pois o tenho desejado.",
   "referencia": "Salmos 132:14",
   "livro": "Salmos",
   "tema": "Paz",
   "origem": "ampliado"
  },
  {

   "tema": "Paz",
   "origem": "ampliado"
  },
  {

   "texto": "Engano há no coração dos que maquinam o mal; mas há gozo para os que aconselham a paz.",

   "tema": "Paz",
   "origem": "ampliado"
  },
  {

   "livro": "Salmos",

   "origem": "ampliado"
  },
  {
   "id": "amp-0096",

   "referencia": "Salmos 7:4",
   "livro": "Salmos",
   "tema": "Paz",
   "origem": "ampliado"
  },
  {
   "id": "amp-0097",
   "texto": "Deus meu, eu clamo de dia, porém tu não me ouves; também de noite, mas não acho sossego.",
   "referencia": "Salmos 22:2",
   "livro": "Salmos",
   "tema": "Paz",
   "origem": "ampliado"
  },
  {
   "id": "amp-0098",
   "texto": "O sábio que pleiteia com o insensato, quer este se agaste quer se ria, não terá descanso.",

   "livro": "Provérbios",
   "tema": "Paz",
   "origem": "ampliado"
  },
  {
   "id": "amp-0099",
   "texto": "Aquietai-vos, e sabei que eu sou Deus; sou exaltado entre as nações, sou exaltado na terra.",
   "referencia": "Salmos 46:10",
   "livro": "Salmos",
   "tema": "Paz",
   "origem": "ampliado"
  },
  {
   "id": "amp-0100",
   "texto": "Pelo que eu disse: Ah! quem me dera asas como de pomba! então voaria, e encontraria descanso.",

   "livro": "Salmos",
   "tema": "Paz",
   "origem": "ampliado"
  },
  {
   "id": "amp-0101",
   "texto": "Aquele meu companheiro estendeu a sua mão contra os que tinham paz com ele; violou o seu pacto.",
   "referencia": "Salmos 55:20",
   "livro": "Salmos",
   "tema": "Paz",
   "origem": "ampliado"
  },
  {
   "id": "amp-0102",
   "texto": "Livrará em paz a minha vida, de modo que ninguém se aproxime de mim; pois há muitos que contendem contra mim.",
   "referencia": "Salmos 55:18",
   "livro": "Salmos",
   "tema": "Paz",
   "origem": "ampliado"
  },
  {
   "id": "amp-0103",

   "livro": "Salmos",
   "tema": "Paz",
   "origem": "ampliado"
  },
  {
   "id": "amp-0104",

   "livro": "Salmos",
   "tema": "Paz",
   "origem": "ampliado"
  },
  {
   "id": "amp-0105",
   "texto": "A minha boca se enche do teu louvor e da tua glória continuamente.",

   "livro": "Salmos",
   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {

   "texto": "Cada dia te bendirei, e louvarei o teu nome pelos séculos dos séculos.",
   "referencia": "Salmos 145:2",
   "livro": "Salmos",
   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {
   "id": "amp-0107",
   "texto": "Tu és o meu Deus, e eu te darei graças; tu és o meu Deus, e eu te exaltarei.",
   "referencia": "Salmos 118:28",
   "livro": "Salmos",
   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {
   "id": "amp-0108",
   "texto": "Louvarei o nome de Deus com um cântico, e engrandecê-lo-ei com ação de graças.",

   "livro": "Salmos",
   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {
   "id": "amp-0109",
   "texto": "Eu te exaltarei, ó Deus, rei meu; e bendirei o teu nome pelos séculos dos séculos.",

   "livro": "Salmos",
   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {
   "id": "amp-0110",

   "tema": "Gratidão",
   "origem": "ampliado"

  {

   "livro": "Salmos",
   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {
   "id": "amp-0112",

   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {

   "origem": "ampliado"

  {

   "origem": "ampliado"
  },
  {

   "origem": "ampliado"

   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {

   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {

   "origem": "ampliado"
  },
  {

   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {

   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {

   "tema": "Gratidão",
   "origem": "ampliado"
  },

   "tema": "Gratidão",
   "origem": "ampliado"

   "origem": "ampliado"
  },
  {

   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {

   "livro": "Salmos",
   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {

   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {

   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {

   "tema": "Gratidão",
   "origem": "ampliado"
  },

   "livro": "Salmos",
   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {

   "livro": "Salmos",
   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {

   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {

   "tema": "Gratidão",

  },
  {

  },

  },
  {

   "origem": "ampliado"
  },
  {

  },
  {

  {

  {

  },
  {

   "origem": "ampliado"
  },
  {

   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {

   "livro": "Salmos",
   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {
   "id": "amp-0147",
   "texto": "Glória e majestade estão diante dele, força e formosura no seu santuário.",

   "livro": "Salmos",
   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {
   "id": "amp-0148",
   "texto": "Glória e majestade há em sua obra; e a sua justiça permanece para sempre.",

   "tema": "Gratidão",
   "origem": "ampliado"
  },
  {

   "origem": "ampliado"
  },
  {

  },
  {

  {

   "livro": "2 João",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0227",
   "texto": "Cantarei a benignidade e o juízo; a ti, Senhor, cantarei.",
   "referencia": "Salmos 101:1",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0228",
   "texto": "Levanta-te em nosso auxílio, e resgata-nos por tua benignidade.",
   "referencia": "Salmos 44:26",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0229",
   "texto": "Ajuda-me, Senhor, Deus meu; salva-me segundo a tua benignidade.",
   "referencia": "Salmos 109:26",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0230",
   "texto": "Temos meditado, ó Deus, na tua benignidade no meio do teu templo.",
   "referencia": "Salmos 48:9",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0231",
   "texto": "O ódio excita contendas; mas o amor cobre todas as transgressões.",
   "referencia": "Provérbios 10:12",
   "livro": "Provérbios",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0232",
   "texto": "Ouve, Senhor, e tem compaixão de mim! O Senhor, sê o meu ajudador!",
   "referencia": "Salmos 30:10",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0233",
   "texto": "Volta-te, Senhor, livra a minha alma; salva-me por tua misericórdia.",
   "referencia": "Salmos 6:4",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0234",
   "texto": "Mostra-nos, Senhor, a tua benignidade, e concede-nos a tua salvação.",
   "referencia": "Salmos 85:7",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0235",
   "texto": "Em paga do meu amor são meus adversários; mas eu me dedico à oração.",
   "referencia": "Salmos 109:4",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0236",
   "texto": "Volta-te para nós, Senhor! Até quando? Tem compaixão dos teus servos.",
   "referencia": "Salmos 90:13",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0237",
   "texto": "Por amor do teu nome, Senhor, perdoa a minha iniqüidade, pois é grande.",
   "referencia": "Salmos 25:11",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0238",
   "texto": "Digam, pois, os que temem ao Senhor: A sua benignidade dura para sempre.",
   "referencia": "Salmos 118:4",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0239",
   "texto": "Desvia de mim o caminho da falsidade, e ensina-me benignidade a tua lei.",
   "referencia": "Salmos 119:29",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0240",
   "texto": "Quando eu disse: O meu pé resvala; a tua benignidade, Senhor, me susteve.",
   "referencia": "Salmos 94:18",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0241",
   "texto": "que dá alimento a toda a carne, porque a sua benignidade dura para sempre.",
   "referencia": "Salmos 136:25",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0242",
   "texto": "Pois a tua benignidade é grande até os céus, e a tua verdade até as nuvens.",
   "referencia": "Salmos 57:10",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0243",
   "texto": "Refrigera a minha alma; guia-me nas veredas da justiça por amor do seu nome.",
   "referencia": "Salmos 23:3",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0244",
   "texto": "Olha para mim, e tem misericórdia de mim, porque estou desamparado e aflito.",
   "referencia": "Salmos 25:16",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0245",
   "texto": "Bondoso e compassivo é o Senhor, tardio em irar-se, e de grande benignidade.",
   "referencia": "Salmos 145:8",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0246",
   "texto": "Porque por amor de ti tenho suportado afrontas; a confusão me cobriu o rosto.",
   "referencia": "Salmos 69:7",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0247",
   "texto": "Para que sejam livres os teus amados, salva-nos com a tua destra, e ouve-nos.",
   "referencia": "Salmos 108:6",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0248",
   "texto": "A terra, ó Senhor, está cheia da tua benignidade; ensina-me os teus estatutos.",
   "referencia": "Salmos 119:64",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0249",
   "texto": "Porquanto a tua benignidade é melhor do que a vida, os meus lábios te louvarão.",
   "referencia": "Salmos 63:3",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0250",
   "texto": "Trata com o teu servo segundo a tua benignidade, e ensina-me os teus estatutos.",
   "referencia": "Salmos 119:124",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0251",
   "texto": "Pois a tua benignidade está diante dos meus olhos, e tenho andado na tua verdade.",
   "referencia": "Salmos 26:3",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0252",
   "texto": "Para que os teus amados sejam livres, salva-nos com a tua destra, e responde-nos.",
   "referencia": "Salmos 60:5",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0253",
   "texto": "Justiça e juízo são a base do teu trono; benignidade e verdade vão adiante de ti.",
   "referencia": "Salmos 89:14",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0254",
   "texto": "Quanto a mim, porém, ando na minha integridade; resgata-me e tem compaixão de mim.",
   "referencia": "Salmos 26:11",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0255",
   "texto": "Compassivo e misericordioso é o Senhor; tardio em irar-se e grande em benignidade.",
   "referencia": "Salmos 103:8",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0256",
   "texto": "Não obstante, ele os salvou por amor do seu nome, para fazer conhecido o seu poder.",
   "referencia": "Salmos 106:8",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0257",
   "texto": "Por isso fez com que obtivessem compaixão da parte daqueles que os levaram cativos.",
   "referencia": "Salmos 106:46",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0258",
   "texto": "A benignidade e a verdade guardam o rei; e com a benignidade sustém ele o seu trono.",
   "referencia": "Provérbios 20:28",
   "livro": "Provérbios",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0259",
   "texto": "Continua a tua benignidade aos que te conhecem, e a tua justiça aos retos de coração.",
   "referencia": "Salmos 36:10",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0260",
   "texto": "Conservar-lhe-ei para sempre a minha benignidade, e o meu pacto com ele ficará firme.",
   "referencia": "Salmos 89:28",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0261",
   "texto": "Vivifica-me segundo a tua benignidade, para que eu guarde os testemunhos da tua boca.",
   "referencia": "Salmos 119:88",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0262",
   "texto": "Considera como amo os teus preceitos; vivifica-me, Senhor, segundo a tua benignidade.",
   "referencia": "Salmos 119:159",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0263",
   "texto": "O que faz um homem desejável é a sua benignidade; e o pobre é melhor do que o mentiroso.",
   "referencia": "Provérbios 19:22",
   "livro": "Provérbios",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0264",
   "texto": "A ti também, Senhor, pertence a benignidade; pois retribuis a cada um segundo a sua obra.",
   "referencia": "Salmos 62:12",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0265",
   "texto": "Bendito seja Deus, que não rejeitou a minha oração, nem retirou de mim a sua benignidade.",
   "referencia": "Salmos 66:20",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0266",
   "texto": "Sirva, pois, a tua benignidade para me consolar, segundo a palavra que deste ao teu servo.",
   "referencia": "Salmos 119:76",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0267",
   "texto": "Ouve a minha voz, segundo a tua benignidade; vivifica-me, ó Senhor, segundo a tua justiça.",
   "referencia": "Salmos 119:149",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0268",
   "texto": "Venha também sobre mim a tua benignidade, ó Senhor, e a tua salvação, segundo a tua palavra.",
   "referencia": "Salmos 119:41",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0269",
   "texto": "Vivifica-me, ó Senhor, por amor do teu nome; por amor da tua justiça, tira-me da tribulação.",
   "referencia": "Salmos 143:11",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0270",
   "texto": "Pois que tanto me amou, eu o livrarei; pô-lo-ei num alto retiro, porque ele conhece o meu nome.",
   "referencia": "Salmos 91:14",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0271",
   "texto": "Pois grande, acima dos céus, é a tua benignidade, e a tua verdade ultrapassa as mais altas nuvens.",
   "referencia": "Salmos 108:4",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0272",
   "texto": "Quão preciosa é, ó Deus, a tua benignidade! Os filhos dos homens se refugiam à sombra das tuas asas.",
   "referencia": "Salmos 36:7",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0273",
   "texto": "Porque tu és a minha rocha e a minha fortaleza; pelo que, por amor do teu nome, guia-me e encaminha-me.",
   "referencia": "Salmos 31:3",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0274",
   "texto": "Tem compaixão de mim, Senhor, porque sou fraco; sara-me, Senhor, porque os meus ossos estão perturbados.",
   "referencia": "Salmos 6:2",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0275",
   "texto": "Sacia-nos de manhã com a tua benignidade, para que nos regozijemos e nos alegremos todos os nossos dias.",
   "referencia": "Salmos 90:14",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0276",
   "texto": "Pois quanto o céu está elevado acima da terra, assim é grande a sua benignidade para com os que o temem.",
   "referencia": "Salmos 103:11",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0277",
   "texto": "Porque tu, Senhor, és bom, e pronto a perdoar, e abundante em benignidade para com todos os que te invocam.",
   "referencia": "Salmos 86:5",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0278",
   "texto": "Pela misericórdia e pela verdade expia-se a iniqüidade; e pelo temor do Senhor os homens se desviam do mal.",
   "referencia": "Provérbios 16:6",
   "livro": "Provérbios",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0279",
   "texto": "O meu Deus com a sua benignidade virá ao meu encontro; Deus me fará ver o meu desejo sobre os meus inimigos.",
   "referencia": "Salmos 59:10",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0280",
   "texto": "A ti, ó força minha, cantarei louvores; porque Deus é a minha fortaleza, é o Deus que me mostra benignidade.",
   "referencia": "Salmos 59:17",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0281",
   "texto": "O que encobre as suas transgressões nunca prosperará; mas o que as confessa e deixa, alcançará misericórdia.",
   "referencia": "Provérbios 28:13",
   "livro": "Provérbios",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0282",
   "texto": "Todas as veredas do Senhor são misericórdia e verdade para aqueles que guardam o seu pacto e os seus testemunhos.",
   "referencia": "Salmos 25:10",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0283",
   "texto": "Tem misericórdia de mim, Senhor; olha a aflição que sofro daqueles que me odeiam, tu que me levantas das portas da morte.",
   "referencia": "Salmos 9:13",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0284",
   "texto": "Inútil vos será levantar de madrugada, repousar tarde, comer o pão de dores, pois ele supre aos seus amados enquanto dormem.",
   "referencia": "Salmos 127:2",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0285",
   "texto": "Amai ao Senhor, vós todos os que sois seus santos; o Senhor guarda os fiéis, e retribui abundantemente ao que usa de soberba.",
   "referencia": "Salmos 31:23",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0286",
   "texto": "Tem compaixão de mim, ó Senhor, porque estou angustiado; consumidos estão de tristeza os meus olhos, a minha alma e o meu corpo.",
   "referencia": "Salmos 31:9",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0287",
   "texto": "Compadece-te de mim, ó Deus, segundo a tua benignidade; apaga as minhas tansgressões, segundo a multidão das tuas misericórdias.",
   "referencia": "Salmos 51:1",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0288",
   "texto": "Certamente que a bondade e a misericórdia me seguirão todos os dias da minha vida, e habitarei na casa do Senhor por longos dias.",
   "referencia": "Salmos 23:6",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0289",
   "texto": "O Senhor aperfeiçoará o que me diz respeito. A tua benignidade, ó Senhor, dura para sempre; não abandones as obras das tuas mãos.",
   "referencia": "Salmos 138:8",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0290",
   "texto": "Como corça amorosa, e graciosa cabra montesa saciem-te os seus seios em todo o tempo; e pelo seu amor sê encantado perpetuamente.",
   "referencia": "Provérbios 5:19",
   "livro": "Provérbios",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0291",
   "texto": "Responde-me quando eu clamar, ó Deus da minha justiça! Na angústia me deste largueza; tem misericórdia de mim e ouve a minha oração.",
   "referencia": "Salmos 4:1",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0292",
   "texto": "Não te lembres contra nós das iniqüidades de nossos pais; venha depressa ao nosso encontro a tua compaixão, pois estamos muito abatidos.",
   "referencia": "Salmos 79:8",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0293",
   "texto": "Faze-me ouvir da tua benignidade pela manhã, pois em ti confio; faze-me saber o caminho que devo seguir, porque a ti elevo a minha alma.",
   "referencia": "Salmos 143:8",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0294",
   "texto": "Porquanto não se lembrou de usar de benignidade; antes perseguiu o varão aflito e o necessitado, como também o quebrantado de coração, para o matar.",
   "referencia": "Salmos 109:16",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0295",
   "texto": "Não te lembres dos pecado da minha mocidade, nem das minhas transgressões; mas, segundo a tua misericórdia, lembra-te de mim, pela tua bondade, ó Senhor.",
   "referencia": "Salmos 25:7",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0296",
   "texto": "Fira-me o justo, será isso uma benignidade; e repreenda-me, isso será como óleo sobre a minha cabeça; não o recuse a minha cabeça; mas continuarei a orar contra os feitos dos ímpios.",
   "referencia": "Salmos 141:5",
   "livro": "Salmos",
   "tema": "Amor",
   "origem": "ampliado"
  },
  {
   "id": "amp-0297",
   "texto": "Filho meu, ouve a instrução de teu pai, e não deixes o ensino de tua mãe.",
   "referencia": "Provérbios 1:8",
   "livro": "Provérbios",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0298",
   "texto": "O filho sábio alegra a seu pai; mas o homem insensato despreza a sua mãe.",
   "referencia": "Provérbios 15:20",
   "livro": "Provérbios",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0299",
   "texto": "O que aflige a seu pai, e faz fugir a sua mãe, é filho que envergonha e desonra.",
   "referencia": "Provérbios 19:26",
   "livro": "Provérbios",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0300",
   "texto": "Tornei-me como um estranho para os meus irmãos, e um desconhecido para os filhos de minha mãe.",
   "referencia": "Salmos 69:8",
   "livro": "Salmos",
