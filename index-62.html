   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0367",
   "texto": "O meu hálito é intolerável à minha mulher; sou repugnante aos filhos de minha mãe.",
   "referencia": "Jó 19:17",
   "livro": "Jó",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0368",
   "texto": "Muito me alegro por ter achado alguns de teus filhos andando na verdade, assim como recebemos mandamento do Pai.",
   "referencia": "2 João 1:4",
   "livro": "2 João",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0369",
   "texto": "Deus, dizeis vós, reserva a iniqüidade do pai para seus filhos, mas é a ele mesmo que Deus deveria punir, para que o conheça.",
   "referencia": "Jó 21:19",
   "livro": "Jó",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0370",
   "texto": "Todo aquele que vai além do ensino de Cristo e não permanece nele, não tem a Deus; quem permanece neste ensino, esse tem tanto ao Pai como ao Filho.",
   "referencia": "2 João 1:9",
   "livro": "2 João",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0371",
   "texto": "Pai de órfãos e juiz de viúvas é Deus na sua santa morada.",
   "referencia": "Salmos 68:5",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0372",
   "texto": "Vinde, filhos, ouvi-me; eu vos ensinarei o temor do Senhor.",
   "referencia": "Salmos 34:11",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0373",
   "texto": "Aumente-vos o Senhor cada vez mais, a vós e a vossos filhos.",
   "referencia": "Salmos 115:14",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0374",
   "texto": "Filho meu, se os pecadores te quiserem seduzir, não consintas.",
   "referencia": "Provérbios 1:10",
   "livro": "Provérbios",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0375",
   "texto": "Eis que eu nasci em iniqüidade, e em pecado me concedeu minha mãe.",
   "referencia": "Salmos 51:5",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0376",
   "texto": "Ó Deus, dá ao rei os teus juízes, e a tua justiça ao filho do rei.",
   "referencia": "Salmos 72:1",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0377",
   "texto": "Ouve tu, filho meu, e sê sábio; e dirige no caminho o teu coração.",
   "referencia": "Provérbios 23:19",
   "livro": "Provérbios",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0378",
   "texto": "Como flechas na mão dum homem valente, assim os filhos da mocidade.",
   "referencia": "Salmos 127:4",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0379",
   "texto": "O inimigo não o surpreenderá, nem o filho da perversidade o afligirá.",
   "referencia": "Salmos 89:22",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0380",
   "texto": "Pois o Senhor não rejeitará o seu povo, nem desamparará a sua herança.",
   "referencia": "Salmos 94:14",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0381",
   "texto": "Pois tu formaste os meus rins; entreteceste-me no ventre de minha mãe.",
   "referencia": "Salmos 139:13",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0382",
   "texto": "A vós, ó homens, clamo; e a minha voz se dirige aos filhos dos homens.",
   "referencia": "Provérbios 8:4",
   "livro": "Provérbios",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0383",
   "texto": "Agora, pois, filhos, ouvi-me, e estai atentos às palavras da minha boca.",
   "referencia": "Provérbios 7:24",
   "livro": "Provérbios",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0384",
   "texto": "Pisarás o leão e a áspide; calcarás aos pés o filho do leão e a serpente.",
   "referencia": "Salmos 91:13",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0385",
   "texto": "Não confieis em príncipes, nem em filho de homem, em quem não há auxílio.",
   "referencia": "Salmos 146:3",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0386",
   "texto": "que dá aos animais o seu alimento, e aos filhos dos corvos quando clamam.",
   "referencia": "Salmos 147:9",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0387",
   "texto": "Quem encontra uma esposa acha uma coisa boa; e alcança o favor do Senhor.",
   "referencia": "Provérbios 18:22",
   "livro": "Provérbios",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0388",
   "texto": "Falarei do decreto do Senhor; ele me disse: Tu és meu Filho, hoje te gerei.",
   "referencia": "Salmos 2:7",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0389",
   "texto": "Mostrou ao seu povo o poder das suas obras, dando-lhe a herança das nações.",
   "referencia": "Salmos 111:6",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0390",
   "texto": "O Senhor desarraiga a casa dos soberbos, mas estabelece a herança da viúva.",
   "referencia": "Provérbios 15:25",
   "livro": "Provérbios",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0391",
   "texto": "Os céus são os céus do Senhor, mas a terra, deu-a ele aos filhos dos homens.",
   "referencia": "Salmos 115:16",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0392",
   "texto": "As sortes me caíram em lugares deliciosos; sim, coube-me uma formosa herança.",
   "referencia": "Salmos 16:6",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0393",
   "texto": "testemunha falsa que profere mentiras, e o que semeia contendas entre irmãos.",
   "referencia": "Provérbios 6:19",
   "livro": "Provérbios",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0394",
   "texto": "A sua descendência será poderosa na terra; a geração dos retos será abençoada.",
   "referencia": "Salmos 112:2",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0395",
   "texto": "Filho meu, guarda as minhas palavras, e entesoura contigo os meus mandamentos.",
   "referencia": "Provérbios 7:1",
   "livro": "Provérbios",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0396",
   "texto": "Filho meu, dá-me o teu coração; e deleitem-se os teus olhos nos meus caminhos.",
   "referencia": "Provérbios 23:26",
   "livro": "Provérbios",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0397",
   "texto": "Come mel, filho meu, porque é bom, e do favo de mel, que é doce ao teu paladar.",
   "referencia": "Provérbios 24:13",
   "livro": "Provérbios",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0398",
   "texto": "Salva o teu povo, e abençoa a tua herança; apascenta-os e exalta-os para sempre.",
   "referencia": "Salmos 28:9",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0399",
   "texto": "O Senhor conhece os dias dos íntegros, e a herança deles permanecerá para sempre.",
   "referencia": "Salmos 37:18",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0400",
   "texto": "Agora, pois, filhos, ouvi-me; porque felizes são os que guardam os meus caminhos.",
   "referencia": "Provérbios 8:32",
   "livro": "Provérbios",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0401",
   "texto": "A herança que no princípio é adquirida às pressas, não será abençoada no seu fim.",
   "referencia": "Provérbios 20:21",
   "livro": "Provérbios",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0402",
   "texto": "O que gera um tolo, para sua tristeza o faz; e o pai do insensato não se alegrará.",
   "referencia": "Provérbios 17:21",
   "livro": "Provérbios",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0403",
   "texto": "O justo anda na sua integridade; bem-aventurados serão os seus filhos depois dele.",
   "referencia": "Provérbios 20:7",
   "livro": "Provérbios",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0404",
   "texto": "Agora, pois, filhos, dai-me ouvidos, e não vos desvieis das palavras da minha boca.",
   "referencia": "Provérbios 5:7",
   "livro": "Provérbios",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0405",
   "texto": "Em lugar de teus pais estarão teus filhos; tu os farás príncipes sobre toda a terra.",
   "referencia": "Salmos 45:16",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0406",
   "texto": "Pois tu, ó Deus, ouviste os meus votos; deste-me a herança dos que temem o teu nome.",
   "referencia": "Salmos 61:5",
   "livro": "Salmos",
   "tema": "Família",
   "origem": "ampliado"
  },
  {
   "id": "amp-0407",
   "texto": "O espírito do homem o sustentará na sua enfermidade; mas ao espírito abatido quem o levantará?",
   "referencia": "Provérbios 18:14",
   "livro": "Provérbios",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0408",
   "texto": "Eu me deito e durmo; acordo, pois o Senhor me sustenta.",
   "referencia": "Salmos 3:5",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0409",
   "texto": "Salvou-os da mão do adversário, livrou-os do poder do inimigo.",
   "referencia": "Salmos 106:10",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0410",
   "texto": "Hete. Cinge os seus lombos de força, e fortalece os seus braços.",
   "referencia": "Provérbios 31:17",
   "livro": "Provérbios",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0411",
   "texto": "Isso será saúde para a tua carne; e refrigério para os teus ossos.",
   "referencia": "Provérbios 3:8",
   "livro": "Provérbios",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0412",
   "texto": "Eis que Deus é o meu ajudador; o Senhor é quem sustenta a minha vida.",
   "referencia": "Salmos 54:4",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0413",
   "texto": "Trouxe-me para um lugar espaçoso; livrou-me, porque tinha prazer em mim.",
   "referencia": "Salmos 18:19",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0414",
   "texto": "A minha alma se consome de tristeza; fortalece-me segundo a tua palavra.",
   "referencia": "Salmos 119:28",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0415",
   "texto": "Pois os braços dos ímpios serão quebrados, mas o Senhor sustém os justos.",
   "referencia": "Salmos 37:17",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0416",
   "texto": "Cria em mim, ó Deus, um coração puro, e renova em mim um espírito estável.",
   "referencia": "Salmos 51:10",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0417",
   "texto": "Sustenta-me, e serei salvo, e de contínuo terei respeito aos teus estatutos.",
   "referencia": "Salmos 119:117",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0418",
   "texto": "Clamou este pobre, e o Senhor o ouviu, e o livrou de todas as suas angústias.",
   "referencia": "Salmos 34:6",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0419",
   "texto": "Restitui-me a alegria da tua salvação, e sustém-me com um espírito voluntário.",
   "referencia": "Salmos 51:12",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0420",
   "texto": "Palavras suaves são como favos de mel, doçura para a alma e saúde para o corpo.",
   "referencia": "Provérbios 16:24",
   "livro": "Provérbios",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0421",
   "texto": "Alguma coisa ruim se lhe apega; e agora que está deitado, não se levantará mais.",
   "referencia": "Salmos 41:8",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0422",
   "texto": "quem te supre de todo o bem, de sorte que a tua mocidade se renova como a da águia.",
   "referencia": "Salmos 103:5",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0423",
   "texto": "Porque de repente se levantará a sua calamidade; e a ruína deles, quem a conhecerá?",
   "referencia": "Provérbios 24:22",
   "livro": "Provérbios",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0424",
   "texto": "O Senhor sustém a todos os que estão a cair, e levanta a todos os que estão abatidos.",
   "referencia": "Salmos 145:14",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0425",
   "texto": "Desvia de mim o teu olhar, para que eu tome alento, antes que me vá e não exista mais.",
   "referencia": "Salmos 39:13",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0426",
   "texto": "Livrou-me do meu inimigo forte e daqueles que me odiavam; pois eram mais poderosos do que eu.",
   "referencia": "Salmos 18:17",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0427",
   "texto": "O que perdoa a transgressão busca a amizade; mas o que renova a questão, afastam amigos íntimos.",
   "referencia": "Provérbios 17:9",
   "livro": "Provérbios",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0428",
   "texto": "Não me enjeites no tempo da velhice; não me desampares, quando se forem acabando as minhas forças.",
   "referencia": "Salmos 71:9",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0429",
   "texto": "Pois já as minhas iniqüidades submergem a minha cabeça; como carga pesada excedem as minhas forças.",
   "referencia": "Salmos 38:4",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0430",
   "texto": "Também me deste o escudo da tua salvação; a tua mão direita me sustém, e a tua clemência me engrandece.",
   "referencia": "Salmos 18:35",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0431",
   "texto": "Muitas vezes os livrou; mas eles foram rebeldes nos seus desígnios, e foram abatidos pela sua iniqüidade.",
   "referencia": "Salmos 106:43",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0432",
   "texto": "o vinho que alegra o seu coração, o azeite que faz reluzir o seu rosto, e o pão que lhe fortalece o coração.",
   "referencia": "Salmos 104:15",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0433",
   "texto": "Não há coisa sã na minha carne, por causa da tua cólera; nem há saúde nos meus ossos, por causa do meu pecado.",
   "referencia": "Salmos 38:3",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0434",
   "texto": "Mas, quanto a mim, estando eles enfermos, vestia-me de cilício, humilhava-me com o jejum, e orava de cabeça sobre o peito.",
   "referencia": "Salmos 35:13",
   "livro": "Salmos",
   "tema": "Cura",
   "origem": "ampliado"
  },
  {
   "id": "amp-0435",
   "texto": "Arrepia-se-me a carne com temor de ti, e tenho medo dos teus juízos.",
   "referencia": "Salmos 119:120",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0436",
   "texto": "Por que escondes o teu rosto, e te esqueces da nossa tribulação e da nossa angústia?",
   "referencia": "Salmos 44:24",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0437",
   "texto": "Tribulação e angústia se apoderaram de mim; mas os teus mandamentos são o meu prazer.",
   "referencia": "Salmos 119:143",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0438",
   "texto": "Porque em muita tribulação e angústia de coração vos escrevi, com muitas lágrimas, não para que vos entristecêsseis, mas para que conhecêsseis o amor que abundantemente vos tenho.",
   "referencia": "2 Coríntios 2:4",
   "livro": "2 Coríntios",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0439",
   "texto": "Amedrontam-no a angústia e a tribulação; prevalecem contra ele, como um rei preparado para a peleja.",
   "referencia": "Jó 15:24",
   "livro": "Jó",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0440",
   "texto": "Se enfraqueces no dia da angústia, a tua força é pequena.",
   "referencia": "Provérbios 24:10",
   "livro": "Provérbios",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0441",
   "texto": "No dia da minha angústia clamo a ti, porque tu me respondes.",
   "referencia": "Salmos 86:7",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0442",
   "texto": "O justo é libertado da angústia; e o ímpio fica em seu lugar.",
   "referencia": "Provérbios 11:8",
   "livro": "Provérbios",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0443",
   "texto": "Não temas o pavor repentino, nem a assolação dos ímpios quando vier.",
   "referencia": "Provérbios 3:25",
   "livro": "Provérbios",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0444",
   "texto": "Olha para a minha aflição, e livra-me, pois não me esqueço da tua lei.",
   "referencia": "Salmos 119:153",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0445",
   "texto": "Não te alongues de mim, pois a angústia está perto, e não há quem acuda.",
   "referencia": "Salmos 22:11",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0446",
   "texto": "O temor do Senhor aumenta os dias; mas os anos os ímpios serão abreviados.",
   "referencia": "Provérbios 10:27",
   "livro": "Provérbios",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0447",
   "texto": "Derramo perante ele a minha queixa; diante dele exponho a minha tribulação.",
   "referencia": "Salmos 142:2",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0448",
   "texto": "Olha para a minha aflição e para a minha dor, e perdoa todos os meus pecados.",
   "referencia": "Salmos 25:18",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0449",
   "texto": "Pela transgressão dos lábios se enlaça o mau; mas o justo escapa da angústia.",
   "referencia": "Provérbios 12:13",
   "livro": "Provérbios",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0450",
   "texto": "Quem anda com os sábios será sábio; mas o companheiro dos tolos sofre aflição.",
   "referencia": "Provérbios 13:20",
   "livro": "Provérbios",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0451",
   "texto": "Senhor, incute-lhes temor! Que as nações saibam que não passam de meros homens!",
   "referencia": "Salmos 9:20",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0452",
   "texto": "Se a tua lei não fora o meu deleite, então eu teria perecido na minha angústia.",
   "referencia": "Salmos 119:92",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0453",
   "texto": "Não tenhas inveja dos pecadores; antes conserva-te no temor do Senhor todo o dia.",
   "referencia": "Provérbios 23:17",
   "livro": "Provérbios",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0454",
   "texto": "Não tenho medo dos dez milhares de pessoas que se puseram contra mim ao meu redor.",
   "referencia": "Salmos 3:6",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0455",
   "texto": "O temor do Senhor é uma fonte de vida, para o homem se desviar dos laços da morte.",
   "referencia": "Provérbios 14:27",
   "livro": "Provérbios",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0456",
   "texto": "Do meio da angústia invoquei o Senhor; o Senhor me ouviu, e me pôs em um lugar largo.",
   "referencia": "Salmos 118:5",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0457",
   "texto": "O Senhor é também um alto refúgio para o oprimido, um alto refúgio em tempos de angústia.",
   "referencia": "Salmos 9:9",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0458",
   "texto": "Porque tu me livraste de toda a angústia; e os meus olhos viram a ruína dos meus inimigos.",
   "referencia": "Salmos 54:7",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0459",
   "texto": "Melhor é o pouco com o temor do Senhor, do que um grande tesouro, e com ele a inquietação.",
   "referencia": "Provérbios 15:16",
   "livro": "Provérbios",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0460",
   "texto": "Tu és o meu esconderijo; preservas-me da angústia; de alegres cânticos de livramento me cercas.",
   "referencia": "Salmos 32:7",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0461",
   "texto": "A transgressão fala ao ímpio no íntimo do seu coração; não há temor de Deus perante os seus olhos.",
   "referencia": "Salmos 36:1",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0462",
   "texto": "Quando ele me invocar, eu lhe responderei; estarei com ele na angústia, livrá-lo-ei, e o honrarei.",
   "referencia": "Salmos 91:15",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0463",
   "texto": "O temor do Senhor encaminha para a vida; aquele que o tem ficará satisfeito, e mal nenhum o visitará.",
   "referencia": "Provérbios 19:23",
   "livro": "Provérbios",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0464",
   "texto": "Lâmede. Não tem medo da neve pela sua família; pois todos os da sua casa estão vestidos de escarlate.",
   "referencia": "Provérbios 31:21",
   "livro": "Provérbios",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0465",
   "texto": "Os meus olhos desfalecem por causa da aflição. Clamo a ti todo dia, Senhor, estendendo-te as minhas mãos.",
   "referencia": "Salmos 88:9",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0466",
   "texto": "O temor do Senhor é odiar o mal; a soberba, e a arrogância, e o mau caminho, e a boca perversa, eu os odeio.",
   "referencia": "Provérbios 8:13",
   "livro": "Provérbios",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0467",
   "texto": "O temor do Senhor é limpo, e permanece para sempre; os juízos do Senhor são verdadeiros e inteiramente justos.",
   "referencia": "Salmos 19:9",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0468",
   "texto": "O seu coração está bem firmado, ele não terá medo, até que veja cumprido o seu desejo sobre os seus adversários.",
   "referencia": "Salmos 112:8",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0469",
   "texto": "Porque não desprezou nem abominou a aflição do aflito, nem dele escondeu o seu rosto; antes, quando ele clamou, o ouviu.",
   "referencia": "Salmos 22:24",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0470",
   "texto": "No dia da minha angústia busco ao Senhor; de noite a minha mão fica estendida e não se cansa; a minha alma recusa ser consolada.",
   "referencia": "Salmos 77:2",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0471",
   "texto": "Embora eu ande no meio da angústia, tu me revivificas; contra a ira dos meus inimigos estendes a tua mão, e a tua destra me salva.",
   "referencia": "Salmos 138:7",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0472",
   "texto": "Não escondas de mim o teu rosto no dia da minha angústia; inclina para mim os teus ouvidos; no dia em que eu clamar, ouve-me depressa.",
   "referencia": "Salmos 102:2",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0473",
   "texto": "Os que habitam os confins da terra são tomados de medo à vista dos teus sinais; tu fazes exultar de júbilo as saídas da manhã e da tarde.",
   "referencia": "Salmos 65:8",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0474",
   "texto": "Na minha angústia invoquei o Senhor, sim, clamei ao meu Deus; do seu templo ouviu ele a minha voz; o clamor que eu lhe fiz chegou aos seus ouvidos.",
   "referencia": "Salmos 18:6",
   "livro": "Salmos",
   "tema": "Ansiedade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0475",
   "texto": "Abençoarei abundantemente o seu mantimento; fartarei de pão os seus necessitados.",
   "referencia": "Salmos 132:15",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0476",
   "texto": "no verão faz a provisão do seu mantimento, e ajunta o seu alimento no tempo da ceifa.",
   "referencia": "Provérbios 6:8",
   "livro": "Provérbios",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0477",
   "texto": "Todos esperam de ti que lhes dês o sustento a seu tempo.",
   "referencia": "Salmos 104:27",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0478",
   "texto": "A salvação vem do Senhor; sobre o teu povo seja a tua bênção.",
   "referencia": "Salmos 3:8",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0479",
   "texto": "Dá mantimento aos que o temem; lembra-se sempre do seu pacto.",
   "referencia": "Salmos 111:5",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0480",
   "texto": "A alma generosa prosperará, e o que regar também será regado.",
   "referencia": "Provérbios 11:25",
   "livro": "Provérbios",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0481",
   "texto": "abençoará os que temem ao Senhor, tanto pequenos como grandes.",
   "referencia": "Salmos 115:13",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0482",
   "texto": "Riquezas e honra estão comigo; sim, riquezas duráveis e justiça.",
   "referencia": "Provérbios 8:18",
   "livro": "Provérbios",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0483",
   "texto": "Chamou a fome sobre a terra; retirou-lhes todo o sustento do pão.",
   "referencia": "Salmos 105:16",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0484",
   "texto": "Pois eu tinha inveja dos soberbos, ao ver a prosperidade dos ímpios.",
   "referencia": "Salmos 73:3",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0485",
   "texto": "A mulher aprazível obtém honra, e os homens violentos obtêm riquezas.",
   "referencia": "Provérbios 11:16",
   "livro": "Provérbios",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0486",
   "texto": "Deram-me fel por mantimento, e na minha sede me deram a beber vinagre.",
   "referencia": "Salmos 69:21",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0487",
   "texto": "Mais vale o pouco que o justo tem, do que as riquezas de muitos ímpios.",
   "referencia": "Salmos 37:16",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0488",
   "texto": "Desde a antigüidade fundaste a terra; e os céus são obra das tuas mãos.",
   "referencia": "Salmos 102:25",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0489",
   "texto": "Este receberá do Senhor uma bênção, e a justiça do Deus da sua salvação.",
   "referencia": "Salmos 24:5",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0490",
   "texto": "Longura de dias há na sua mão direita; na sua esquerda riquezas e honra.",
   "referencia": "Provérbios 3:16",
   "livro": "Provérbios",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0491",
   "texto": "dos que confiam nos seus bens e se gloriam na multidão das suas riquezas?",
   "referencia": "Salmos 49:6",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0492",
   "texto": "Eis que estes são ímpios; sempre em segurança, aumentam as suas riquezas.",
   "referencia": "Salmos 73:12",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0493",
   "texto": "Casa e riquezas são herdadas dos pais; mas a mulher prudente vem do Senhor.",
   "referencia": "Provérbios 19:14",
   "livro": "Provérbios",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0494",
   "texto": "Os leões novos os animais bramam pela presa, e de Deus buscam o seu sustento.",
   "referencia": "Salmos 104:21",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0495",
   "texto": "Regozijo-me no caminho dos teus testemunhos, tanto como em todas as riquezas.",
   "referencia": "Salmos 119:14",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0496",
   "texto": "De nada aproveitam as riquezas no dia da ira; porém a justiça livra da morte.",
   "referencia": "Provérbios 11:4",
   "livro": "Provérbios",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0497",
   "texto": "Pela bênção dos retos se exalta a cidade; mas pela boca dos ímpios é derrubada.",
   "referencia": "Provérbios 11:11",
   "livro": "Provérbios",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0498",
   "texto": "As riquezas granjeiam muitos amigos; mas do pobre o seu próprio amigo se separa.",
   "referencia": "Provérbios 19:4",
   "livro": "Provérbios",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0499",
   "texto": "Bênçãos caem sobre a cabeça do justo; porém a boca dos ímpios esconde a violência.",
   "referencia": "Provérbios 10:6",
   "livro": "Provérbios",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0500",
   "texto": "Abundância de mantimento há, na lavoura do pobre; mas se perde por falta de juízo.",
   "referencia": "Provérbios 13:23",
   "livro": "Provérbios",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0501",
   "texto": "porque as riquezas não duram para sempre; e duraria a coroa de geração em geração?",
   "referencia": "Provérbios 27:24",
   "livro": "Provérbios",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0502",
   "texto": "Pois o proveste de bênçãos excelentes; puseste-lhe na cabeça uma coroa de ouro fino.",
   "referencia": "Salmos 21:3",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0503",
   "texto": "Ó Senhor, salva, nós te pedimos; ó Senhor, nós te pedimos, envia-nos a prosperidade.",
   "referencia": "Salmos 118:25",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0504",
   "texto": "Tu esmagaste as cabeças do leviatã, e o deste por mantimento aos habitantes do deserto.",
   "referencia": "Salmos 74:14",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0505",
   "texto": "Lembro-me dos dias antigos; considero todos os teus feitos; medito na obra das tuas mãos.",
   "referencia": "Salmos 143:5",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0506",
   "texto": "Ao que retém o trigo o povo o amaldiçoa; mas bênção haverá sobre a cabeça do que o vende.",
   "referencia": "Provérbios 11:26",
   "livro": "Provérbios",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0507",
   "texto": "O resgate da vida do homem são as suas riquezas; mas o pobre não tem meio de se resgatar.",
   "referencia": "Provérbios 13:8",
   "livro": "Provérbios",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0508",
   "texto": "Aquele que é cobiçoso corre atrás das riquezas; e não sabe que há de vir sobre ele a penúria.",
   "referencia": "Provérbios 28:22",
   "livro": "Provérbios",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0509",
   "texto": "nem dizem os que passam: A bênção do Senhor seja sobre vós; nós vos abençoamos em nome do Senhor.",
   "referencia": "Salmos 129:8",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0510",
   "texto": "Fitando tu os olhos nas riquezas, elas se vão; pois fazem para si asas, como a águia, voam para o céu.",
   "referencia": "Provérbios 23:5",
   "livro": "Provérbios",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0511",
   "texto": "Vave. E quando ainda está escuro, ela se levanta, e dá mantimento à sua casa, e a tarefa às suas servas.",
   "referencia": "Provérbios 31:15",
   "livro": "Provérbios",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0512",
   "texto": "Mais digno de ser escolhido é o bom nome do que as muitas riquezas; e o favor é melhor do que a prata e o ouro.",
   "referencia": "Provérbios 22:1",
   "livro": "Provérbios",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0513",
   "texto": "Não confieis na opressão, nem vos vanglorieis na rapina; se as vossas riquezas aumentarem, não ponhais nelas o coração.",
   "referencia": "Salmos 62:10",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0514",
   "texto": "Ó Senhor, quão multiformes são as tuas obras! Todas elas as fizeste com sabedoria; a terra está cheia das tuas riquezas.",
   "referencia": "Salmos 104:24",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0515",
   "texto": "Na verdade, todo homem anda qual uma sombra; na verdade, em vão se inquieta, amontoa riquezas, e não sabe quem as levará.",
   "referencia": "Salmos 39:6",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0516",
   "texto": "Eis aqui o homem que não tomou a Deus por sua fortaleza; antes confiava na abundância das suas riquezas, e se fortalecia na sua perversidade.",
   "referencia": "Salmos 52:7",
   "livro": "Salmos",
   "tema": "Prosperidade",
   "origem": "ampliado"
  },
  {
   "id": "amp-0517",
   "texto": "Não há sabedoria, nem entendimento, nem conselho contra o Senhor.",
   "referencia": "Provérbios 21:30",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0518",
   "texto": "Meu é o conselho, e a verdadeira sabedoria; eu sou o entendimento; minha é a fortaleza.",
   "referencia": "Provérbios 8:14",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0519",
   "texto": "Instrui ao sábio, e ele se fará mais, sábio; ensina ao justo, e ele crescerá em entendimento.",
   "referencia": "Provérbios 9:9",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0520",
   "texto": "Aprendei, ó simples, a prudência; entendei, ó loucos, a sabedoria.",
   "referencia": "Provérbios 8:5",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0521",
   "texto": "Não clama porventura a sabedoria, e não faz o entendimento soar a sua voz?",
   "referencia": "Provérbios 8:1",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0522",
   "texto": "O Senhor pela sabedoria fundou a terra; pelo entendimento estabeleceu o céu.",
   "referencia": "Provérbios 3:19",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0523",
   "texto": "Eu, a sabedoria, habito com a prudência, e possuo o conhecimento e a discrição.",
   "referencia": "Provérbios 8:12",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0524",
   "texto": "A minha boca falará a sabedoria, e a meditação do meu coração será de entendimento.",
   "referencia": "Salmos 49:3",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0525",
   "texto": "Compra a verdade, e não a vendas; sim, a sabedoria, a disciplina, e o entendimento.",
   "referencia": "Provérbios 23:23",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0526",
   "texto": "O que adquire a sabedoria é amigo de si mesmo; o que guarda o entendimento prosperará.",
   "referencia": "Provérbios 19:8",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0527",
   "texto": "O caminho do insensato é reto aos seus olhos; mas o que dá ouvidos ao conselho é sábio.",
   "referencia": "Provérbios 12:15",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0528",
   "texto": "O homem rico é sábio aos seus próprios olhos; mas o pobre que tem entendimento o esquadrinha.",
   "referencia": "Provérbios 28:11",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0529",
   "texto": "De que serve o preço na mão do tolo para comprar a sabedoria, visto que ele não tem entendimento?",
   "referencia": "Provérbios 17:16",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0530",
   "texto": "Adquire a sabedoria, adquire o entendimento; não te esqueças nem te desvies das palavras da minha boca.",
   "referencia": "Provérbios 4:5",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0531",
   "texto": "Nos lábios do entendido se acha a sabedoria; mas a vara é para as costas do que é falto de entendimento.",
   "referencia": "Provérbios 10:13",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0532",
   "texto": "Fere ao escarnecedor, e o simples aprenderá a prudência; repreende ao que tem entendimento, e ele crescerá na ciência.",
   "referencia": "Provérbios 19:25",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0533",
   "texto": "Quem dentre vós é sábio e entendido? Mostre pelo seu bom procedimento as suas obras em mansidão de sabedoria.",
   "referencia": "Tiago 3:13",
   "livro": "Tiago",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0534",
   "texto": "Com Deus está a sabedoria e a força; ele tem conselho e entendimento.",
   "referencia": "Jó 12:13",
   "livro": "Jó",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0535",
   "texto": "A sabedoria fortalece ao sábio mais do que dez governadores que haja na cidade.",
   "referencia": "Eclesiastes 7:19",
   "livro": "Eclesiastes",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0536",
   "texto": "Ora, achou-se nela um sábio pobre, que livrou a cidade pela sua sabedoria; contudo ninguém se lembrou mais daquele homem pobre.",
   "referencia": "Eclesiastes 9:15",
   "livro": "Eclesiastes",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0537",
   "texto": "É ele quem fez a terra com o seu poder, estabeleceu o mundo com a sua sabedoria, e estendeu os céus com o seu entendimento.",
   "referencia": "Jeremias 51:15",
   "livro": "Jeremias",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0538",
   "texto": "porque Deus a privou de sabedoria, e não lhe repartiu entendimento.",
   "referencia": "Jó 39:17",
   "livro": "Jó",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0539",
   "texto": "Com os anciãos está a sabedoria, e na longura de dias o entendimento.",
   "referencia": "Jó 12:12",
   "livro": "Jó",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0540",
   "texto": "Quem pôs sabedoria nas densas nuvens, ou quem deu entendimento ao meteoro?",
   "referencia": "Jó 38:36",
   "livro": "Jó",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0541",
   "texto": "Aqui há sabedoria. Aquele que tem entendimento, calcule o número da besta; porque é o número de um homem, e o seu número é seiscentos e sessenta e seis.",
   "referencia": "Apocalipse 13:18",
   "livro": "Apocalipse",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0542",
   "texto": "Guia os mansos no que é reto, e lhes ensina o seu caminho.",
   "referencia": "Salmos 25:9",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0543",
   "texto": "O rei sábio joeira os ímpios e faz girar sobre eles a roda.",
   "referencia": "Provérbios 20:26",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0544",
   "texto": "O tolo derrama toda a sua ira; mas o sábio a reprime e aplaca.",
   "referencia": "Provérbios 29:11",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0545",
   "texto": "Bom e reto é o Senhor; pelo que ensina o caminho aos pecadores.",
   "referencia": "Salmos 25:8",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0546",
   "texto": "Ensina-me bom juízo e ciência, pois creio nos teus mandamentos.",
   "referencia": "Salmos 119:66",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0547",
   "texto": "O fruto do justo é árvore de vida; e o que ganha almas sábio é.",
   "referencia": "Provérbios 11:30",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0548",
   "texto": "O que tendo eu visto, o considerei; e, vendo-o, recebi instrução.",
   "referencia": "Provérbios 24:32",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0549",
   "texto": "Faze-me saber os teus caminhos, Senhor; ensina-me as tuas veredas.",
   "referencia": "Salmos 25:4",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0550",
   "texto": "A boca do justo profere sabedoria; a sua língua fala o que é reto.",
   "referencia": "Salmos 37:30",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0551",
   "texto": "A exposição das tuas palavras dá luz; dá entendimento aos simples.",
   "referencia": "Salmos 119:130",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0552",
   "texto": "O Senhor desfaz o conselho das nações, anula os intentos dos povos.",
   "referencia": "Salmos 33:10",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0553",
   "texto": "Deixai a insensatez, e vivei; e andai pelo caminho do entendimento.",
   "referencia": "Provérbios 9:6",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0554",
   "texto": "O ensino do sábio é uma fonte devida para desviar dos laços da morte.",
   "referencia": "Provérbios 13:14",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0555",
   "texto": "Vós quereis frustar o conselho dos pobres, mas o Senhor é o seu refúgio.",
   "referencia": "Salmos 14:6",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0556",
   "texto": "Meus caminhos te descrevi, e tu me ouviste; ensina-me os teus estatutos.",
   "referencia": "Salmos 119:26",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0557",
   "texto": "para se dar aos simples prudência, e aos jovens conhecimento e bom siso.",
   "referencia": "Provérbios 1:4",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0558",
   "texto": "Eu te ensinei o caminho da sabedoria; guiei-te pelas veredas da retidão.",
   "referencia": "Provérbios 4:11",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0559",
   "texto": "Apega-te à instrução e não a largues; guarda-a, porque ela é a tua vida.",
   "referencia": "Provérbios 4:13",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0560",
   "texto": "Não sejas sábio a teus próprios olhos; teme ao Senhor e aparta-te do mal.",
   "referencia": "Provérbios 3:7",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0561",
   "texto": "O coração do sábio instrui a sua boca, e aumenta o saber nos seus lábios.",
   "referencia": "Provérbios 16:23",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0562",
   "texto": "O sábio de coração aceita os mandamentos; mas o insensato palra dor cairá.",
   "referencia": "Provérbios 10:8",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0563",
   "texto": "Sou teu servo; dá-me entendimento, para que eu conheça os teus testemunhos.",
   "referencia": "Salmos 119:125",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0564",
   "texto": "O sábio teme e desvia-se do mal, mas o tolo é arrogante e dá-se por seguro.",
   "referencia": "Provérbios 14:16",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0565",
   "texto": "A boca do justo produz sabedoria; porém a língua perversa será desarraigada.",
   "referencia": "Provérbios 10:31",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0566",
   "texto": "A sabedoria é alta demais para o insensato; ele não abre a sua boca na porta.",
   "referencia": "Provérbios 24:7",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0567",
   "texto": "Ensina-me, ó Senhor, o caminho dos teus estatutos, e eu o guardarei até o fim.",
   "referencia": "Salmos 119:33",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0568",
   "texto": "Chegue a ti o meu clamor, ó Senhor; dá-me entendimento conforme a tua palavra.",
   "referencia": "Salmos 119:169",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0569",
   "texto": "Grande é o nosso Senhor, e de grande poder; não há limite ao seu entendimento.",
   "referencia": "Salmos 147:5",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0570",
   "texto": "Na boca do tolo está a vara da soberba, mas os lábios do sábio preservá-lo-ão.",

   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0571",
   "texto": "para, a seu gosto, dar ordens aos príncipes, e ensinar aos anciãos a sabedoria.",
   "referencia": "Salmos 105:22",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0572",
   "texto": "Faze resplandecer o teu rosto sobre o teu servo, e ensina-me os teus estatutos.",
   "referencia": "Salmos 119:135",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0573",
   "texto": "Há tesouro precioso e azeite na casa do sábio; mas o homem insensato os devora.",
   "referencia": "Provérbios 21:20",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0574",
   "texto": "Não fales aos ouvidos do tolo; porque desprezará a sabedoria das tuas palavras.",
   "referencia": "Provérbios 23:9",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0575",
   "texto": "O sábio de coração será chamado prudente; e a doçura dos lábios aumenta o saber.",
   "referencia": "Provérbios 16:21",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0576",
   "texto": "Aplica o teu coração à instrução, e os teus ouvidos às palavras do conhecimento.",
   "referencia": "Provérbios 23:12",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0577",
   "texto": "O teu mandamento me faz mais sábio do que meus inimigos, pois está sempre comigo.",

   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0578",
   "texto": "Justos são os teus testemunhos para sempre; dá-me entendimento, para que eu viva.",
   "referencia": "Salmos 119:144",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0579",
   "texto": "O tolo não toma prazer no entendimento, mas tão somente em revelar a sua opinião.",
   "referencia": "Provérbios 18:2",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0580",
   "texto": "Pê. Abre a sua boca com sabedoria, e o ensino da benevolência está na sua língua.",
   "referencia": "Provérbios 31:26",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0581",
   "texto": "O conselho do Senhor é para aqueles que o temem, e ele lhes faz saber o seu pacto.",
   "referencia": "Salmos 25:14",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0582",
   "texto": "Quem despreza o seu próximo é falto de senso; mas o homem de entendimento se cala.",
   "referencia": "Provérbios 11:12",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0583",
   "texto": "Da soberba só provém a contenda; mas com os que se aconselham se acha a sabedoria.",
   "referencia": "Provérbios 13:10",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0584",
   "texto": "Mais sábio é o preguiçoso a seus olhos do que sete homens que sabem responder bem.",
   "referencia": "Provérbios 26:16",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0585",
   "texto": "A suprema sabedoria altissonantemente clama nas ruas; nas praças levanta a sua voz.",
   "referencia": "Provérbios 1:20",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0586",
   "texto": "Os projetos se confirmam pelos conselhos; assim, pois, com prudência faze a guerra.",
   "referencia": "Provérbios 20:18",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0587",
   "texto": "Dá-me entendimento, para que eu guarde a tua lei, e a observe de todo o meu coração.",
   "referencia": "Salmos 119:34",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado"
  },
  {
   "id": "amp-0588",
   "texto": "Se fores sábio, para ti mesmo o serás; e, se fores escarnecedor, tu só o suportarás.",

      id: `mus-${i}-${arquivo.name}-${arquivo.size}`,

    return Array.from({ length: quantidade }, (_, i) => base[i % base.length]);

  /**

        // O nome do arquivo se apoia no tema; aqui o assunto do par faz esse

        tema: par.assunto,

  /**
   * Garante que há paisagens carregadas antes de montar o lote.
   *
   * Antes isso acontecia só dentro do fluxo de versículo avulso — os formatos
   * de par e pergunta saíam antes e ficavam sem fundo. E, como os fundos são
   * blobs em memória, eles se perdem a cada recarregamento da página: por isso
   * era preciso buscar manualmente toda vez que o app abria.
   *
   * @param {object} p       preferências
   * @param {Element} [botao] para mostrar o progresso, quando houver
   */
  async function garantirFundos(p, botao = null) {
    if (!p.fundoAuto || !temChave()) return;
    if (p.fundoBiblia) return;              // o fundo desenhado dispensa busca
    if (obterFundos().length) return;       // já há paisagens em memória

    const rotulo = botao?.innerHTML;
    if (botao) {

      botao.innerHTML = "<span>Buscando paisagens…</span>";

        }
      });

    } catch (erro) {
      if (botao) avisar(`${erro.message} Seguindo com os fundos atuais.`, "aviso", 6e3);

  /**
   * Gera vídeos de paisagem com o nome do lugar.
   *
   * Cada lugar busca a PRÓPRIA paisagem no Pexels, com a consulta específica
   * dele — não serve reaproveitar as do tema. Escrever "Lauterbrunnen" sobre
   * um campo qualquer seria pior que não escrever nada.
   */
  async function gerarLoteDeLugares(p, botao) {
    if (!temChave()) {
      avisar("Informe sua chave do Pexels no Estúdio: as paisagens vêm de lá.", "erro", 8e3);
      return;
    }

    // Teto de paisagens por lote.
    //
    // Cada uma baixa três clipes: dez lugares seriam trinta vídeos e uns 240
    // MB antes de aparecer qualquer coisa na tela. O usuário interpreta essa
    // espera como travamento — e, do ponto de vista dele, é mesmo.
    const quantos = Math.min(p.quantidade || 1, MAX_PAISAGENS_POR_LOTE);
    if ((p.quantidade || 1) > MAX_PAISAGENS_POR_LOTE) {
      avisar(
        `Paisagens vêm em lotes de até ${MAX_PAISAGENS_POR_LOTE}: cada uma baixa `
        + `${CLIPES_POR_PAISAGEM} clipes. Gere de novo para mais.`,
        "aviso", 6e3
      );
    }

    const escolhidos = sortearLugares(quantos, {
      continente: (p.continente || "todas") === "todas" ? null : p.continente
    });
    if (!escolhidos.length) {
      avisar("Nenhum lugar encontrado para essa região.", "erro");
      return;
    }

    // Cada paisagem baixa vários clipes: com cinco lugares são quinze vídeos.
    // Avisar antes evita a impressão de travamento durante a espera.
    const totalClipes = escolhidos.length * CLIPES_POR_PAISAGEM;
    avisar(
      `Baixando até ${totalClipes} clipes para ${escolhidos.length} paisagem(ns). `
      + "Pode levar um minuto — mantenha a aba aberta.",
      "aviso", 7e3
    );

    const rotulo = botao?.innerHTML;
    if (botao) {
      botao.disabled = true;
      botao.innerHTML = "<span>Buscando as paisagens…</span>";
    }

    const itens = [];
    const formato = FORMATOS.find((f) => f.id === p.formato) || FORMATOS[0];
    const musicas = distribuir2(escolhidos.length);

    try {
      for (const [i, lugar] of escolhidos.entries()) {
        if (botao) {
          botao.innerHTML = `<span>${lugar.nome} — ${i + 1} de ${escolhidos.length}…</span>`;
        }

        let clipes = [];
        try {
          // Vários clipes do MESMO lugar: é o corte entre ângulos que sustenta
          // a atenção. Com um só, o vídeo vira foto animada.
          clipes = await obterFundos2(lugar.consulta, {
            quantidade: CLIPES_POR_PAISAGEM,
            duracaoMinima: DURACAO_MINIMA_TRECHO,
            consultaExata: true
          });

          // Faltando clipes longos, aceita os curtos: o trecho de cada um é
          // curto mesmo, então a exigência de duração pode ceder.
          if (clipes.length < 2) {
            clipes = await obterFundos2(lugar.consulta, { quantidade: CLIPES_POR_PAISAGEM, consultaExata: true });
          }
        } catch {
          // Um lugar sem paisagem não derruba o lote inteiro.
        }
        if (!clipes.length) continue;

        // A duração é a soma dos trechos, e cada trecho nunca passa do clipe
        // que o sustenta — é isso que evita o vídeo dar a volta no meio.
        const menorClipe = Math.min(...clipes.map((c) => Math.floor(c.duracao || 0) || SEGUNDOS_POR_TRECHO));
        const porTrecho = Math.min(SEGUNDOS_POR_TRECHO, Math.max(4, menorClipe));
        const duracao = Math.min(TETO_PAISAGEM, Math.round(porTrecho * clipes.length));
        const fundo = clipes[0];

        itens.push({
          id: `${lugar.id}-${Date.now()}-${i}`,
          lugar,
          fundos: clipes,
          versiculo: {
            id: lugar.id,
            texto: lugar.legenda,
            referencia: `${lugar.nome}, ${lugar.regiao}`,
            tema: lugar.continente
          },
          fundo,
          musica: musicas[i],
          config: {
            ...p,
            duracao,
            // Paisagem é o formato em que a imagem É o conteúdo: vale a
            // resolução cheia, mesmo custando mais tempo de exportação.
            qualidade: "completo",
            largura: formato.largura,
            altura: formato.altura
          }
        });
      }
    } finally {
      if (botao) {
        botao.disabled = false;
        botao.innerHTML = rotulo;
      }
    }

    if (!itens.length) {
      avisar("Não consegui trazer paisagens agora. Tente de novo em instantes.", "erro", 7e3);
      return;
    }

    definirLote(itens);
    registrarLote(itens);
    avisar(`${itens.length} paisagem(ns) pronta(s).`, "ok");
    irPara("videos");
  }

  /**

    const itens = escolhidas.map((passagem, i) => ({

        ...p,

        largura: formato.largura,
        altura: formato.altura
      }
    }));

    definirLote(itens);
    registrarLote(itens);
    avisar(`${itens.length} passagem(ns) pronta(s).`, "ok");
    irPara("videos");
  }

  async function gerarLote() {
    const p = { ...obter().preferencias };
    const botao = document.getElementById("botao-gerar");

    // Cada formato tem roteiro e duração próprios.
    if (p.modo === "pares") {
      await garantirFundos(p, botao);
      gerarLoteDePares(p);
      return;
    }
    if (p.modo === "pergunta") {
      await garantirFundos(p, botao);
      gerarLoteDePerguntas(p);
      return;
    }
    if (p.modo === "passagem") {
      // Com um tema escolhido, as paisagens buscadas seguem esse tema.
      const temaPassagem = (p.temaPassagem || "todas") === "todas" ? null : p.temaPassagem;

      // Buscar aqui, em segundo plano, evita ter de pedir manualmente toda vez
      // que o app abre. Não bloqueia a interface — se falhar, o app segue com
      // gradientes e o usuário nem percebe.
      const prefsIniciais = obter().preferencias;
      if (prefsIniciais.fundoAuto && temChave() && !prefsIniciais.fundoBiblia) {
        garantirFundos(prefsIniciais).catch(() => {});
      }
      on(EVENTOS.temasAtualizados, () => {
        montarEstudio();
      });
      document.querySelectorAll("[data-atalho]").forEach((botao) => {
        botao.addEventListener("click", () => irPara(botao.dataset.atalho));
      });
      document.getElementById("rodape-versao").textContent = `v${APP.versao}`;
      document.getElementById("botao-resetar")?.addEventListener("click", () => {
        if (confirm("Isto apaga favoritos, histórico e preferências deste navegador. Continuar?")) {
          resetarTudo();
        }
      });
      carregando2.remove();
      console.info(
        `%c${APP.nome} v${APP.versao}`,
        "color:#E7B84B;font-weight:600",
        `— ${total()} versículos carregados.`
      );
    } catch (erro) {
      console.error(erro);
      carregando2.innerHTML = `
      <div class="falha">
        <span class="falha__icone">${icone("alerta", { tamanho: 26 })}</span>
        <h2>Não foi possível carregar o banco de versículos</h2>
        <p>${erro.message}</p>
        <pre>cd semear
python3 -m http.server 5500
# depois abra http://localhost:5500</pre>
        <p class="falha__nota">Módulos ES6 e <code>fetch</code> não funcionam pelo protocolo <code>file://</code> — o projeto precisa de um servidor local.</p>
      </div>`;
    }
  }
  window.addEventListener("load", () => {
    if (!location.protocol.startsWith("http")) {
      avisar(
        "Você abriu o Semear como arquivo local. Assim o navegador bloqueia o download dos vídeos e a busca de fundos. Publique no Vercel ou rode um servidor local para usar tudo.",
        "aviso",
        12e3
      );
    }
  });
  window.addEventListener("load", () => {
    if (!HTMLCanvasElement.prototype.captureStream) {
      avisar("Este navegador não grava vídeo pelo Canvas. Prévia funciona; o download exige Chrome, Edge ou Firefox.", "aviso", 8e3);
    }
  });
  iniciar();
})();

  </script>
</body>
</html>
