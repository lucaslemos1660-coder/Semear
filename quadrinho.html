<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semear · Quadrinho animado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Sora:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ambar:#F5C46B;
    --brasa:#E0763F;
    --vinho:#9E3B58;
    --indigo:#3D2352;
    --noite:#120E18;
    --tinta:#0A0810;
    --papel:#EDE6DC;
    --linha:rgba(237,230,220,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--noite);color:var(--papel);
    font-family:'Sora',system-ui,sans-serif;overscroll-behavior:none}
  body{padding:16px 14px 40px;max-width:560px;margin:0 auto}

  header{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;
    font-size:22px;margin:0;letter-spacing:-.01em}
  .sub{font-size:12px;color:rgba(237,230,220,.45)}

  #palco{position:relative;width:100%;aspect-ratio:9/16;
    background:var(--tinta);border-radius:14px;overflow:hidden;
    border:1px solid var(--linha)}
  #tela{width:100%;height:100%;display:block}

  .barra{display:flex;gap:8px;margin-top:12px}
  button{flex:1;font-family:'Sora',sans-serif;font-size:14px;font-weight:500;
    padding:13px 10px;border-radius:10px;border:1px solid var(--linha);
    background:rgba(237,230,220,.06);color:var(--papel);cursor:pointer}
  button:active{background:rgba(237,230,220,.14)}
  button:disabled{opacity:.4;cursor:default}
  button:focus-visible{outline:2px solid var(--ambar);outline-offset:2px}
  .primaria{background:var(--brasa);border-color:var(--brasa);color:#160D07;font-weight:500}

  .trilha{margin-top:16px}
  .trilha-topo{display:flex;justify-content:space-between;
    font-size:12px;color:rgba(237,230,220,.5);margin-bottom:7px}
  input[type=range]{width:100%;accent-color:var(--brasa)}

  ol{list-style:none;padding:0;margin:16px 0 0;
    border-top:1px solid var(--linha)}
  li{display:flex;align-items:center;gap:12px;padding:11px 4px;
    border-bottom:1px solid var(--linha);cursor:pointer;font-size:14px}
  li .n{font-family:'Fraunces',serif;font-size:15px;
    color:rgba(237,230,220,.35);min-width:18px}
  li .d{margin-left:auto;font-size:12px;color:rgba(237,230,220,.4)}
  li[aria-current=true]{background:rgba(224,118,63,.1)}
  li[aria-current=true] .n{color:var(--brasa)}

  #estado{margin-top:14px;font-size:13px;line-height:1.5;
    color:rgba(237,230,220,.6);min-height:20px}
  #estado.erro{color:#F09A8A}
  #estado.ok{color:var(--ambar)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <h1>Quadrinho animado</h1>
  <span class="sub">Semear · 9:16 · sem áudio</span>
</header>

<div id="palco"><canvas id="tela" width="1080" height="1920"></canvas></div>

<div class="barra">
  <button id="btPlay">Reproduzir</button>
  <button id="btExport" class="primaria">Gerar MP4</button>
</div>

<div class="trilha">
  <div class="trilha-topo"><span id="rotulo">Cena 1 — O gigante</span><span id="relogio">0,0s / 26,5s</span></div>
  <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="Posição na história">
</div>

<ol id="lista"></ol>

<p id="estado">Toque em Reproduzir para pré-visualizar.</p>

<script type="module">
import { Muxer, ArrayBufferTarget } from 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.5/+esm';

/* ══════════════════════════════════════════════════════════
   CONFIGURAÇÃO
   ══════════════════════════════════════════════════════════ */
const L = 1080, A = 1920, FPS = 30;
const FILA_MAX = 2;              // limite de frames pendentes no encoder
const MARCA = 'SemeiaFé';

const tela = document.getElementById('tela');
const ctx  = tela.getContext('2d', { alpha:false });

/* ── Paleta ────────────────────────────────────────────── */
const TINTA = '#0A0810';
const PAPEL = '#EDE6DC';

const CEU_ANOITECER = [
  [0.00,'#F5C46B'],[0.22,'#E0763F'],[0.48,'#9E3B58'],
  [0.74,'#3D2352'],[1.00,'#120E18']
];
const CEU_AMANHECER = [
  [0.00,'#FBE7C0'],[0.26,'#F5C46B'],[0.55,'#E89A63'],
  [0.80,'#8A5A7A'],[1.00,'#3D2352']
];

/* ══════════════════════════════════════════════════════════
   UTILITÁRIOS
   ══════════════════════════════════════════════════════════ */
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const lerp  = (a,b,t)=>a+(b-a)*t;

// suavização: começa e termina devagar
const suave    = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
const saindo   = t => 1-Math.pow(1-t,3);
const entrando = t => t*t*t;

/** Progresso normalizado dentro de uma janela da cena. */
function janela(p, ini, fim){ return clamp((p-ini)/(fim-ini), 0, 1); }

function ceu(paradas, deslocY=0){
  const g = ctx.createLinearGradient(0, deslocY, 0, A+deslocY);
  for(const [pos,cor] of paradas) g.addColorStop(pos, cor);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,L,A);
}

/** Executa um desenho dentro de uma transformação isolada. */
function camada(fn, {x=0,y=0,escala=1,giro=0,opac=1,ox=L/2,oy=A/2}={}){
  ctx.save();
  ctx.globalAlpha = opac;
  ctx.translate(ox+x, oy+y);
  ctx.scale(escala,escala);
  ctx.rotate(giro);
  ctx.translate(-ox,-oy);
  fn();
  ctx.restore();
}

/* ══════════════════════════════════════════════════════════
   TEXTO
   ══════════════════════════════════════════════════════════ */
function texto(linhas, {y=A*0.16, tam=76, fonte='Fraunces', peso=600,
                        cor=PAPEL, opac=1, entrelinha=1.28, reveladas=null}={}){
  ctx.save();
  ctx.globalAlpha = opac;
  ctx.fillStyle = cor;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.shadowColor = 'rgba(10,8,16,.55)';
  ctx.shadowBlur = 24;

  const n = reveladas==null ? linhas.length : reveladas;
  linhas.forEach((linha,i)=>{
    if(i>=n) return;
    const escalaLinha = i===0 ? 1 : 0.92;
    ctx.font = `${peso} ${Math.round(tam*escalaLinha)}px ${fonte}, Georgia, serif`;
    ctx.fillText(linha, L/2, y + i*tam*entrelinha);
  });
  ctx.restore();
}

function marca(opac=0.5){
  ctx.save();
  ctx.globalAlpha = opac;
  ctx.fillStyle = PAPEL;
  ctx.textAlign = 'center';
  ctx.font = `500 30px Sora, sans-serif`;
  ctx.letterSpacing = '4px';
  ctx.fillText(MARCA, L/2, A-96);
  ctx.restore();
}

/* ══════════════════════════════════════════════════════════
   SILHUETAS — todas desenhadas em código, sem imagem externa
   ══════════════════════════════════════════════════════════ */

function serra(baseY, altura, semente, cor=TINTA){
  ctx.save();
  ctx.fillStyle = cor;
  ctx.beginPath();
  ctx.moveTo(-40, A);
  ctx.lineTo(-40, baseY);
  let s = semente;
  const passo = 130;
  for(let x=-40; x<=L+80; x+=passo){
    s = (s*9301+49297)%233280;
    const r = s/233280;
    ctx.lineTo(x+passo/2, baseY - altura*(0.35+r*0.65));
    ctx.lineTo(x+passo,   baseY - altura*(0.12+r*0.28));
  }
  ctx.lineTo(L+80, A);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/** Figura humana genérica. e = escala em px de altura total. */
function figura(x, pisoY, e, op={}){
  const { bracoDir=-0.35, bracoEsq=0.4, passo=0, capacete=false,
          lanca=false, escudo=false, cajado=false, cor=TINTA } = op;
  ctx.save();
  ctx.fillStyle = cor;
  ctx.strokeStyle = cor;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const cabeca = e*0.13;
  const topo   = pisoY - e;
  const ombro  = topo + cabeca*1.9;
  const quadril= topo + e*0.52;

  // pernas
  ctx.lineWidth = e*0.085;
  ctx.beginPath();
  ctx.moveTo(x, quadril);
  ctx.lineTo(x - e*0.10 - passo*e*0.12, pisoY);
  ctx.moveTo(x, quadril);
  ctx.lineTo(x + e*0.10 + passo*e*0.12, pisoY);
  ctx.stroke();

  // tronco
  ctx.lineWidth = e*0.15;
  ctx.beginPath();
  ctx.moveTo(x, ombro);
  ctx.lineTo(x, quadril);
  ctx.stroke();

  // braços
  ctx.lineWidth = e*0.065;
  ctx.beginPath();
  ctx.moveTo(x, ombro+e*0.02);
  ctx.lineTo(x + e*0.20*Math.cos(bracoDir), ombro + e*0.26 + e*0.14*Math.sin(bracoDir));
  ctx.moveTo(x, ombro+e*0.02);
  ctx.lineTo(x - e*0.20*Math.cos(bracoEsq), ombro + e*0.26 + e*0.14*Math.sin(bracoEsq));
  ctx.stroke();

  // cabeça
  ctx.beginPath();
  ctx.arc(x, topo+cabeca, cabeca, 0, Math.PI*2);
  ctx.fill();

  if(capacete){
    ctx.beginPath();
    ctx.arc(x, topo+cabeca*0.95, cabeca*1.28, Math.PI, Math.PI*2);
    ctx.fill();
    ctx.beginPath();               // crista
    ctx.moveTo(x-cabeca*0.2, topo-cabeca*0.35);
    ctx.quadraticCurveTo(x+cabeca*0.5, topo-cabeca*1.5, x+cabeca*1.5, topo-cabeca*0.1);
    ctx.lineTo(x+cabeca*0.3, topo+cabeca*0.1);
    ctx.closePath();
    ctx.fill();
  }
  if(lanca){
    ctx.lineWidth = e*0.028;
    ctx.beginPath();
    ctx.moveTo(x + e*0.30, pisoY);
    ctx.lineTo(x + e*0.22, topo - e*0.30);
    ctx.stroke();
    ctx.beginPath();               // ponta
    ctx.moveTo(x + e*0.22, topo - e*0.30);
    ctx.lineTo(x + e*0.16, topo - e*0.15);
    ctx.lineTo(x + e*0.29, topo - e*0.14);
    ctx.closePath();
    ctx.fill();
  }
  if(escudo){
    ctx.beginPath();
    ctx.ellipse(x - e*0.24, quadril - e*0.10, e*0.15, e*0.22, 0, 0, Math.PI*2);
    ctx.fill();
  }
  if(cajado){
    ctx.lineWidth = e*0.022;
    ctx.beginPath();
    ctx.moveTo(x + e*0.19, pisoY);
    ctx.lineTo(x + e*0.15, topo - e*0.12);
    ctx.stroke();
  }
  ctx.restore();
}

/** Golias: mesma anatomia, proporção pesada. */
function golias(x, pisoY, e){
  figura(x, pisoY, e, { capacete:true, lanca:true, escudo:true,
                        bracoDir:-0.5, bracoEsq:0.25 });
}

/** Davi com a funda girando. giro em radianos. */
function daviFunda(x, pisoY, e, giro){
  figura(x, pisoY, e, { bracoDir:-1.25, bracoEsq:0.55, passo:0.6 });
  const ombro = pisoY - e + e*0.13*1.9;
  const mao   = { x: x + e*0.20*Math.cos(-1.25), y: ombro + e*0.26 - e*0.14 };
  const raio  = e*0.34;
  ctx.save();
  ctx.strokeStyle = TINTA;
  ctx.fillStyle = TINTA;
  ctx.lineWidth = e*0.016;
  ctx.beginPath();
  ctx.moveTo(mao.x, mao.y);
  const px = mao.x + Math.cos(giro)*raio;
  const py = mao.y + Math.sin(giro)*raio*0.85;
  ctx.lineTo(px, py);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(px, py, e*0.045, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

/** Pilha de armadura no chão. */
function armadura(x, pisoY, e){
  ctx.save();
  ctx.fillStyle = TINTA;
  // peitoral tombado
  ctx.beginPath();
  ctx.ellipse(x, pisoY-e*0.20, e*0.34, e*0.24, -0.18, 0, Math.PI*2);
  ctx.fill();
  // elmo ao lado
  ctx.beginPath();
  ctx.arc(x - e*0.48, pisoY-e*0.12, e*0.16, Math.PI, Math.PI*2);
  ctx.fill();
  ctx.fillRect(x - e*0.64, pisoY-e*0.13, e*0.32, e*0.06);
  // espada
  ctx.lineWidth = e*0.035;
  ctx.strokeStyle = TINTA;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x + e*0.30, pisoY-e*0.05);
  ctx.lineTo(x + e*0.86, pisoY-e*0.16);
  ctx.stroke();
  ctx.lineWidth = e*0.016;
  ctx.beginPath();
  ctx.moveTo(x + e*0.34, pisoY-e*0.16);
  ctx.lineTo(x + e*0.30, pisoY+e*0.04);
  ctx.stroke();
  ctx.restore();
}

/** Mão recolhendo pedras (close). */
function maoPedras(cx, cy, e, quantas){
  ctx.save();
  ctx.fillStyle = TINTA;
  // antebraço
  ctx.beginPath();
  ctx.moveTo(cx - e*0.95, cy + e*0.72);
  ctx.lineTo(cx - e*0.30, cy - e*0.05);
  ctx.lineTo(cx + e*0.08, cy + e*0.26);
  ctx.lineTo(cx - e*0.55, cy + e*0.95);
  ctx.closePath();
  ctx.fill();
  // palma
  ctx.beginPath();
  ctx.ellipse(cx, cy+e*0.10, e*0.36, e*0.27, -0.42, 0, Math.PI*2);
  ctx.fill();
  // dedos
  for(let i=0;i<4;i++){
    const a = -0.95 + i*0.30;
    ctx.save();
    ctx.translate(cx+e*0.22, cy-e*0.02);
    ctx.rotate(a);
    ctx.beginPath();
    ctx.ellipse(e*0.22, 0, e*0.24, e*0.075, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  // pedras na água, abaixo
  const posic = [[-1.5,1.25],[-0.6,1.5],[0.45,1.35],[1.3,1.55],[0.05,1.72]];
  for(let i=0;i<Math.min(quantas,5);i++){
    const [dx,dy] = posic[i];
    ctx.beginPath();
    ctx.ellipse(cx+dx*e*0.6, cy+dy*e*0.6, e*0.10, e*0.075, i*0.5, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

/** Figura caída. */
function caido(x, pisoY, e){
  ctx.save();
  ctx.fillStyle = TINTA;
  ctx.strokeStyle = TINTA;
  ctx.lineCap = 'round';
  ctx.lineWidth = e*0.16;
  ctx.beginPath();
  ctx.moveTo(x - e*0.55, pisoY - e*0.05);
  ctx.lineTo(x + e*0.45, pisoY - e*0.10);
  ctx.stroke();
  ctx.lineWidth = e*0.09;
  ctx.beginPath();
  ctx.moveTo(x + e*0.45, pisoY - e*0.10);
  ctx.lineTo(x + e*0.95, pisoY - e*0.02);
  ctx.moveTo(x - e*0.55, pisoY - e*0.05);
  ctx.lineTo(x - e*1.05, pisoY - e*0.14);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x - e*0.72, pisoY - e*0.18, e*0.15, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

/* Água com ondulação leve (cena 5). */
function agua(baseY, t){
  ctx.save();
  ctx.fillStyle = 'rgba(10,8,16,.55)';
  ctx.beginPath();
  ctx.moveTo(0, A);
  ctx.lineTo(0, baseY);
  for(let x=0; x<=L; x+=18){
    ctx.lineTo(x, baseY + Math.sin(x*0.012 + t*2.1)*9 + Math.sin(x*0.031 - t*1.4)*5);
  }
  ctx.lineTo(L, A);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* ══════════════════════════════════════════════════════════
   CENAS — cada uma recebe p (0→1) e t (segundos absolutos)
   ══════════════════════════════════════════════════════════ */
const CENAS = [
{ nome:'O gigante', dur:3.0, desenhar(p,t){
    const z = lerp(1.15, 1.00, suave(p));
    ceu(CEU_ANOITECER);
    camada(()=>serra(A*0.80, 190, 7), {escala:z*1.02});
    camada(()=>golias(L*0.52, A*0.985, A*0.88), {escala:z, oy:A});
} },

{ nome:'O medo', dur:3.0, desenhar(p,t){
    const desl = -p*70;
    ceu(CEU_ANOITECER);
    camada(()=>serra(A*0.74, 210, 7), {x:desl*0.55});
    camada(()=>golias(L*0.70, A*0.795, A*0.20), {x:desl*0.55});
    camada(()=>serra(A*0.84, 120, 31), {x:desl});
    for(let i=0;i<9;i++){
      const x = L*0.06 + i*(L*0.11);
      figura(x, A*0.965 - (i%2)*14, A*0.085 + (i%3)*6, {bracoDir:0.9, bracoEsq:-0.9});
    }
    texto(['Todo um exército.','Paralisado.'], {y:A*0.14, tam:74, opac:saindo(janela(p,0,.22))});
} },

{ nome:'O menino', dur:3.0, desenhar(p,t){
    const entra = saindo(janela(p,0,.55));
    ceu(CEU_ANOITECER);
    camada(()=>serra(A*0.84, 130, 31), {});
    for(let i=0;i<9;i++){
      figura(L*0.06 + i*(L*0.11), A*0.965 - (i%2)*14, A*0.085 + (i%3)*6,
             {bracoDir:0.9, bracoEsq:-0.9});
    }
    const x = lerp(L*1.18, L*0.50, entra);
    figura(x, A*0.905, A*0.135, {cajado:true, passo:0.5, bracoDir:-0.2});
    texto(['Menos um.'], {y:A*0.14, tam:82, opac:saindo(janela(p,.35,.62))});
} },

{ nome:'A armadura', dur:3.5, desenhar(p,t){
    const desce = suave(janela(p,.15,1));
    ceu(CEU_ANOITECER, -desce*260);
    ctx.save();
    ctx.translate(0, desce*300);
    camada(()=>serra(A*0.52, 150, 31), {});
    // Davi saindo de quadro
    figura(lerp(L*0.62, L*0.86, saindo(p)), A*0.60, A*0.125,
           {passo:0.6, bracoDir:0.7, bracoEsq:-0.7});
    armadura(L*0.42, A*0.90, A*0.13);
    ctx.restore();
    texto(['Ofereceram armadura.','Ele devolveu.'],
          {y:A*0.13, tam:70, opac:saindo(janela(p,0,.2))});
} },

{ nome:'Cinco pedras', dur:3.5, desenhar(p,t){
    const z = lerp(1.0, 1.22, suave(p));
    ceu(CEU_ANOITECER);
    camada(()=>serra(A*0.42, 120, 91), {escala:z*0.98});
    camada(()=>agua(A*0.56, t), {escala:z});
    camada(()=>maoPedras(L*0.50, A*0.44, A*0.20,
                         Math.floor(janela(p,.15,.85)*5)+1), {escala:z, oy:A*0.5});
    texto(['Cinco pedras do ribeiro.'],
          {y:A*0.11, tam:62, opac:saindo(janela(p,.1,.32))});
} },

{ nome:'O lançamento', dur:2.5, desenhar(p,t){
    ceu(CEU_ANOITECER);
    ctx.save();                       // Golias desfocado ao fundo
    ctx.globalAlpha = 0.32;
    ctx.filter = 'blur(9px)';
    golias(L*0.76, A*0.86, A*0.60);
    ctx.restore();
    ctx.filter = 'none';
    camada(()=>serra(A*0.86, 110, 31), {});
    daviFunda(L*0.30, A*0.905, A*0.24, -Math.PI/2 + p*Math.PI*11);
    texto(['Uma bastou.'], {y:A*0.12, tam:84, opac:saindo(janela(p,.08,.28))});
} },

{ nome:'A queda', dur:3.0, desenhar(p,t){
    ceu(CEU_ANOITECER);
    camada(()=>serra(A*0.78, 200, 7), {});
    camada(()=>serra(A*0.88, 90, 31), {});
    caido(L*0.54, A*0.945, A*0.085);
    // sem texto, sem movimento — o respiro da história
} },

{ nome:'Fecho', dur:5.0, desenhar(p,t){
    const z = lerp(1.0, 1.07, p);
    ceu(CEU_AMANHECER);
    camada(()=>serra(A*0.88, 130, 7), {escala:z});
    const l1 = janela(p,.10,.34), l2 = janela(p,.42,.66);
    texto(['“A batalha é do Senhor.”'],
          {y:A*0.36, tam:66, opac:saindo(l1)});
    texto(['1 Samuel 17:47'],
          {y:A*0.47, tam:40, fonte:'Sora', peso:500, opac:saindo(l2),
           cor:'rgba(237,230,220,.72)'});
    marca(saindo(janela(p,.6,.85))*0.55);
} }
];

const DUR = CENAS.reduce((s,c)=>s+c.dur, 0);
const TOTAL_FRAMES = Math.round(DUR*FPS);

/** Desenha o quadro correspondente ao instante t (segundos). */
function quadro(t){
  t = clamp(t, 0, DUR-0.0001);
  let acc = 0;
  for(let i=0;i<CENAS.length;i++){
    const c = CENAS[i];
    if(t < acc + c.dur){
      ctx.fillStyle = TINTA;
      ctx.fillRect(0,0,L,A);
      c.desenhar((t-acc)/c.dur, t);
      return i;
    }
    acc += c.dur;
  }
  return CENAS.length-1;
}

/* ══════════════════════════════════════════════════════════
   INTERFACE
   ══════════════════════════════════════════════════════════ */
const btPlay = document.getElementById('btPlay');
const btExp  = document.getElementById('btExport');
const scrub  = document.getElementById('scrub');
const rotulo = document.getElementById('rotulo');
const relogio= document.getElementById('relogio');
const lista  = document.getElementById('lista');
const estado = document.getElementById('estado');

let tAtual = 0, tocando = false, ultimoMs = 0, exportando = false;

CENAS.forEach((c,i)=>{
  const li = document.createElement('li');
  li.innerHTML = `<span class="n">${i+1}</span><span>${c.nome}</span>` +
                 `<span class="d">${c.dur.toFixed(1).replace('.',',')}s</span>`;
  li.onclick = ()=>{ if(exportando) return;
    tAtual = CENAS.slice(0,i).reduce((s,x)=>s+x.dur,0); pintar(); };
  lista.appendChild(li);
});

function fmt(s){ return s.toFixed(1).replace('.',',')+'s'; }

function pintar(){
  const i = quadro(tAtual);
  scrub.value = Math.round(tAtual/DUR*1000);
  rotulo.textContent = `Cena ${i+1} — ${CENAS[i].nome}`;
  relogio.textContent = `${fmt(tAtual)} / ${fmt(DUR)}`;
  [...lista.children].forEach((li,k)=>li.setAttribute('aria-current', k===i));
}

function laco(ms){
  if(!tocando) return;
  const dt = (ms-ultimoMs)/1000; ultimoMs = ms;
  tAtual += dt;
  if(tAtual >= DUR){ tAtual = 0; }
  pintar();
  requestAnimationFrame(laco);
}

btPlay.onclick = ()=>{
  tocando = !tocando;
  btPlay.textContent = tocando ? 'Pausar' : 'Reproduzir';
  if(tocando){ ultimoMs = performance.now(); requestAnimationFrame(laco); }
};

scrub.oninput = ()=>{
  tocando = false; btPlay.textContent = 'Reproduzir';
  tAtual = scrub.value/1000*DUR; pintar();
};

function aviso(msg, tipo=''){ estado.textContent = msg; estado.className = tipo; }

/* ══════════════════════════════════════════════════════════
   EXPORTAÇÃO — WebCodecs + mp4-muxer, fila limitada
   ══════════════════════════════════════════════════════════ */
const CODECS = ['avc1.640028','avc1.4d0028','avc1.42e028','avc1.640033'];

async function escolherCodec(){
  for(const codec of CODECS){
    for(const aceleracao of ['prefer-hardware','no-preference']){
      const cfg = { codec, width:L, height:A, framerate:FPS,
                    bitrate:6_000_000, hardwareAcceleration:aceleracao,
                    avc:{ format:'avc' } };
      try{
        const r = await VideoEncoder.isConfigSupported(cfg);
        if(r.supported) return cfg;
      }catch(_){}
    }
  }
  return null;
}

async function exportar(){
  if(exportando) return;
  if(!('VideoEncoder' in window)){
    aviso('Este navegador não tem WebCodecs. Use o Chrome no Android.', 'erro');
    return;
  }

  tocando = false; btPlay.textContent = 'Reproduzir';
  exportando = true; btExp.disabled = true; btPlay.disabled = true;
  aviso('Preparando o encoder…');

  try{ await document.fonts.ready; }catch(_){}

  const cfg = await escolherCodec();
  if(!cfg){ aviso('Nenhum perfil H.264 compatível em 1080×1920 neste aparelho.', 'erro');
            exportando=false; btExp.disabled=false; btPlay.disabled=false; return; }

  const muxer = new Muxer({
    target: new ArrayBufferTarget(),
    video: { codec:'avc', width:L, height:A, frameRate:FPS },
    fastStart:'in-memory'
  });

  let erroEncoder = null;
  const encoder = new VideoEncoder({
    output:(chunk, meta)=>muxer.addVideoChunk(chunk, meta),
    error:(e)=>{ erroEncoder = e; }
  });
  encoder.configure(cfg);

  const microS = 1_000_000/FPS;

  try{
    for(let f=0; f<TOTAL_FRAMES; f++){
      if(erroEncoder) throw erroEncoder;

      quadro(f/FPS);

      const frame = new VideoFrame(tela, {
        timestamp: Math.round(f*microS),
        duration:  Math.round(microS)
      });
      encoder.encode(frame, { keyFrame: f % (FPS*2) === 0 });
      frame.close();

      // ── contenção de memória: nunca mais que FILA_MAX pendentes
      while(encoder.encodeQueueSize > FILA_MAX){
        await new Promise(r=>setTimeout(r, 8));
        if(erroEncoder) throw erroEncoder;
      }

      if(f % 15 === 0){
        aviso(`Gerando… ${Math.round(f/TOTAL_FRAMES*100)}%  (${f}/${TOTAL_FRAMES})`);
        await new Promise(r=>requestAnimationFrame(r));  // devolve a tela ao sistema
      }
    }

    aviso('Fechando o arquivo…');
    await encoder.flush();
    encoder.close();
    muxer.finalize();

    const blob = new Blob([muxer.target.buffer], { type:'video/mp4' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = `semear-davi-e-golias.mp4`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 60_000);

    const mb = (blob.size/1048576).toFixed(1).replace('.',',');
    aviso(`Pronto. ${mb} MB · ${fmt(DUR)} · 1080×1920. Confira a pasta Downloads.`, 'ok');

  }catch(e){
    try{ encoder.close(); }catch(_){}
    aviso(`A geração parou: ${e && e.message ? e.message : e}. `+
          `Feche outras abas e tente de novo.`, 'erro');
  }finally{
    exportando = false; btExp.disabled = false; btPlay.disabled = false;
    pintar();
  }
}

btExp.onclick = exportar;

/* ── início ────────────────────────────────────────────── */
document.fonts.ready.then(pintar).catch(pintar);
pintar();
</script>
</body>
</html>
