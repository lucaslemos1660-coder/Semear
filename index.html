/* ==================================================================
   Semear — estilos
   ------------------------------------------------------------------
   Direção visual: "vigília noturna". Fundo índigo profundo, um único
   acento em ouro de vela, tipografia serifada (Fraunces) para os
   momentos de leitura e Sora para os controles. O ouro aparece pouco,
   sempre onde há ação ou escritura — é o que dá identidade à tela.
   ================================================================== */

/* ------------------------------ Tokens ------------------------------ */
:root {
  /* Cores */
  --tinta:      #080B16;
  --superficie: #111629;
  --elevada:    #171D34;
  --filete:     #242C46;
  --ouro:       #E7B84B;
  --ouro-suave: #F2D28C;
  --vellum:     #F1EBE0;
  --neutro:     #8A93AE;
  --erro:       #E2726E;
  --ok:         #6FC59B;

  /* Tipografia fluida */
  --f-display: 'Fraunces', Georgia, serif;
  --f-ui: 'Sora', system-ui, -apple-system, sans-serif;
  --t-xs: clamp(.68rem, .66rem + .1vw, .74rem);
  --t-sm: clamp(.78rem, .75rem + .15vw, .86rem);
  --t-md: clamp(.9rem, .87rem + .2vw, 1rem);
  --t-lg: clamp(1.05rem, 1rem + .4vw, 1.28rem);
  --t-xl: clamp(1.4rem, 1.2rem + 1vw, 2.1rem);
  --t-2xl: clamp(2rem, 1.5rem + 2.4vw, 3.4rem);

  /* Espaço e forma */
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --lateral-largura: 264px;
  --sombra: 0 20px 50px rgba(0, 0, 0, .45);
  --brilho-ouro: 0 0 0 1px rgba(231, 184, 75, .28), 0 12px 32px rgba(231, 184, 75, .12);
}

/* ------------------------------ Reset ------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100dvh;
  background: var(--tinta);
  color: var(--vellum);
  font-family: var(--f-ui);
  font-size: var(--t-md);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* Brilho ambiente: a "vela" atrás de toda a interface. */
body::before {
  content: '';
  position: fixed;
  inset: -20vh 0 auto 0;
  height: 70vh;
  background:
    radial-gradient(60% 60% at 22% 0%, rgba(231, 184, 75, .10), transparent 70%),
    radial-gradient(50% 50% at 85% 10%, rgba(93, 106, 214, .12), transparent 70%);
  pointer-events: none;
  z-index: 0;
}

h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
canvas { display: block; }
.sem-rolagem { overflow: hidden; }

:focus-visible {
  outline: 2px solid var(--ouro);
  outline-offset: 2px;
  border-radius: 6px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ------------------------------ Casco ------------------------------- */
.app {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: var(--lateral-largura) 1fr;
  min-height: 100dvh;
}

.lateral {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 22px 16px 18px;
  border-right: 1px solid var(--filete);
  background: linear-gradient(180deg, rgba(17, 22, 41, .92), rgba(8, 11, 22, .92));
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  height: 100dvh;
}

.lateral__topo { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lateral__fechar { display: none; }

.marca { display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; }
.marca__broto {
  display: grid;
  place-items: center;
  width: 40px; height: 40px;
  border-radius: 13px;
  color: var(--ouro);
  background: radial-gradient(circle at 50% 120%, rgba(231, 184, 75, .35), rgba(23, 29, 52, .9));
  box-shadow: var(--brilho-ouro);
}
.marca__texto strong { display: block; font-family: var(--f-display); font-size: 1.02rem; letter-spacing: -.015em; }
.marca__texto small { display: block; color: var(--neutro); font-size: var(--t-xs); }

/* Navegação */
.nav { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; }
.nav-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 12px;
  border-radius: var(--r-sm);
  color: var(--neutro);
  text-decoration: none;
  font-size: var(--t-sm);
  transition: background .18s ease, color .18s ease;
}
.nav-item:hover { background: rgba(255, 255, 255, .04); color: var(--vellum); }
.nav-item__icone { display: grid; place-items: center; opacity: .9; }
.nav-item--ativo { background: rgba(231, 184, 75, .09); color: var(--vellum); }
.nav-item--ativo .nav-item__icone { color: var(--ouro); }
.nav-item__marca {
  position: absolute; left: 0; top: 50%;
  width: 2px; height: 0; border-radius: 2px;
  background: var(--ouro);
  transform: translateY(-50%);
  transition: height .2s ease;
}
.nav-item--ativo .nav-item__marca { height: 20px; }

.lateral__rodape { margin-top: auto; display: grid; gap: 8px; font-size: var(--t-xs); color: var(--neutro); }
.selo-local {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 11px;
  border: 1px solid var(--filete);
  border-radius: 999px;
  background: rgba(255, 255, 255, .02);
}
.selo-local::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--ok); box-shadow: 0 0 8px var(--ok);
}
.rodape-linha { display: flex; justify-content: space-between; align-items: center; }

.link {
  background: none; border: 0; padding: 0; cursor: pointer;
  color: var(--ouro); font-size: var(--t-xs); text-decoration: underline;
  text-underline-offset: 3px;
}

/* Conteúdo */
.conteudo { display: flex; flex-direction: column; min-width: 0; }

.topo {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px;
  padding: 16px clamp(16px, 3vw, 34px);
  border-bottom: 1px solid var(--filete);
  background: rgba(8, 11, 22, .78);
  backdrop-filter: blur(12px);
}
.topo__menu { display: none; }
.topo__titulos { flex: 1; min-width: 0; }
.topo__titulos h1 { font-family: var(--f-display); font-size: var(--t-lg); }
.topo__titulos p { color: var(--neutro); font-size: var(--t-xs); }

.area { padding: clamp(18px, 3vw, 34px); display: grid; gap: 22px; }
.tela--entrando { animation: surgir .32s ease both; }
@keyframes surgir { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.veu {
  position: fixed; inset: 0; z-index: 30;
  background: rgba(4, 6, 12, .65);
  backdrop-filter: blur(2px);
  opacity: 0; pointer-events: none;
  transition: opacity .22s ease;
}
.veu--visivel { opacity: 1; pointer-events: auto; }

/* ------------------------------ Botões ------------------------------ */
.botao {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px;
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  background: rgba(255, 255, 255, .05);
  color: var(--vellum);
  font-size: var(--t-sm); font-weight: 500;
  cursor: pointer;
  transition: transform .12s ease, background .18s ease, border-color .18s ease, opacity .18s ease;
}
.botao:hover { background: rgba(255, 255, 255, .09); }
.botao:active { transform: translateY(1px); }
.botao:disabled { opacity: .5; cursor: progress; }

.botao--principal {
  background: linear-gradient(180deg, var(--ouro-suave), var(--ouro));
  color: #1B1405;
  font-weight: 600;
  box-shadow: 0 10px 24px rgba(231, 184, 75, .18);
}
.botao--principal:hover { background: linear-gradient(180deg, #F7DFA8, #EFC55F); }

.botao--fantasma { background: transparent; border-color: var(--filete); }
.botao--fantasma:hover { background: rgba(255, 255, 255, .05); border-color: #33406A; }

.botao--grande { width: 100%; padding: 15px 20px; font-size: var(--t-md); border-radius: var(--r-md); }
.botao--pequeno { padding: 7px 12px; font-size: var(--t-xs); }
.botao--icone { padding: 9px; border-radius: 10px; }
.botao--bloco { flex: 1; }
.esta-favorito { color: var(--ouro); border-color: rgba(231, 184, 75, .4); }

/* ------------------------------ Painel ------------------------------ */
/* Cartão do tema do dia: a "página iluminada", com filete de ouro na
   margem esquerda, como um manuscrito. É o elemento-assinatura do app. */
.destaque {
  position: relative;
  padding: clamp(22px, 3vw, 40px) clamp(20px, 3vw, 44px);
  border: 1px solid var(--filete);
  border-left: 2px solid var(--ouro);
  border-radius: var(--r-lg);
  background:
    radial-gradient(80% 120% at 0% 0%, rgba(231, 184, 75, .10), transparent 60%),
    linear-gradient(160deg, var(--elevada), var(--superficie));
  overflow: hidden;
}
.destaque__selo {
  font-size: var(--t-xs); letter-spacing: .18em; text-transform: uppercase;
  color: var(--ouro);
}
.destaque__tema {
  font-family: var(--f-display);
  font-size: var(--t-2xl);
  font-style: italic;
  font-weight: 500;
  line-height: 1.05;
  margin: 6px 0 14px;
}
.destaque__versiculo {
  margin: 0;
  max-width: 62ch;
  font-family: var(--f-display);
  font-size: var(--t-lg);
  line-height: 1.5;
  color: rgba(241, 235, 224, .92);
}
.destaque__ref {
  margin-top: 10px;
  font-size: var(--t-xs);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--neutro);
}
.destaque__acoes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }

/* Métricas */
.metricas { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.metrica {
  padding: 16px 18px;
  border: 1px solid var(--filete);
  border-radius: var(--r-md);
  background: var(--superficie);
}
.metrica__icone { color: var(--ouro); opacity: .85; }
.metrica__valor { font-family: var(--f-display); font-size: 1.9rem; line-height: 1.1; margin-top: 6px; }
.metrica__rotulo { font-size: var(--t-xs); color: var(--neutro); }

.painel-colunas { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }

.cartao {
  padding: 18px 20px;
  border: 1px solid var(--filete);
  border-radius: var(--r-md);
  background: var(--superficie);
}
.cartao__cabecalho { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.cartao__cabecalho h3 { font-family: var(--f-display); font-size: var(--t-md); }
.cartao__nota { font-size: var(--t-xs); color: var(--neutro); }
.cartao__vazio { font-size: var(--t-sm); color: var(--neutro); }

.ranking { list-style: none; margin: 0; padding: 0; display: grid; gap: 11px; }
.ranking__item { display: grid; grid-template-columns: 1fr 2fr auto; align-items: center; gap: 10px; font-size: var(--t-sm); }
.ranking__barra { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .06); overflow: hidden; }
.ranking__barra i { display: block; height: 100%; background: linear-gradient(90deg, rgba(231,184,75,.45), var(--ouro)); }
.ranking__valor { color: var(--neutro); font-size: var(--t-xs); }

.lista-simples { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; font-size: var(--t-sm); }
.lista-simples li {
  display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: baseline;
  padding-bottom: 9px; border-bottom: 1px solid rgba(255, 255, 255, .05);
}
.lista-simples li:last-child { border-bottom: 0; padding-bottom: 0; }
.lista-simples__tema, .lista-simples__data { font-size: var(--t-xs); color: var(--neutro); }

/* ------------------------------ Estúdio ----------------------------- */
.estudio { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 380px); gap: clamp(18px, 3vw, 34px); align-items: start; }
.estudio__controles { display: grid; gap: 18px; }
.estudio__linha { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }

.campo {
  padding: 16px 18px;
  border: 1px solid var(--filete);
  border-radius: var(--r-md);
  background: var(--superficie);
}
.campo__cabecalho { margin-bottom: 12px; }
.campo__cabecalho h3 { font-size: var(--t-sm); font-weight: 600; letter-spacing: .01em; }
.campo__cabecalho p { font-size: var(--t-xs); color: var(--neutro); margin-top: 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 8px 14px;
  border: 1px solid var(--filete);
  border-radius: 999px;
  background: transparent;
  color: var(--neutro);
  font-size: var(--t-sm);
  cursor: pointer;
  transition: all .16s ease;
}
.chip:hover { color: var(--vellum); border-color: #35406B; }
.chip--ativo {
  background: rgba(231, 184, 75, .12);
  border-color: rgba(231, 184, 75, .55);
  color: var(--ouro-suave);
}

.cores { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
.cor {
  width: 32px; height: 32px; padding: 0; cursor: pointer;
  border: 1px solid rgba(255, 255, 255, .16);
  border-radius: 10px;
  background: var(--amostra, #fff);
  transition: transform .14s ease, box-shadow .14s ease;
}
.cor:hover { transform: translateY(-2px); }
.cor--ativa { box-shadow: 0 0 0 2px var(--tinta), 0 0 0 4px var(--ouro); }
.cor--livre {
  display: grid; place-items: center; overflow: hidden;
  background: conic-gradient(from 210deg, #E7B84B, #6FC59B, #7E8BE8, #E2726E, #E7B84B);
}
.cor--livre input { width: 44px; height: 44px; border: 0; background: none; opacity: 0; cursor: pointer; }

.area-arquivo {
  display: flex; align-items: center; gap: 13px;
  padding: 15px 16px;
  border: 1px dashed #333E66;
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: border-color .18s ease, background .18s ease;
}
.area-arquivo:hover { border-color: var(--ouro); background: rgba(231, 184, 75, .05); }
.area-arquivo__icone { color: var(--ouro); }
.area-arquivo strong { display: block; font-size: var(--t-sm); font-weight: 500; }
.area-arquivo small { display: block; font-size: var(--t-xs); color: var(--neutro); }

.lista-fundos { margin-top: 12px; }
.lista-fundos__vazio { font-size: var(--t-xs); color: var(--neutro); margin-bottom: 8px; }
.gradientes { display: flex; gap: 7px; flex-wrap: wrap; }
.gradiente { width: 34px; height: 46px; border-radius: 8px; border: 1px solid var(--filete); }
.fundos-escolhidos { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fundo-tag {
  display: inline-flex; align-items: center; gap: 6px;
  max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  padding: 6px 11px;
  border: 1px solid var(--filete);
  border-radius: 999px;
  font-size: var(--t-xs);
  color: var(--neutro);
}

/* Busca automática de fundos */
.auto-fundos {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid rgba(255, 255, 255, .06);
}
.auto-fundos__painel { margin-top: 8px; display: grid; gap: 8px; }
.auto-fundos__linha { display: flex; gap: 8px; flex-wrap: wrap; }
.entrada {
  flex: 1; min-width: 170px;
  padding: 9px 13px;
  border: 1px solid var(--filete);
  border-radius: var(--r-sm);
  background: rgba(255, 255, 255, .03);
  font-size: var(--t-sm);
  outline: none;
}
.entrada:focus { border-color: var(--ouro); }
.entrada::placeholder { color: #5F6884; }
.auto-fundos__nota { font-size: var(--t-xs); color: var(--neutro); line-height: 1.5; }
.auto-fundos__nota a { color: var(--ouro); }
.auto-fundos__nota--aviso { color: var(--ouro-suave); }
.fundo-tag--aviso { border-color: rgba(231, 184, 75, .45); color: var(--ouro-suave); }

/* Áudio: música e narração */
.linha-audio {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  margin-top: 10px;
}
.controle-volume { display: flex; align-items: center; gap: 8px; font-size: var(--t-xs); color: var(--neutro); }
.controle-volume input[type="range"] { width: 110px; accent-color: var(--ouro); }
.lista-musicas { margin-top: 10px; display: grid; gap: 8px; }
.fundo-tag__x {
  border: 0; background: none; padding: 0 0 0 2px; cursor: pointer;
  color: var(--neutro); font-size: 14px; line-height: 1;
}
.fundo-tag__x:hover { color: var(--erro); }
.card__trilha {
  position: absolute; left: 8px; right: 8px; bottom: 44px;
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 999px;
  background: rgba(8, 11, 22, .72);
  font-size: var(--t-xs); color: var(--neutro);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.controle-volume b { color: var(--vellum); font-weight: 500; min-width: 34px; }

/* Modal de legenda */
.modal__caixa--texto {
  width: min(520px, 92vw);
  padding: 22px;
  border: 1px solid var(--filete);
  border-radius: var(--r-lg);
  background: var(--superficie);
  justify-items: stretch;
  max-height: 86dvh;
  overflow-y: auto;
}
.modal__titulo { font-family: var(--f-display); font-size: var(--t-md); padding-right: 30px; }
.legenda-texto {
  margin: 0;
  padding: 14px 16px;
  border: 1px solid var(--filete);
  border-radius: var(--r-sm);
  background: rgba(0, 0, 0, .25);
  font-family: var(--f-ui);
  font-size: var(--t-sm);
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}
.hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
.hashtags span {
  padding: 4px 9px;
  border: 1px solid var(--filete);
  border-radius: 999px;
  font-size: var(--t-xs);
  color: var(--ouro-suave);
}
.modal__acoes { display: flex; gap: 9px; flex-wrap: wrap; }
.modal__acoes .botao { flex: 1; }

.opcao { display: flex; align-items: center; gap: 10px; font-size: var(--t-sm); padding: 5px 0; cursor: pointer; }
.opcao input { width: 17px; height: 17px; accent-color: var(--ouro); cursor: pointer; }

.dica { font-size: var(--t-xs); color: var(--neutro); text-align: center; }

/* Prévia em formato de celular */
.previa-sticky { position: sticky; top: 96px; display: grid; gap: 14px; justify-items: center; }
.celular {
  position: relative;
  padding: 9px;
  border: 1px solid var(--filete);
  border-radius: 30px;
  background: linear-gradient(160deg, #1C2340, #0C1020);
  box-shadow: var(--sombra), 0 0 60px rgba(231, 184, 75, .07);
}
.celular canvas {
  width: min(300px, 68vw);
  height: auto;
  aspect-ratio: 9 / 16;
  border-radius: 22px;
  background: #000;
}
.celular__brilho {
  position: absolute; inset: auto 22% -14px; height: 26px;
  background: radial-gradient(50% 100% at 50% 0%, rgba(231, 184, 75, .3), transparent 70%);
  filter: blur(6px);
  pointer-events: none;

.previa-info { display: grid; gap: 9px; justify-items: center; text-align: center; }

/* ------------------------------ Vídeos ------------------------------ */
.barra-lote {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px;
  padding: 14px 18px;
  border: 1px solid var(--filete);
  border-radius: var(--r-md);
  background: var(--superficie);
}
.barra-lote__titulo { font-family: var(--f-display); font-size: var(--t-md); }
.barra-lote__meta { font-size: var(--t-xs); color: var(--neutro); }
.barra-lote__acoes { display: flex; gap: 9px; flex-wrap: wrap; }

.grade-cards { min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }

.card {
  display: flex; flex-direction: column; min-width: 0;
  border: 1px solid var(--filete);
  border-radius: var(--r-md);
  background: var(--superficie);
  overflow: hidden;
  transition: border-color .2s ease, transform .2s ease;
}
.card:hover { border-color: #35406B; transform: translateY(-2px); }

/* A miniatura inteira é o alvo da prévia. O selo de play fica num canto:
   no centro ele cobria justamente o versículo, que é o que se quer ler. */
.card__midia { position: relative; background: #000; cursor: pointer; }
.card__canvas { width: 100%; height: auto; aspect-ratio: 9 / 16; display: block; }
.card__midia::after {
  content: '';
  position: absolute; inset: 0;
  background: rgba(231, 184, 75, 0);
  transition: background .2s ease;
  pointer-events: none;
}
.card__midia:hover::after { background: rgba(231, 184, 75, .08); }
.card__midia:focus-visible { outline: 2px solid var(--ouro); outline-offset: -2px; }

.card__play {
  position: absolute; left: 8px; bottom: 8px;
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: rgba(8, 11, 22, .72);
  backdrop-filter: blur(4px);
  color: var(--vellum);
}
.card__duracao {
  position: absolute; right: 8px; bottom: 8px;
  padding: 3px 8px; border-radius: 999px;
  background: rgba(8, 11, 22, .72);
  font-size: var(--t-xs); color: var(--vellum);
}

.card__corpo { padding: 14px 15px; display: grid; gap: 7px; flex: 1; }
.card__texto {
  font-family: var(--f-display);
  font-size: var(--t-sm);
  line-height: 1.5;
  color: rgba(241, 235, 224, .9);
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
.card__ref { font-size: var(--t-xs); letter-spacing: .12em; text-transform: uppercase; color: var(--ouro); }

.card__acoes { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 15px 15px; }
.card__acoes .botao { min-width: 0; }
.card__acoes .botao--pequeno { flex: 1; }
/* O botão principal ocupa a linha inteira: em card estreito, três botões
   lado a lado estouravam a largura e criavam rolagem horizontal. */
.card__acoes .botao--bloco { flex: 1 0 100%; }

.card__progresso { padding: 0 15px 14px; display: grid; gap: 6px; }
.card__progresso .barra { height: 4px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.card__progresso .barra span {
  display: block; height: 100%; width: 0;
  background: linear-gradient(90deg, var(--ouro-suave), var(--ouro));
  transition: width .2s ease;
}
.card__progresso p { font-size: var(--t-xs); color: var(--neutro); }
.link-manual {
  display: block;
  padding: 8px 10px;
  border: 1px solid rgba(231, 184, 75, .4);
  border-radius: var(--r-sm);
  background: rgba(231, 184, 75, .08);
  color: var(--ouro-suave);
  font-size: var(--t-xs);
  text-align: center;
  text-decoration: none;
}
.link-manual:hover { background: rgba(231, 184, 75, .15); }

/* ------------------------------ Listas ------------------------------ */
.filtros { display: flex; flex-wrap: wrap; gap: 10px; }
.campo-busca {
  flex: 1; min-width: 220px;
  display: flex; align-items: center; gap: 10px;
  padding: 11px 15px;
  border: 1px solid var(--filete);
  border-radius: var(--r-sm);
  background: var(--superficie);
  color: var(--neutro);
}
.campo-busca input { flex: 1; border: 0; background: none; outline: none; color: var(--vellum); font-size: var(--t-sm); }
.campo-busca input::placeholder { color: #5F6884; }

.seletor {
  padding: 11px 15px;
  border: 1px solid var(--filete);
  border-radius: var(--r-sm);
  background: var(--superficie);
  font-size: var(--t-sm);
  cursor: pointer;
}
.seletor option { background: var(--elevada); }

.resultado-contagem { font-size: var(--t-xs); color: var(--neutro); }

.lista-versiculos { display: grid; gap: 10px; }
.linha-versiculo {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px;
  padding: 15px 17px;
  border: 1px solid var(--filete);
  border-radius: var(--r-md);
  background: var(--superficie);
  transition: border-color .18s ease;
}
.linha-versiculo:hover { border-color: #35406B; }
.linha-versiculo__conteudo { flex: 1; min-width: 220px; }
.linha-versiculo__texto { font-family: var(--f-display); font-size: var(--t-sm); line-height: 1.55; }
.linha-versiculo__meta { margin-top: 5px; font-size: var(--t-xs); color: var(--neutro); }
.linha-versiculo__meta strong { color: var(--ouro); font-weight: 500; }
.linha-versiculo__acoes { display: flex; gap: 8px; }

/* ------------------------------ Vazios ------------------------------ */
.vazio {
  display: grid; justify-items: center; gap: 11px; text-align: center;
  padding: clamp(34px, 7vw, 72px) 20px;
  border: 1px dashed var(--filete);
  border-radius: var(--r-lg);
  background: rgba(17, 22, 41, .5);
}
.vazio--compacto { padding: 34px 20px; }
.vazio__icone {
  display: grid; place-items: center; width: 54px; height: 54px;
  border-radius: 18px; color: var(--ouro);
  background: rgba(231, 184, 75, .1);
}
.vazio h3 { font-family: var(--f-display); font-size: var(--t-lg); }
.vazio p { font-size: var(--t-sm); color: var(--neutro); max-width: 42ch; }

/* ------------------------------ Modal ------------------------------- */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; }
.modal__fundo { position: absolute; inset: 0; background: rgba(4, 6, 12, .82); backdrop-filter: blur(6px); }
.modal__caixa { position: relative; display: grid; gap: 14px; justify-items: center; animation: surgir .25s ease both; }
.modal__fechar {
  position: absolute; top: -6px; right: -6px; z-index: 2;
  background: rgba(8, 11, 22, .8); border: 1px solid var(--filete);
}
.celular--modal canvas { width: min(360px, 78vw); }
.modal__ref { font-size: var(--t-xs); letter-spacing: .16em; text-transform: uppercase; color: var(--neutro); }

/* ------------------------------ Avisos ------------------------------ */
.toast-area {
  position: fixed; right: 18px; bottom: 18px; z-index: 80;
  display: grid; gap: 9px; max-width: min(360px, calc(100vw - 36px));
}
.toast {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 15px;
  border: 1px solid var(--filete);
  border-radius: var(--r-sm);
  background: rgba(23, 29, 52, .96);
  box-shadow: var(--sombra);
  font-size: var(--t-sm);
  opacity: 0; transform: translateY(10px);
  transition: opacity .24s ease, transform .24s ease;
}
.toast--visivel { opacity: 1; transform: none; }
.toast__icone { display: grid; place-items: center; padding-top: 1px; }
.toast--ok .toast__icone { color: var(--ok); }
.toast--erro .toast__icone { color: var(--erro); }
.toast--aviso .toast__icone, .toast--info .toast__icone { color: var(--ouro); }

/* --------------------------- Carregamento --------------------------- */
.carregando {
  position: fixed; inset: 0; z-index: 90;
  display: grid; place-content: center; justify-items: center; gap: 16px;
  padding: 24px; text-align: center;
  background: var(--tinta);
  color: var(--neutro);
  font-size: var(--t-sm);
}
.carregando__broto {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--ouro);
  box-shadow: 0 0 26px 8px rgba(231, 184, 75, .35);
  animation: tremular 1.5s ease-in-out infinite;
}
@keyframes tremular {
  0%, 100% { transform: scale(1); opacity: .85; }
  50% { transform: scale(1.35); opacity: 1; }
}

.falha { max-width: 560px; display: grid; gap: 12px; justify-items: center; }
.falha__icone { color: var(--erro); }
.falha h2 { font-family: var(--f-display); font-size: var(--t-lg); color: var(--vellum); }
.falha pre {
  width: 100%; margin: 0; padding: 14px 16px;
  border: 1px solid var(--filete); border-radius: var(--r-sm);
  background: var(--superficie); color: var(--vellum);
  font-size: var(--t-xs); text-align: left; overflow-x: auto;

.falha__nota { font-size: var(--t-xs); }
.falha code { color: var(--ouro-suave); }

  .previa-sticky { position: static; }
  .estudio__previa { order: -1; }
}

  .card__corpo { padding: 12px 12px 10px; }
  .card__acoes { padding: 0 12px 12px; gap: 6px; }

  .lista-simples__data { display: none; }
  .barra-lote { flex-direction: column; align-items: stretch; }
  .barra-lote__acoes .botao { flex: 1; }

  async function carregarFFmpeg(aoProgredir = () => {
  }) {
    if (ffmpegInstancia) return ffmpegInstancia;
    if (ffmpegIndisponivel) return null;
    const falhas = [];
    for (const cdn of FFMPEG_CDNS) {
      try {
        const [{ FFmpeg }, { toBlobURL }] = await Promise.all([
          import(
            /* @vite-ignore */
            cdn.ffmpeg

          import(
            /* @vite-ignore */
            cdn.util

        const ffmpeg = new FFmpeg();
        ffmpeg.on("progress", ({ progress }) => aoProgredir(Math.min(1, progress || 0)));
        await ffmpeg.load({
          coreURL: await toBlobURL(`${cdn.core}/ffmpeg-core.js`, "text/javascript"),
          wasmURL: await toBlobURL(`${cdn.core}/ffmpeg-core.wasm`, "application/wasm")
        });
        console.info(`[videoExporter] FFmpeg carregado via ${cdn.nome}.`);
        ffmpegInstancia = ffmpeg;
        ffmpegMotivoFalha = "";
        return ffmpeg;
      } catch (erro) {
        falhas.push(`${cdn.nome}: ${erro?.message || erro}`);
        console.warn(`[videoExporter] ${cdn.nome} falhou:`, erro);
      }

    ffmpegMotivoFalha = falhas.join(" | ");
    ffmpegIndisponivel = true;
    return null;

      convertido: false,
      audioAplicado: false,
      normalizado: false
    };
    const ffmpeg = await carregarFFmpeg(aoProgredir);
    if (!ffmpeg) return semTratamento;
    try {
      await ffmpeg.writeFile("entrada.webm", new Uint8Array(await blob.arrayBuffer()));
      if (plano) {
        for (const arq of plano.arquivos) {
          await ffmpeg.writeFile(arq.nome, new Uint8Array(await arq.blob.arrayBuffer()));
        }
      }
      const tentativas = [
        { codec: "aac", fps: ["-fps_mode", "cfr"] },
        { codec: "aac", fps: ["-vsync", "cfr"] },
        { codec: "libmp3lame", fps: ["-vsync", "cfr"] },
        { codec: "aac", fps: [] }
      ];
      let ultimoErro = null;
      for (const { codec, fps } of tentativas) {
        const args = ["-i", "entrada.webm"];
        if (plano) {
          plano.arquivos.forEach((arq) => {
            if (arq.loop) args.push("-stream_loop", "-1");
            args.push("-i", arq.nome);
          });
          args.push(...plano.argumentos);
        } else {
          args.push("-f", "lavfi", "-i", "anullsrc=channel_layout=stereo:sample_rate=44100");
          args.push("-map", "0:v", "-map", "1:a", "-shortest");
        }
        args.push(
          "-c:v",
          "libx264",
          "-preset",
          perfil.preset,
          "-crf",
          perfil.crf,
          "-pix_fmt",
          "yuv420p",
          // exigido por TikTok/Instagram/YouTube
          "-profile:v",
          "high",
          "-level",
          "4.0",
          "-r",
          String(ANIMACAO.fps),
          ...fps,
          "-g",
          String(ANIMACAO.fps * 2),
          // keyframe a cada 2s
          "-c:a",
          codec,
          "-b:a",
          "128k",
          "-ar",
          "44100",
          "-movflags",
          "+faststart",

          "saida.mp4"

          await ffmpeg.exec(args);
          const saida = await ffmpeg.readFile("saida.mp4");
          if (!saida?.byteLength) throw new Error("Saída vazia.");
          await limparArquivos(ffmpeg, plano);

            blob: new Blob([saida.buffer], { type: "video/mp4" }),

            convertido: true,
            audioAplicado: Boolean(plano),
            normalizado: true
          };
        } catch (erro) {
          ultimoErro = erro;
          console.warn(`[videoExporter] Tentativa falhou (áudio: ${codec}, fps: ${fps.join(" ") || "padrão"}).`, erro);
          await ffmpeg.deleteFile("saida.mp4").catch(() => {

      }
