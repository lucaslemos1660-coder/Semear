/* ==================================================================
   Semear — estilos
   ------------------------------------------------------------------
   Direção visual: "vigília noturna". Fundo índigo profundo, um único
   acento em ouro de vela, tipografia serifada (Fraunces) para os
   momentos de leitura e Sora para os controles. O ouro aparece pouco,
   sempre onde há ação ou escritura — é o que dá identidade à tela.
   ================================================================== */

/* ------------------------------ Tokens ------------------------------ */
:root {
  /* Cores */
  --tinta:      #080B16;
  --superficie: #111629;
  --elevada:    #171D34;
  --filete:     #242C46;
  --ouro:       #E7B84B;
  --ouro-suave: #F2D28C;
  --vellum:     #F1EBE0;
  --neutro:     #8A93AE;
  --erro:       #E2726E;
  --ok:         #6FC59B;

  /* Tipografia fluida */
  --f-display: 'Fraunces', Georgia, serif;
  --f-ui: 'Sora', system-ui, -apple-system, sans-serif;
  --t-xs: clamp(.68rem, .66rem + .1vw, .74rem);
  --t-sm: clamp(.78rem, .75rem + .15vw, .86rem);
  --t-md: clamp(.9rem, .87rem + .2vw, 1rem);
  --t-lg: clamp(1.05rem, 1rem + .4vw, 1.28rem);
  --t-xl: clamp(1.4rem, 1.2rem + 1vw, 2.1rem);
  --t-2xl: clamp(2rem, 1.5rem + 2.4vw, 3.4rem);

  /* Espaço e forma */
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --lateral-largura: 264px;
  --sombra: 0 20px 50px rgba(0, 0, 0, .45);
  --brilho-ouro: 0 0 0 1px rgba(231, 184, 75, .28), 0 12px 32px rgba(231, 184, 75, .12);
}

/* ------------------------------ Reset ------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100dvh;
  background: var(--tinta);
  color: var(--vellum);
  font-family: var(--f-ui);
  font-size: var(--t-md);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* Brilho ambiente: a "vela" atrás de toda a interface. */
body::before {
  content: '';
  position: fixed;
  inset: -20vh 0 auto 0;
  height: 70vh;
  background:
    radial-gradient(60% 60% at 22% 0%, rgba(231, 184, 75, .10), transparent 70%),
    radial-gradient(50% 50% at 85% 10%, rgba(93, 106, 214, .12), transparent 70%);
  pointer-events: none;
  z-index: 0;
}

h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
canvas { display: block; }
.sem-rolagem { overflow: hidden; }

:focus-visible {
  outline: 2px solid var(--ouro);
  outline-offset: 2px;
  border-radius: 6px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ------------------------------ Casco ------------------------------- */
.app {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: var(--lateral-largura) 1fr;
  min-height: 100dvh;
}

.lateral {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 22px 16px 18px;
  border-right: 1px solid var(--filete);
  background: linear-gradient(180deg, rgba(17, 22, 41, .92), rgba(8, 11, 22, .92));
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  height: 100dvh;
}

.lateral__topo { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lateral__fechar { display: none; }

.marca { display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; }
.marca__broto {
  display: grid;
  place-items: center;
  width: 40px; height: 40px;
  border-radius: 13px;
  color: var(--ouro);
  background: radial-gradient(circle at 50% 120%, rgba(231, 184, 75, .35), rgba(23, 29, 52, .9));
  box-shadow: var(--brilho-ouro);
}
.marca__texto strong { display: block; font-family: var(--f-display); font-size: 1.02rem; letter-spacing: -.015em; }
.marca__texto small { display: block; color: var(--neutro); font-size: var(--t-xs); }

/* Navegação */
.nav { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; }
.nav-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 12px;
  border-radius: var(--r-sm);
  color: var(--neutro);
  text-decoration: none;
  font-size: var(--t-sm);
  transition: background .18s ease, color .18s ease;
}
.nav-item:hover { background: rgba(255, 255, 255, .04); color: var(--vellum); }
.nav-item__icone { display: grid; place-items: center; opacity: .9; }
.nav-item--ativo { background: rgba(231, 184, 75, .09); color: var(--vellum); }
.nav-item--ativo .nav-item__icone { color: var(--ouro); }
.nav-item__marca {
  position: absolute; left: 0; top: 50%;
  width: 2px; height: 0; border-radius: 2px;
  background: var(--ouro);
  transform: translateY(-50%);
  transition: height .2s ease;
}
.nav-item--ativo .nav-item__marca { height: 20px; }

.lateral__rodape { margin-top: auto; display: grid; gap: 8px; font-size: var(--t-xs); color: var(--neutro); }
.selo-local {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 11px;
  border: 1px solid var(--filete);
  border-radius: 999px;
  background: rgba(255, 255, 255, .02);
}
.selo-local::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--ok); box-shadow: 0 0 8px var(--ok);
}
.rodape-linha { display: flex; justify-content: space-between; align-items: center; }

.link {
  background: none; border: 0; padding: 0; cursor: pointer;
  color: var(--ouro); font-size: var(--t-xs); text-decoration: underline;
  text-underline-offset: 3px;
}

/* Conteúdo */
.conteudo { display: flex; flex-direction: column; min-width: 0; }

.topo {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px;
  padding: 16px clamp(16px, 3vw, 34px);
  border-bottom: 1px solid var(--filete);
  background: rgba(8, 11, 22, .78);
  backdrop-filter: blur(12px);
}
.topo__menu { display: none; }
.topo__titulos { flex: 1; min-width: 0; }
.topo__titulos h1 { font-family: var(--f-display); font-size: var(--t-lg); }
.topo__titulos p { color: var(--neutro); font-size: var(--t-xs); }

.area { padding: clamp(18px, 3vw, 34px); display: grid; gap: 22px; }
.tela--entrando { animation: surgir .32s ease both; }
@keyframes surgir { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.veu {
  position: fixed; inset: 0; z-index: 30;
  background: rgba(4, 6, 12, .65);
  backdrop-filter: blur(2px);
  opacity: 0; pointer-events: none;
  transition: opacity .22s ease;
}
.veu--visivel { opacity: 1; pointer-events: auto; }

/* ------------------------------ Botões ------------------------------ */
.botao {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px;
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  background: rgba(255, 255, 255, .05);
  color: var(--vellum);
  font-size: var(--t-sm); font-weight: 500;
  cursor: pointer;
  transition: transform .12s ease, background .18s ease, border-color .18s ease, opacity .18s ease;
}
.botao:hover { background: rgba(255, 255, 255, .09); }
.botao:active { transform: translateY(1px); }
.botao:disabled { opacity: .5; cursor: progress; }

.botao--principal {
  background: linear-gradient(180deg, var(--ouro-suave), var(--ouro));
  color: #1B1405;
  font-weight: 600;
  box-shadow: 0 10px 24px rgba(231, 184, 75, .18);
}
.botao--principal:hover { background: linear-gradient(180deg, #F7DFA8, #EFC55F); }

.botao--fantasma { background: transparent; border-color: var(--filete); }
.botao--fantasma:hover { background: rgba(255, 255, 255, .05); border-color: #33406A; }

.botao--grande { width: 100%; padding: 15px 20px; font-size: var(--t-md); border-radius: var(--r-md); }
.botao--pequeno { padding: 7px 12px; font-size: var(--t-xs); }
.botao--icone { padding: 9px; border-radius: 10px; }
.botao--bloco { flex: 1; }
.esta-favorito { color: var(--ouro); border-color: rgba(231, 184, 75, .4); }

/* ------------------------------ Painel ------------------------------ */
/* Cartão do tema do dia: a "página iluminada", com filete de ouro na
   margem esquerda, como um manuscrito. É o elemento-assinatura do app. */
.destaque {
  position: relative;
  padding: clamp(22px, 3vw, 40px) clamp(20px, 3vw, 44px);
  border: 1px solid var(--filete);
  border-left: 2px solid var(--ouro);
  border-radius: var(--r-lg);
  background:
    radial-gradient(80% 120% at 0% 0%, rgba(231, 184, 75, .10), transparent 60%),
    linear-gradient(160deg, var(--elevada), var(--superficie));
  overflow: hidden;
}
.destaque__selo {
  font-size: var(--t-xs); letter-spacing: .18em; text-transform: uppercase;
  color: var(--ouro);
}
.destaque__tema {
  font-family: var(--f-display);
  font-size: var(--t-2xl);
  font-style: italic;
  font-weight: 500;
  line-height: 1.05;
  margin: 6px 0 14px;
}
.destaque__versiculo {
  margin: 0;
  max-width: 62ch;
  font-family: var(--f-display);
  font-size: var(--t-lg);
  line-height: 1.5;
  color: rgba(241, 235, 224, .92);
}
.destaque__ref {
  margin-top: 10px;
  font-size: var(--t-xs);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--neutro);
}
.destaque__acoes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }

/* Métricas */
.metricas { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.metrica {
  padding: 16px 18px;
  border: 1px solid var(--filete);
  border-radius: var(--r-md);
  background: var(--superficie);
}
.metrica__icone { color: var(--ouro); opacity: .85; }
.metrica__valor { font-family: var(--f-display); font-size: 1.9rem; line-height: 1.1; margin-top: 6px; }
.metrica__rotulo { font-size: var(--t-xs); color: var(--neutro); }

.painel-colunas { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }

.cartao {
  padding: 18px 20px;
  border: 1px solid var(--filete);
  border-radius: var(--r-md);
  background: var(--superficie);
}
.cartao__cabecalho { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.cartao__cabecalho h3 { font-family: var(--f-display); font-size: var(--t-md); }
.cartao__nota { font-size: var(--t-xs); color: var(--neutro); }
.cartao__vazio { font-size: var(--t-sm); color: var(--neutro); }

.ranking { list-style: none; margin: 0; padding: 0; display: grid; gap: 11px; }
.ranking__item { display: grid; grid-template-columns: 1fr 2fr auto; align-items: center; gap: 10px; font-size: var(--t-sm); }
.ranking__barra { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .06); overflow: hidden; }
.ranking__barra i { display: block; height: 100%; background: linear-gradient(90deg, rgba(231,184,75,.45), var(--ouro)); }
.ranking__valor { color: var(--neutro); font-size: var(--t-xs); }

.lista-simples { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; font-size: var(--t-sm); }
.lista-simples li {
  display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: baseline;
  padding-bottom: 9px; border-bottom: 1px solid rgba(255, 255, 255, .05);
}
.lista-simples li:last-child { border-bottom: 0; padding-bottom: 0; }
.lista-simples__tema, .lista-simples__data { font-size: var(--t-xs); color: var(--neutro); }

/* ------------------------------ Estúdio ----------------------------- */
.estudio { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 380px); gap: clamp(18px, 3vw, 34px); align-items: start; }
.estudio__controles { display: grid; gap: 18px; }
.estudio__linha { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }

.campo {
  padding: 16px 18px;
  border: 1px solid var(--filete);
  border-radius: var(--r-md);
  background: var(--superficie);
}
.campo__cabecalho { margin-bottom: 12px; }
.campo__cabecalho h3 { font-size: var(--t-sm); font-weight: 600; letter-spacing: .01em; }
.campo__cabecalho p { font-size: var(--t-xs); color: var(--neutro); margin-top: 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 8px 14px;
  border: 1px solid var(--filete);
  border-radius: 999px;
  background: transparent;
  color: var(--neutro);
  font-size: var(--t-sm);
  cursor: pointer;
  transition: all .16s ease;
}
.chip:hover { color: var(--vellum); border-color: #35406B; }
.chip--ativo {
  background: rgba(231, 184, 75, .12);
  border-color: rgba(231, 184, 75, .55);
  color: var(--ouro-suave);
}

.cores { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
.cor {
  width: 32px; height: 32px; padding: 0; cursor: pointer;
  border: 1px solid rgba(255, 255, 255, .16);
  border-radius: 10px;
  background: var(--amostra, #fff);
  transition: transform .14s ease, box-shadow .14s ease;
}
.cor:hover { transform: translateY(-2px); }
.cor--ativa { box-shadow: 0 0 0 2px var(--tinta), 0 0 0 4px var(--ouro); }
.cor--livre {
  display: grid; place-items: center; overflow: hidden;
  background: conic-gradient(from 210deg, #E7B84B, #6FC59B, #7E8BE8, #E2726E, #E7B84B);
}
.cor--livre input { width: 44px; height: 44px; border: 0; background: none; opacity: 0; cursor: pointer; }

.area-arquivo {
  display: flex; align-items: center; gap: 13px;
  padding: 15px 16px;
  border: 1px dashed #333E66;
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: border-color .18s ease, background .18s ease;
}
.area-arquivo:hover { border-color: var(--ouro); background: rgba(231, 184, 75, .05); }
.area-arquivo__icone { color: var(--ouro); }
.area-arquivo strong { display: block; font-size: var(--t-sm); font-weight: 500; }
.area-arquivo small { display: block; font-size: var(--t-xs); color: var(--neutro); }

.lista-fundos { margin-top: 12px; }
.lista-fundos__vazio { font-size: var(--t-xs); color: var(--neutro); margin-bottom: 8px; }
.gradientes { display: flex; gap: 7px; flex-wrap: wrap; }
.gradiente { width: 34px; height: 46px; border-radius: 8px; border: 1px solid var(--filete); }
.fundos-escolhidos { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fundo-tag {
  display: inline-flex; align-items: center; gap: 6px;
  max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  padding: 6px 11px;
  border: 1px solid var(--filete);
  border-radius: 999px;
  font-size: var(--t-xs);
  color: var(--neutro);
}

/* Busca automática de fundos */
.auto-fundos {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid rgba(255, 255, 255, .06);
}
.auto-fundos__painel { margin-top: 8px; display: grid; gap: 8px; }
.auto-fundos__linha { display: flex; gap: 8px; flex-wrap: wrap; }
.entrada {
  flex: 1; min-width: 170px;
  padding: 9px 13px;
  border: 1px solid var(--filete);
  border-radius: var(--r-sm);
  background: rgba(255, 255, 255, .03);
  font-size: var(--t-sm);
  outline: none;
}
.entrada:focus { border-color: var(--ouro); }
.entrada::placeholder { color: #5F6884; }
.auto-fundos__nota { font-size: var(--t-xs); color: var(--neutro); line-height: 1.5; }
.auto-fundos__nota a { color: var(--ouro); }
.auto-fundos__nota--aviso { color: var(--ouro-suave); }
.fundo-tag--aviso { border-color: rgba(231, 184, 75, .45); color: var(--ouro-suave); }

/* Áudio: música e narração */
.linha-audio {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  margin-top: 10px;
}
.controle-volume { display: flex; align-items: center; gap: 8px; font-size: var(--t-xs); color: var(--neutro); }
.controle-volume input[type="range"] { width: 110px; accent-color: var(--ouro); }
.lista-musicas { margin-top: 10px; display: grid; gap: 8px; }
.fundo-tag__x {
  border: 0; background: none; padding: 0 0 0 2px; cursor: pointer;
  color: var(--neutro); font-size: 14px; line-height: 1;
}
.fundo-tag__x:hover { color: var(--erro); }
.card__trilha {
  position: absolute; left: 8px; right: 8px; bottom: 44px;
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 999px;
  background: rgba(8, 11, 22, .72);
  font-size: var(--t-xs); color: var(--neutro);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.controle-volume b { color: var(--vellum); font-weight: 500; min-width: 34px; }

/* Modal de legenda */
.modal__caixa--texto {
  width: min(520px, 92vw);
  padding: 22px;
  border: 1px solid var(--filete);
  border-radius: var(--r-lg);
  background: var(--superficie);
  justify-items: stretch;
  max-height: 86dvh;
  overflow-y: auto;
}
.modal__titulo { font-family: var(--f-display); font-size: var(--t-md); padding-right: 30px; }
.legenda-texto {
  margin: 0;
  padding: 14px 16px;
  border: 1px solid var(--filete);
  border-radius: var(--r-sm);
  background: rgba(0, 0, 0, .25);
  font-family: var(--f-ui);
  font-size: var(--t-sm);
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}
.hashtags { display: flex; flex-wrap: wrap; gap: 6px; }
.hashtags span {
  padding: 4px 9px;
  border: 1px solid var(--filete);
  border-radius: 999px;
  font-size: var(--t-xs);
  color: var(--ouro-suave);
}
.modal__acoes { display: flex; gap: 9px; flex-wrap: wrap; }
.modal__acoes .botao { flex: 1; }
.modal__acoes[hidden] { display: none; }

/* v1.8.0 */
.barra-selecao__opcao { padding: 0; font-size: var(--t-xs); color: var(--neutro); }
.conferir-lugares { margin-top: 12px; }
.conferencia__estado { font-size: var(--t-sm); color: var(--neutro); }

/* Legenda por rede (v1.7.0): TikTok e Reels / YouTube */
.legenda-painel { display: grid; gap: 14px; }
.legenda-painel[hidden] { display: none; }
.legenda-rotulo { display: flex; justify-content: space-between; gap: 10px; margin-bottom: -8px; font-size: var(--t-xs); color: var(--neutro); }
.legenda-rotulo b { font-weight: 500; }
.legenda-texto--titulo { font-weight: 600; color: var(--vellum); }

.opcao { display: flex; align-items: center; gap: 10px; font-size: var(--t-sm); padding: 5px 0; cursor: pointer; }
.opcao input { width: 17px; height: 17px; accent-color: var(--ouro); cursor: pointer; }

.dica { font-size: var(--t-xs); color: var(--neutro); text-align: center; }

/* Prévia em formato de celular */
.previa-sticky { position: sticky; top: 96px; display: grid; gap: 14px; justify-items: center; }
.celular {
  position: relative;
  padding: 9px;
  border: 1px solid var(--filete);
  border-radius: 30px;
  background: linear-gradient(160deg, #1C2340, #0C1020);
  box-shadow: var(--sombra), 0 0 60px rgba(231, 184, 75, .07);
}
.celular canvas {
  width: min(300px, 68vw);
  height: auto;
  aspect-ratio: 9 / 16;
  border-radius: 22px;
  background: #000;
}
.celular__brilho {
  position: absolute; inset: auto 22% -14px; height: 26px;
  background: radial-gradient(50% 100% at 50% 0%, rgba(231, 184, 75, .3), transparent 70%);
  filter: blur(6px);
  pointer-events: none;
}
.previa-info { display: grid; gap: 9px; justify-items: center; text-align: center; }
.previa-info__ref { font-size: var(--t-xs); letter-spacing: .16em; text-transform: uppercase; color: var(--neutro); }

/* ------------------------------ Vídeos ------------------------------ */
.barra-lote {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px;
  padding: 14px 18px;
  border: 1px solid var(--filete);
  border-radius: var(--r-md);
  background: var(--superficie);
}
.barra-lote__titulo { font-family: var(--f-display); font-size: var(--t-md); }
.barra-lote__meta { font-size: var(--t-xs); color: var(--neutro); }
.barra-lote__acoes { display: flex; gap: 9px; flex-wrap: wrap; }

.grade-cards { min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }

.card {
  display: flex; flex-direction: column; min-width: 0;
  border: 1px solid var(--filete);
  border-radius: var(--r-md);
  background: var(--superficie);
  overflow: hidden;
  transition: border-color .2s ease, transform .2s ease;
}
.card:hover { border-color: #35406B; transform: translateY(-2px); }

/* A miniatura inteira é o alvo da prévia. O selo de play fica num canto:
   no centro ele cobria justamente o versículo, que é o que se quer ler. */
.card__midia { position: relative; background: #000; cursor: pointer; }
.card__canvas { width: 100%; height: auto; aspect-ratio: 9 / 16; display: block; }
.card__midia::after {
  content: '';
  position: absolute; inset: 0;
  background: rgba(231, 184, 75, 0);
  transition: background .2s ease;
  pointer-events: none;
}
.card__midia:hover::after { background: rgba(231, 184, 75, .08); }
.card__midia:focus-visible { outline: 2px solid var(--ouro); outline-offset: -2px; }

.card__play {
  position: absolute; left: 8px; bottom: 8px;
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: rgba(8, 11, 22, .72);
  backdrop-filter: blur(4px);
  color: var(--vellum);
}
.card__duracao {
  position: absolute; right: 8px; bottom: 8px;
  padding: 3px 8px; border-radius: 999px;
  background: rgba(8, 11, 22, .72);
  font-size: var(--t-xs); color: var(--vellum);
}

.card__corpo { padding: 14px 15px; display: grid; gap: 7px; flex: 1; }
.card__texto {
  font-family: var(--f-display);
  font-size: var(--t-sm);
  line-height: 1.5;
  color: rgba(241, 235, 224, .9);
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
.biblia-todos { margin-left: 8px; vertical-align: middle; }
.card__auditoria { font-size: var(--t-xs); color: #8FD19E; letter-spacing: .02em; }
.card__auditoria--aviso { color: var(--ouro); }
.card__auditoria--erro { color: #F0A0A0; line-height: 1.35; }
.card__ref { font-size: var(--t-xs); letter-spacing: .12em; text-transform: uppercase; color: var(--ouro); }

.card__acoes { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 15px 15px; }
.card__acoes .botao { min-width: 0; }
.card__acoes .botao--pequeno { flex: 1; }
/* O botão principal ocupa a linha inteira: em card estreito, três botões
   lado a lado estouravam a largura e criavam rolagem horizontal. */
.card__acoes .botao--bloco { flex: 1 0 100%; }

.card__progresso { padding: 0 15px 14px; display: grid; gap: 6px; }
.card__progresso .barra { height: 4px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.card__progresso .barra span {
  display: block; height: 100%; width: 0;
  background: linear-gradient(90deg, var(--ouro-suave), var(--ouro));
  transition: width .2s ease;
}
.card__progresso p { font-size: var(--t-xs); color: var(--neutro); }
.link-manual {
  display: block;
  padding: 8px 10px;
  border: 1px solid rgba(231, 184, 75, .4);
  border-radius: var(--r-sm);
  background: rgba(231, 184, 75, .08);
  color: var(--ouro-suave);
  font-size: var(--t-xs);
  text-align: center;
  text-decoration: none;
}
.link-manual:hover { background: rgba(231, 184, 75, .15); }

/* ------------------------------ Listas ------------------------------ */
.filtros { display: flex; flex-wrap: wrap; gap: 10px; }
.campo-busca {
  flex: 1; min-width: 220px;
  display: flex; align-items: center; gap: 10px;
  padding: 11px 15px;
  border: 1px solid var(--filete);
  border-radius: var(--r-sm);
  background: var(--superficie);
  color: var(--neutro);
}
.campo-busca input { flex: 1; border: 0; background: none; outline: none; color: var(--vellum); font-size: var(--t-sm); }
.campo-busca input::placeholder { color: #5F6884; }

.seletor {
  padding: 11px 15px;
  border: 1px solid var(--filete);
  border-radius: var(--r-sm);
  background: var(--superficie);
  font-size: var(--t-sm);
  cursor: pointer;
}
.seletor option { background: var(--elevada); }

.resultado-contagem { font-size: var(--t-xs); color: var(--neutro); }

.lista-versiculos { display: grid; gap: 10px; }
.linha-versiculo {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px;
  padding: 15px 17px;
  border: 1px solid var(--filete);
  border-radius: var(--r-md);
  background: var(--superficie);
  transition: border-color .18s ease;
}
.linha-versiculo:hover { border-color: #35406B; }
.linha-versiculo__conteudo { flex: 1; min-width: 220px; }
.linha-versiculo__texto { font-family: var(--f-display); font-size: var(--t-sm); line-height: 1.55; }
.linha-versiculo__meta { margin-top: 5px; font-size: var(--t-xs); color: var(--neutro); }
.linha-versiculo__meta strong { color: var(--ouro); font-weight: 500; }
.linha-versiculo__acoes { display: flex; gap: 8px; }

/* ------------------------------ Vazios ------------------------------ */
.vazio {
  display: grid; justify-items: center; gap: 11px; text-align: center;
  padding: clamp(34px, 7vw, 72px) 20px;
  border: 1px dashed var(--filete);
  border-radius: var(--r-lg);
  background: rgba(17, 22, 41, .5);
}
.vazio--compacto { padding: 34px 20px; }
.vazio__icone {
  display: grid; place-items: center; width: 54px; height: 54px;
  border-radius: 18px; color: var(--ouro);
  background: rgba(231, 184, 75, .1);
}
.vazio h3 { font-family: var(--f-display); font-size: var(--t-lg); }
.vazio p { font-size: var(--t-sm); color: var(--neutro); max-width: 42ch; }

/* ------------------------------ Modal ------------------------------- */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; }
.modal__fundo { position: absolute; inset: 0; background: rgba(4, 6, 12, .82); backdrop-filter: blur(6px); }
.modal__caixa { position: relative; display: grid; gap: 14px; justify-items: center; animation: surgir .25s ease both; }
.modal__fechar {
  position: absolute; top: -6px; right: -6px; z-index: 2;
  background: rgba(8, 11, 22, .8); border: 1px solid var(--filete);
}
.celular--modal canvas { width: min(360px, 78vw); }
.modal__ref { font-size: var(--t-xs); letter-spacing: .16em; text-transform: uppercase; color: var(--neutro); }

/* ------------------------------ Avisos ------------------------------ */
.toast-area {
  position: fixed; right: 18px; bottom: 18px; z-index: 80;
  display: grid; gap: 9px; max-width: min(360px, calc(100vw - 36px));
}
.toast {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 15px;
  border: 1px solid var(--filete);
  border-radius: var(--r-sm);
  background: rgba(23, 29, 52, .96);
  box-shadow: var(--sombra);
  font-size: var(--t-sm);
  opacity: 0; transform: translateY(10px);
  transition: opacity .24s ease, transform .24s ease;
}
.toast--visivel { opacity: 1; transform: none; }
.toast__icone { display: grid; place-items: center; padding-top: 1px; }
.toast--ok .toast__icone { color: var(--ok); }
.toast--erro .toast__icone { color: var(--erro); }
.toast--aviso .toast__icone, .toast--info .toast__icone { color: var(--ouro); }

/* --------------------------- Carregamento --------------------------- */
.carregando {
  position: fixed; inset: 0; z-index: 90;
  display: grid; place-content: center; justify-items: center; gap: 16px;
  padding: 24px; text-align: center;
  background: var(--tinta);
  color: var(--neutro);
  font-size: var(--t-sm);
}
.carregando__broto {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--ouro);
  box-shadow: 0 0 26px 8px rgba(231, 184, 75, .35);
  animation: tremular 1.5s ease-in-out infinite;
}
@keyframes tremular {
  0%, 100% { transform: scale(1); opacity: .85; }
  50% { transform: scale(1.35); opacity: 1; }
}

.falha { max-width: 560px; display: grid; gap: 12px; justify-items: center; }
.falha__icone { color: var(--erro); }
.falha h2 { font-family: var(--f-display); font-size: var(--t-lg); color: var(--vellum); }
.falha pre {
  width: 100%; margin: 0; padding: 14px 16px;
  border: 1px solid var(--filete); border-radius: var(--r-sm);
  background: var(--superficie); color: var(--vellum);
  font-size: var(--t-xs); text-align: left; overflow-x: auto;
}
.falha__nota { font-size: var(--t-xs); }
.falha code { color: var(--ouro-suave); }

/* --------------------------- Responsivo ----------------------------- */
@media (max-width: 1080px) {
  .estudio { grid-template-columns: 1fr; }
  .previa-sticky { position: static; }
  .estudio__previa { order: -1; }
}

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }

  .lateral {
    position: fixed; inset: 0 auto 0 0; z-index: 40;
    width: min(84vw, var(--lateral-largura));
    transform: translateX(-102%);
    transition: transform .26s cubic-bezier(.4, 0, .2, 1);
  }
  .lateral--aberta { transform: none; }
  .lateral__fechar { display: inline-flex; }

  .topo__menu { display: inline-flex; }
  .topo__acao { display: none; }

  .grade-cards { grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); }
  .card__corpo { padding: 12px 12px 10px; }
  .card__acoes { padding: 0 12px 12px; gap: 6px; }
  .toast-area { left: 14px; right: 14px; bottom: 14px; max-width: none; }
}

@media (max-width: 560px) {
  .metricas { grid-template-columns: repeat(2, 1fr); }
  .lista-simples li { grid-template-columns: 1fr auto; }
  .lista-simples__data { display: none; }
  .barra-lote { flex-direction: column; align-items: stretch; }
  .barra-lote__acoes .botao { flex: 1; }
}

/* ------------------------------------------------------------------ */
/* Portão de acesso                                                    */
/* ------------------------------------------------------------------ */

.portao {
  position: fixed; inset: 0; z-index: 900;
  display: grid; place-items: center;
  padding: 24px;
  background: var(--noite);
}
.portao__caixa {
  width: min(360px, 100%);
  display: flex; flex-direction: column; gap: 14px;
  padding: 28px 24px;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--bg2);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
}
.portao__marca {
  font-family: var(--serif);
  font-size: var(--t-xl);
  color: var(--ouro);
  text-align: center;
}
.portao__lema {
  margin-top: -10px;
  font-size: var(--t-sm);
  color: var(--neutro);
  text-align: center;
  letter-spacing: .08em;
}
.portao__campo { display: flex; flex-direction: column; gap: 6px; }
.portao__campo span { font-size: var(--t-xs); color: var(--neutro); }
.portao__campo input {
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--bg1);
  color: var(--vellum);
  font-size: var(--t-md);
}
.portao__campo input:focus-visible { outline: 2px solid var(--ouro); outline-offset: 1px; }
.portao__erro { font-size: var(--t-xs); color: #F2A2A2; text-align: center; }
.portao__botao { justify-content: center; }
.portao__nota { font-size: var(--t-xs); color: var(--neutro); text-align: center; }

/* ------------------------------------------------------------------ */
/* Bíblia completa                                                     */
/* ------------------------------------------------------------------ */

.biblia-abertura {
  max-width: 520px;
  display: flex; flex-direction: column; gap: 14px; align-items: flex-start;
  padding: 24px;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--bg2);
}
.biblia-abertura__titulo { font-family: var(--serif); font-size: var(--t-lg); color: var(--vellum); }
.biblia-abertura__texto { font-size: var(--t-sm); color: var(--neutro); line-height: 1.6; }

.biblia-tema {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  margin-bottom: 12px;
}
.biblia-tema label { font-size: var(--t-xs); color: var(--neutro); }

.barra-selecao {
  position: sticky; bottom: 0; z-index: 20;
  display: flex; flex-wrap: wrap; gap: 10px;
  align-items: center; justify-content: space-between;
  margin-top: 14px; padding: 12px 14px;
  border: 1px solid rgba(231, 184, 75, .35);
  border-radius: var(--r-md);
  background: rgba(11, 15, 30, .96);
  backdrop-filter: blur(8px);
  font-size: var(--t-sm); color: var(--vellum);
}
.barra-selecao__acoes { display: flex; gap: 8px; margin-left: auto; }
.botao--ativo {
  border-color: var(--ouro);
  background: rgba(231, 184, 75, .16);
  color: var(--ouro-suave);
}

@media (max-width: 560px) {
  .barra-selecao { padding: 10px 12px; }
  .barra-selecao__acoes { width: 100%; }
  .barra-selecao__acoes .botao { flex: 1; justify-content: center; }
}


/* ------------------------------------------------------------------ */
/* Meus temas                                                          */
/* ------------------------------------------------------------------ */

.temas { display: grid; gap: 16px; }

.temas__vazio p { margin: 0 0 8px; }
.temas__dica { color: var(--neutro); font-size: var(--t-sm); }

.temas__grade { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }

.tema-item {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  padding: 12px 14px;
  border: 1px solid rgba(255, 255, 255, .08);
  border-radius: var(--r-sm);
  background: rgba(255, 255, 255, .02);
}
.tema-item__info { display: grid; gap: 2px; min-width: 0; }
.tema-item__info strong { font-size: var(--t-md); }
.tema-item__info span { font-size: var(--t-xs); color: var(--neutro); }
.tema-item__acoes { display: flex; gap: 6px; flex-shrink: 0; }

.campo { display: grid; gap: 6px; margin-bottom: 16px; }
.campo__rotulo { font-size: var(--t-sm); color: var(--vellum); }
.campo__rotulo em { color: var(--neutro); font-style: normal; }
.campo__ajuda { font-size: var(--t-xs); color: var(--neutro); }
.campo input {
  width: 100%;
  padding: 11px 13px;
  border: 1px solid rgba(255, 255, 255, .12);
  border-radius: var(--r-sm);
  background: rgba(8, 11, 22, .55);
  color: var(--vellum);
  font: inherit;
}
.campo input:focus-visible { outline: 2px solid var(--ouro); outline-offset: 1px; }

.temas__busca { display: flex; gap: 8px; }
.temas__busca input { flex: 1; min-width: 0; }

.temas__resultados { display: grid; gap: 4px; max-height: 300px; overflow-y: auto; margin-top: 10px; }
.temas__aguarde { font-size: var(--t-sm); color: var(--neutro); padding: 10px 2px; }

.temas__escolhidos { margin-bottom: 16px; }
.temas__contagem { font-size: var(--t-sm); color: var(--ouro-suave); margin: 0 0 8px; }

.escolhido {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 10px;
  padding: 9px 11px;
  margin-bottom: 6px;
  border-radius: var(--r-sm);
  background: rgba(231, 184, 75, .07);
  border: 1px solid rgba(231, 184, 75, .16);
}
.escolhido__ref { font-size: var(--t-xs); color: var(--ouro); letter-spacing: .06em; }
.escolhido__texto {
  font-size: var(--t-sm); color: var(--neutro);
  grid-column: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.escolhido .botao--icone { grid-row: 1 / 3; grid-column: 2; align-self: center; }

.temas__acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.temas__acoes .botao { flex: 1; min-width: 130px; }

.ligacao { color: var(--ouro); text-decoration: underline; text-underline-offset: 2px; }

@media (max-width: 560px) {
  .tema-item { align-items: flex-start; }
  .tema-item__acoes { width: 100%; }
  .tema-item__acoes .botao--pequeno { flex: 1; }
}


/* Fundo de Bíblia -------------------------------------------------- */
.opcao-biblia { margin-top: 12px; }
.gradiente--botao {
  border: 2px solid transparent;
  cursor: pointer;
  padding: 0;
}
.gradiente--botao:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }
.gradiente--ativo { border-color: var(--ouro); }


/* Diagnóstico da exportação ---------------------------------------- */
.diagnostico {
  margin-top: 8px;
  padding: 9px 11px;
  border: 1px solid rgba(255, 255, 255, .12);
  border-radius: var(--r-sm);
  background: rgba(255, 255, 255, .03);
}
.diagnostico--erro {
  border-color: rgba(224, 92, 92, .4);
  background: rgba(224, 92, 92, .09);
}
.diagnostico__linhas {
  margin: 0 0 8px;
  font-size: var(--t-xs);
  line-height: 1.5;
  color: var(--neutro);
  word-break: break-word;
}
.diagnostico--erro .diagnostico__linhas { color: #F0C9C9; }
.diagnostico__copiar { width: 100%; }

   "auditoria": "1:3b79fdd5"

   "id": "amp-0552",
   "texto": "O Senhor desfaz o conselho das nações, anula os intentos dos povos.",
   "referencia": "Salmos 33:10",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:3f1c1f55"
  },
  {
   "id": "amp-0553",
   "texto": "Deixai a insensatez, e vivei; e andai pelo caminho do entendimento.",
   "referencia": "Provérbios 9:6",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:7e0c4cf0"
  },
  {
   "id": "amp-0556",
   "texto": "Meus caminhos te descrevi, e tu me ouviste; ensina-me os teus estatutos.",
   "referencia": "Salmos 119:26",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:683a5219"
  },
  {
   "id": "amp-0558",
   "texto": "Eu te ensinei o caminho da sabedoria; guiei-te pelas veredas da retidão.",
   "referencia": "Provérbios 4:11",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:195630d9"
  },
  {
   "id": "amp-0559",
   "texto": "Apega-te à instrução e não a largues; guarda-a, porque ela é a tua vida.",
   "referencia": "Provérbios 4:13",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:80f2ecd5"
  },
  {
   "id": "amp-0560",
   "texto": "Não sejas sábio a teus próprios olhos; teme ao Senhor e aparta-te do mal.",
   "referencia": "Provérbios 3:7",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:cebd7076"
  },
  {
   "id": "amp-0561",
   "texto": "O coração do sábio instrui a sua boca, e aumenta o saber nos seus lábios.",
   "referencia": "Provérbios 16:23",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:79476d29"
  },
  {
   "id": "amp-0563",
   "texto": "Sou teu servo; dá-me entendimento, para que eu conheça os teus testemunhos.",
   "referencia": "Salmos 119:125",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:fd68b594"
  },
  {
   "id": "amp-0564",
   "texto": "O sábio teme e desvia-se do mal, mas o tolo é arrogante e dá-se por seguro.",
   "referencia": "Provérbios 14:16",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:8dd742b5"
  },
  {
   "id": "amp-0565",
   "texto": "A boca do justo produz sabedoria; porém a língua perversa será desarraigada.",
   "referencia": "Provérbios 10:31",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:97771b4f"
  },
  {
   "id": "amp-0566",
   "texto": "A sabedoria é alta demais para o insensato; ele não abre a sua boca na porta.",
   "referencia": "Provérbios 24:7",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:604a50a9"
  },
  {
   "id": "amp-0567",
   "texto": "Ensina-me, ó Senhor, o caminho dos teus estatutos, e eu o guardarei até o fim.",
   "referencia": "Salmos 119:33",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:4f92f888"
  },
  {
   "id": "amp-0568",
   "texto": "Chegue a ti o meu clamor, ó Senhor; dá-me entendimento conforme a tua palavra.",
   "referencia": "Salmos 119:169",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:8fab969f"
  },
  {
   "id": "amp-0569",
   "texto": "Grande é o nosso Senhor, e de grande poder; não há limite ao seu entendimento.",
   "referencia": "Salmos 147:5",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:27032eb7"
  },
  {
   "id": "amp-0570",
   "texto": "Na boca do tolo está a vara da soberba, mas os lábios do sábio preservá-lo-ão.",
   "referencia": "Provérbios 14:3",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:8146798f"
  },
  {
   "id": "amp-0572",
   "texto": "Faze resplandecer o teu rosto sobre o teu servo, e ensina-me os teus estatutos.",
   "referencia": "Salmos 119:135",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:6e67911e"
  },
  {
   "id": "amp-0573",
   "texto": "Há tesouro precioso e azeite na casa do sábio; mas o homem insensato os devora.",
   "referencia": "Provérbios 21:20",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:36772cb7"
  },
  {
   "id": "amp-0574",
   "texto": "Não fales aos ouvidos do tolo; porque desprezará a sabedoria das tuas palavras.",
   "referencia": "Provérbios 23:9",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:0640ee14"
  },
  {
   "id": "amp-0575",
   "texto": "O sábio de coração será chamado prudente; e a doçura dos lábios aumenta o saber.",
   "referencia": "Provérbios 16:21",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:64fc4f1a"
  },
  {
   "id": "amp-0576",
   "texto": "Aplica o teu coração à instrução, e os teus ouvidos às palavras do conhecimento.",
   "referencia": "Provérbios 23:12",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:93b57710"
  },
  {
   "id": "amp-0577",
   "texto": "O teu mandamento me faz mais sábio do que meus inimigos, pois está sempre comigo.",
   "referencia": "Salmos 119:98",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:80e18cfa"
  },
  {
   "id": "amp-0578",
   "texto": "Justos são os teus testemunhos para sempre; dá-me entendimento, para que eu viva.",
   "referencia": "Salmos 119:144",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:603f10c5"
  },
  {
   "id": "amp-0579",
   "texto": "O tolo não toma prazer no entendimento, mas tão somente em revelar a sua opinião.",
   "referencia": "Provérbios 18:2",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:cdf26eed"
  },
  {
   "id": "amp-0581",
   "texto": "O conselho do Senhor é para aqueles que o temem, e ele lhes faz saber o seu pacto.",
   "referencia": "Salmos 25:14",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:2032c651"
  },
  {
   "id": "amp-0582",
   "texto": "Quem despreza o seu próximo é falto de senso; mas o homem de entendimento se cala.",
   "referencia": "Provérbios 11:12",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:75a264d9"
  },
  {
   "id": "amp-0583",
   "texto": "Da soberba só provém a contenda; mas com os que se aconselham se acha a sabedoria.",
   "referencia": "Provérbios 13:10",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:0d53126f"
  },
  {
   "id": "amp-0584",
   "texto": "Mais sábio é o preguiçoso a seus olhos do que sete homens que sabem responder bem.",
   "referencia": "Provérbios 26:16",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:e564a048"
  },
  {
   "id": "amp-0585",
   "texto": "A suprema sabedoria altissonantemente clama nas ruas; nas praças levanta a sua voz.",
   "referencia": "Provérbios 1:20",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:58797177"
  },
  {
   "id": "amp-0587",
   "texto": "Dá-me entendimento, para que eu guarde a tua lei, e a observe de todo o meu coração.",
   "referencia": "Salmos 119:34",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:5d8213ef"
  },
  {
   "id": "amp-0588",
   "texto": "Se fores sábio, para ti mesmo o serás; e, se fores escarnecedor, tu só o suportarás.",
   "referencia": "Provérbios 9:12",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:94cd7f04"
  },
  {
   "id": "amp-0590",
   "texto": "A estultícia é alegria para o insensato; mas o homem de entendimento anda retamente.",
   "referencia": "Provérbios 15:21",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:bb5e516d"
  },
  {
   "id": "amp-0591",
   "texto": "O sábio é mais poderoso do que o forte; e o inteligente do que o que possui a força.",
   "referencia": "Provérbios 24:5",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:e7cea31c"
  },
  {
   "id": "amp-0593",
   "texto": "Quem é sábio observe estas coisas, e considere atentamente as benignidades do Senhor.",
   "referencia": "Salmos 107:43",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:ba33c7c3"
  },
  {
   "id": "amp-0594",
   "texto": "No coração do prudente repousa a sabedoria; mas no coração dos tolos não é conhecida.",
   "referencia": "Provérbios 14:33",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:5d736a65"
  },
  {
   "id": "amp-0595",
   "texto": "Pelos teus preceitos alcanço entendimento, pelo que aborreço toda vereda de falsidade.",
   "referencia": "Salmos 119:104",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:c7764a2f"
  },
  {
   "id": "amp-0596",
   "texto": "Não repreendas ao escarnecedor, para que não te odeie; repreende ao sábio, e amar-te-á.",
   "referencia": "Provérbios 9:8",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:88dfafb9"
  },
  {
   "id": "amp-0597",
   "texto": "O óleo e o perfume alegram o coração; assim é o doce conselho do homem para o seu amigo.",
   "referencia": "Provérbios 27:9",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:45903b01"
  },
  {
   "id": "amp-0598",
   "texto": "A sabedoria do prudente é entender o seu caminho; porém a estultícia dos tolos é enganar.",
   "referencia": "Provérbios 14:8",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:50711113"
  },
  {
   "id": "amp-0600",
   "texto": "Até o tolo, estando calado, é tido por sábio; e o que cerra os seus lábios, por entendido.",
   "referencia": "Provérbios 17:28",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:6f63ba85"
  },
  {
   "id": "amp-0601",
   "texto": "O homem falto de entendimento compromete-se, tornando-se fiador na presença do seu vizinho.",
   "referencia": "Provérbios 17:18",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:eafa4b16"
  },
  {
   "id": "amp-0602",
   "texto": "Aquele que vive isolado busca seu próprio desejo; insurge-se contra a verdadeira sabedoria.",
   "referencia": "Provérbios 18:1",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:a2cbd3d5"
  },
  {
   "id": "amp-0603",
   "texto": "O que atende à instrução está na vereda da vida; mas o que rejeita a repreensão anda errado.",
   "referencia": "Provérbios 10:17",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:9ea67985"
  },
  {
   "id": "amp-0604",
   "texto": "Os lábios do justo apascentam a muitos; mas os insensatos, por falta de entendimento, morrem.",
   "referencia": "Provérbios 10:21",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:548bd366"
  },
  {
   "id": "amp-0605",
   "texto": "O escarnecedor busca sabedoria, e não a encontra; mas para o prudente o conhecimento é fácil.",
   "referencia": "Provérbios 14:6",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:24372b9a"
  },
  {
   "id": "amp-0606",
   "texto": "O que lavra a sua terra se fartará de pão; mas o que segue os ociosos é falto de entendimento.",
   "referencia": "Provérbios 12:11",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:0e3361a7"
  },
  {
   "id": "amp-0607",
   "texto": "O conselho do Senhor permanece para sempre, e os intentos do seu coração por todas as gerações.",
   "referencia": "Salmos 33:11",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:c557ba5f"
  },
  {
   "id": "amp-0608",
   "texto": "As tuas mãos me fizeram e me formaram; dá-me entendimento para que aprenda os teus mandamentos.",
   "referencia": "Salmos 119:73",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:c47e869f"
  },
  {
   "id": "amp-0609",
   "texto": "O alvo do inteligente é a sabedoria; mas os olhos do insensato estão nas extremidades da terra.",
   "referencia": "Provérbios 17:24",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:cb063c6b"
  },
  {
   "id": "amp-0611",
   "texto": "Águas profundas são as palavras da boca do homem; e a fonte da sabedoria é um ribeiro que corre.",
   "referencia": "Provérbios 18:4",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:23d64653"
  },
  {
   "id": "amp-0612",
   "texto": "O justo toma conhecimento da causa dos pobres; mas o ímpio não tem entendimento para a conhecer.",
   "referencia": "Provérbios 29:7",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:7c77dabc"
  },
  {
   "id": "amp-0613",
   "texto": "O que adultera com uma mulher é falto de entendimento; destrói-se a si mesmo, quem assim procede.",
   "referencia": "Provérbios 6:32",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:dee48685"
  },
  {
   "id": "amp-0614",
   "texto": "Onde não há conselho, frustram-se os projetos; mas com a multidão de conselheiros se estabelecem.",
   "referencia": "Provérbios 15:22",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:ebf39370"
  },
  {
   "id": "amp-0616",
   "texto": "Guia-me na tua verdade, e ensina-me; pois tu és o Deus da minha salvação; por ti espero o dia todo.",
   "referencia": "Salmos 25:5",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:d393b26d"
  },
  {
   "id": "amp-0617",
   "texto": "Ensina-me, ó Senhor, o teu caminho, e guia-me por uma vereda plana, por causa dos que me espreitam.",
   "referencia": "Salmos 27:11",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:0e98e366"
  },
  {
   "id": "amp-0618",
   "texto": "Aceita, Senhor, eu te rogo, as oferendas voluntárias da minha boca, e ensina-me as tuas ordenanças.",
   "referencia": "Salmos 119:108",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:ffa3e65c"
  },
  {
   "id": "amp-0619",
   "texto": "Ensina-me a fazer a tua vontade, pois tu és o meu Deus; guie-me o teu bom Espírito por terreno plano.",
   "referencia": "Salmos 143:10",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:0b866a92"
  },
  {
   "id": "amp-0620",
   "texto": "Porque melhor é a sabedoria do que as jóias; e de tudo o que se deseja nada se pode comparar com ela.",
   "referencia": "Provérbios 8:11",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:464fae32"
  },
  {
   "id": "amp-0621",
   "texto": "Quem é tardio em irar-se é grande em entendimento; mas o que é de ânimo precipitado exalta a loucura.",
   "referencia": "Provérbios 14:29",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:2af007ce"
  },
  {
   "id": "amp-0623",
   "texto": "Tenho mais entendimento do que todos os meus mestres, porque os teus testemunhos são a minha meditação.",
   "referencia": "Salmos 119:99",
   "livro": "Salmos",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:eec14f7c"
  },
  {
   "id": "amp-0624",
   "texto": "Como pendentes de ouro e gargantilhas de ouro puro, assim é o sábio repreensor para o ouvido obediente.",
   "referencia": "Provérbios 25:12",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:99a1900a"
  },
  {
   "id": "amp-0625",
   "texto": "Quem rejeita a correção menospreza a sua alma; mas aquele que escuta a advertência adquire entendimento.",
   "referencia": "Provérbios 15:32",
   "livro": "Provérbios",
   "tema": "Sabedoria",
   "origem": "ampliado",
   "auditoria": "1:6d5039ca"
  },
  {
   "id": "amp-0626",
   "texto": "Refreia as suas palavras aquele que possui o conhecimento; e o homem de entendimento é de espírito sereno.",

 ]

    const ordenados = duracaoMinima
      ? [...videos].sort((a, b) => (b.duration || 0) - (a.duration || 0))
      : videos;

    const fundos = [];
    for (const video of ordenados) {
      if (fundos.length >= quantidade) break;
      if (duracaoMinima && (video.duration || 0) < duracaoMinima) continue;
      const fundo = await prepararUm(video, tema, consulta);
      if (fundo) {
        fundos.push(fundo);
        aoProgredir(fundos.length, quantidade);
      }
    }
    if (!fundos.length) {
      throw new Error("Os vídeos foram encontrados, mas o download foi bloqueado. Continue com os fundos em gradiente ou escolha arquivos MP4 do seu computador.");
    }
    return fundos;

  async function prepararUm(video, tema, consulta, { larguraAlvo = 1080 } = {}) {
    const arquivo = melhorArquivo(video, { larguraAlvo });
    if (!arquivo) return null;
    const id = `pexels-${video.id}-${arquivo.width || 0}`;
    if (cache2.has(id)) return cache2.get(id);
    let url2;
    try {
      const resposta = await fetch(arquivo.link);
      if (!resposta.ok) throw new Error(String(resposta.status));
      url2 = URL.createObjectURL(await resposta.blob());
    } catch {
      console.warn("[pexels] Download direto bloqueado; usando a URL remota só para prévia.");
      url2 = arquivo.link;
    }
    const remoto = url2 === arquivo.link;
    const elemento = criarElementoVideo(url2);
    try {
      await aguardarVideoPronto(elemento);
    } catch {
      if (!remoto) URL.revokeObjectURL(url2);
      return null;
    }
    const fundo = {
      tipo: "video",
      origem: remoto ? "pexels-remoto" : "pexels",
      id,
      nome: `${consulta} · ${video.user?.name || "Pexels"}`,
      credito: { autor: video.user?.name || "Pexels", link: video.url, tema },
      url: url2,
      elemento,
      duracao: video.duration || 0,
      // Sinaliza para a UI que a exportação pode falhar por contaminação do canvas.
      somenteVisualizacao: remoto

    cache2.set(id, fundo);
    return fundo;

    return Array.from({ length: quantidade }, (_, i) => base[i % base.length]);

  /**
   * Gera vídeos de paisagem com o nome do lugar.
   *
   * Cada lugar busca a PRÓPRIA paisagem no Pexels, com a consulta específica
   * dele — não serve reaproveitar as do tema. Escrever "Lauterbrunnen" sobre
   * um campo qualquer seria pior que não escrever nada.
   */
  /**
   * Clipes do lugar que a auditoria confirma.
   *
   * O Pexels devolve qualquer vídeo que "pareça" com a busca: em lugar
   * específico, vem muita paisagem genérica de outro país. A página de cada
   * vídeo tem uma descrição no endereço (/video/vista-aerea-de-lauterbrunnen-123/);
   * o SemearAuditoria.auditarClipe confere se ela cita o lugar (confirmado)
   * ou ao menos a região/país (provável). Sem nenhum dos dois, o clipe fica
   * de fora. Busca até 2 páginas e o nome puro do lugar; entre os aprovados,
   * sorteia — o mesmo lugar não traz sempre os mesmos clipes.
   */
  /**
   * Quanto a imagem do clipe muda em 1 s: média da diferença de brilho entre
   * dois quadros, reduzidos a 64 px de largura (0 = foto). Clipe de tripé com nuvem parada dá perto de 0 —
   * é o que parecia "foto com a câmera andando". null = não deu para medir
   * (vídeo de outro domínio sem CORS): o clipe entra.
   */
  async function medirMovimento(video) {
    try {
      const dur = video.duration || 0;
      if (dur < 2) return null;
      const L = 64;
      const A = Math.max(1, Math.round(L * (video.videoHeight || 16) / (video.videoWidth || 9)));
      const cv = document.createElement("canvas");
      cv.width = L;
      cv.height = A;
      const ctx = cv.getContext("2d", { willReadFrequently: true });
      const quadro = async (t) => {
        await posicionarVideo(video, t, 1500);
        ctx.drawImage(video, 0, 0, L, A);
        return ctx.getImageData(0, 0, L, A).data;
      };
      const t1 = Math.min(1, dur * 0.15);
      const a = await quadro(t1);
      const b = await quadro(t1 + 1);
      let soma = 0;
      for (let i = 0; i < a.length; i += 4) {
        soma += Math.abs((a[i] * 2 + a[i + 1] * 5 + a[i + 2]) - (b[i] * 2 + b[i + 1] * 5 + b[i + 2])) / 8;
      }
      await posicionarVideo(video, 0, 800);
      return Math.round((soma / (a.length / 4)) * 10) / 10;
    } catch {
      return null;
    }
  }

  async function clipesAuditadosDoLugar(lugar) {

      if (!f) continue;
      // 2. Clipe quase parado vira "foto com a câmera andando". Mede antes.
      const mov = await medirMovimento(f.elemento);
      if (mov != null && mov < MOVIMENTO_MINIMO) {
        recusados.parado = (recusados.parado || 0) + 1;
        continue;
      }
      clipes.push({ ...f, auditoriaImagem: { nivel: c.nivel, termo: c.termo, slug: c.slug, mov } });
    }
    return { clipes, analisados: vistos.size, recusados };
  }

  // v1.8.0 — Conferência dos lugares. Faz as MESMAS buscas do lote (a
  // consulta, a página 2 e o nome puro, parando quando já há 4 confirmados)
  // e a MESMA auditoria pelo endereço do vídeo, mas sem baixar nada: diz
  // quantos clipes confirmados cada lugar teria hoje. O teste de movimento
  // fica de fora (exige baixar), então "apertado" pode virar "pulado" no lote.
  async function conferirLugares(aoProgredir, parar) {
    const chave = obterChave();
    const auditar = globalThis.SemearAuditoria?.auditarClipe;
    const lugares = listarLugares();
    const resultado = [];
    let buscas = 0;
    let erro = null;
    for (const [i, lugar] of lugares.entries()) {
      if (erro || parar?.()) break;
      aoProgredir?.(i, lugares.length, lugar);
      const vistos = new Set();
      const conta = { lugar: 0, regiao: 0, outro: 0, nada: 0, curto: 0 };
      const outros = {};
      const exemplos = [];
      const nomePuro = (lugar.identifica || [])[0]?.replace(/-/g, " ");
      for (const [consulta, pagina] of [[lugar.consulta, 1], [lugar.consulta, 2], [nomePuro, 1]]) {
        if (!consulta || parar?.()) continue;
        let videos = [];
        try {
          videos = await pedirAoPexels(consulta, pagina, 30, chave);
          buscas += 1;
        } catch (e) {
          erro = e?.message || String(e);
          break;
        }
        for (const v of videos) {
          if (vistos.has(v.id)) continue;
          vistos.add(v.id);
          if ((v.duration || 0) < DURACAO_MINIMA_TRECHO) {
            conta.curto += 1;
            continue;
          }
          const veredito = auditar ? auditar(lugar, v) : { nivel: "lugar", termo: null, slug: "" };
          conta[veredito.nivel] = (conta[veredito.nivel] || 0) + 1;
          if (veredito.nivel === "outro") outros[veredito.termo] = (outros[veredito.termo] || 0) + 1;
          else if (veredito.nivel !== "lugar" && veredito.slug && exemplos.length < 3) exemplos.push(veredito.slug);
        }
        if (conta.lugar >= CLIPES_POR_PAISAGEM) break;
      }
      if (vistos.size || !erro) resultado.push({ lugar, conta, outros, exemplos, analisados: vistos.size });
    }
    return { resultado, buscas, erro, total: lugares.length };
  }
  function relatorioDosLugares({ resultado, buscas, erro, total }) {
    const situacao = (r) => r.conta.lugar >= CLIPES_POR_PAISAGEM ? "ok" : r.conta.lugar >= 2 ? "apertado" : "pulado";
    const marca = { ok: "✓", apertado: "⚠", pulado: "✗" };
    const ordem = { pulado: 0, apertado: 1, ok: 2 };
    const contagem = { ok: 0, apertado: 0, pulado: 0 };
    resultado.forEach((r) => {
      contagem[situacao(r)] += 1;
    });
    const linhas = [
      `Semear v${APP.versao} · conferência dos lugares · ${new Date().toLocaleString("pt-BR")}`,
      `${resultado.length} de ${total} lugares · ${buscas} buscas no Pexels`,
      `✓ ${contagem.ok} com 4+ confirmados · ⚠ ${contagem.apertado} com 2 ou 3 · ✗ ${contagem.pulado} com menos de 2 (fica de fora)`
    ];
    if (erro) linhas.push(`Parou no meio: ${erro}`);
    linhas.push("");
    [...resultado].sort((a, b) => ordem[situacao(a)] - ordem[situacao(b)]).forEach((r) => {
      const c = r.conta;
      if (situacao(r) === "ok") {
        linhas.push(`✓ ${r.lugar.nome} — ${c.lugar} confirmados`);
        return;
      }
      const outros = Object.entries(r.outros).map(([t, n]) => `${t} ×${n}`).join(", ");
      linhas.push(`${marca[situacao(r)]} ${r.lugar.nome} — ${c.lugar} confirmado(s) de ${r.analisados}: `
        + `sem o nome ${c.nada}, só a região ${c.regiao}, outro lugar ${c.outro}${outros ? ` (${outros})` : ""}, curtos ${c.curto}`);
      if (r.exemplos.length) linhas.push(`   ex.: ${r.exemplos.join(" · ")}`);
    });
    return { texto: linhas.join("\n"), contagem };
  }
  async function abrirConferenciaLugares() {
    if (!temChave()) {
      avisar("Informe sua chave do Pexels no Estúdio: a conferência faz as mesmas buscas do lote.", "erro", 8e3);
      return;
    }
    const modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML = `
    <div class="modal__fundo" data-fechar></div>
    <div class="modal__caixa modal__caixa--texto" role="dialog" aria-modal="true" aria-label="Conferência dos lugares">
      <button type="button" class="modal__fechar" data-fechar aria-label="Fechar">${icone("fechar")}</button>
      <h3 class="modal__titulo">Conferência dos lugares</h3>
      <p class="conferencia__estado" aria-live="polite">Começando…</p>
      <div class="modal__acoes" hidden>
        <button type="button" class="botao botao--principal" data-copiar>Copiar relatório</button>
      </div>
      <pre class="legenda-texto" hidden></pre>
    </div>`;
    document.body.appendChild(modal);
    document.body.classList.add("sem-rolagem");
    let fechado = false;
    const fechar = () => {
      fechado = true;
      modal.remove();
      document.body.classList.remove("sem-rolagem");
    };
    modal.querySelectorAll("[data-fechar]").forEach((el) => el.addEventListener("click", fechar));
    const estado = modal.querySelector(".conferencia__estado");
    const dados = await conferirLugares((i, n, lugar) => {
      estado.textContent = `Conferindo ${i + 1} de ${n}: ${lugar.nome}…`;
    }, () => fechado);
    if (fechado) return;
    const { texto, contagem } = relatorioDosLugares(dados);
    estado.textContent = dados.erro
      ? `O Pexels parou de responder no meio (${dados.erro}). O relatório mostra o que deu tempo de conferir.`
      : `✓ ${contagem.ok} prontos · ⚠ ${contagem.apertado} no limite · ✗ ${contagem.pulado} de fora. Copie o relatório e mande no chat.`;
    const pre = modal.querySelector("pre");
    pre.textContent = texto;
    pre.hidden = false;
    const acoes = modal.querySelector(".modal__acoes");
    acoes.hidden = false;
    acoes.querySelector("[data-copiar]").addEventListener("click", async () => {
      const deuCerto = await copiar(texto);
      avisar(deuCerto ? "Relatório copiado." : "Não consegui copiar — selecione o texto na tela.", deuCerto ? "ok" : "aviso");
    });
  }
  document.addEventListener("click", (e) => {
    if (e.target.closest?.("#botao-conferir-lugares")) abrirConferenciaLugares();
  });

  async function gerarLoteDeLugares(p, botao) {
    if (!temChave()) {
      avisar("Informe sua chave do Pexels no Estúdio: as paisagens vêm de lá.", "erro", 8e3);
      return;
    }

    // Teto de paisagens por lote.
    //
    // Cada uma baixa três clipes: dez lugares seriam trinta vídeos e uns 240
    // MB antes de aparecer qualquer coisa na tela. O usuário interpreta essa
    // espera como travamento — e, do ponto de vista dele, é mesmo.
    const quantos = Math.min(p.quantidade || 1, MAX_PAISAGENS_POR_LOTE);
    if ((p.quantidade || 1) > MAX_PAISAGENS_POR_LOTE) {
      avisar(
        `Paisagens vêm em lotes de até ${MAX_PAISAGENS_POR_LOTE}: cada uma baixa `
        + `${CLIPES_POR_PAISAGEM} clipes. Gere de novo para mais.`,
        "aviso", 6e3
      );
    }

    // Sorteia alguns a mais: lugar sem clipe confirmado é pulado e o
    // próximo entra no lugar dele.
    const escolhidos = sortearLugares(quantos + 3, {
      continente: (p.continente || "todas") === "todas" ? null : p.continente
    });
    const pulados = [];
    const recusadosNoLote = [];
    if (!escolhidos.length) {
      avisar("Nenhum lugar encontrado para essa região.", "erro");
      return;
    }

    // Cada paisagem baixa vários clipes: com cinco lugares são quinze vídeos.
    // Avisar antes evita a impressão de travamento durante a espera.
    const totalClipes = quantos * CLIPES_POR_PAISAGEM;
    avisar(
      `Baixando até ${totalClipes} clipes para ${quantos} paisagem(ns). `
      + "Pode levar um minuto — mantenha a aba aberta.",
      "aviso", 7e3
    );

    const rotulo = botao?.innerHTML;
    if (botao) {
      botao.disabled = true;
      botao.innerHTML = "<span>Buscando as paisagens…</span>";
    }

    const itens = [];
    const formato = FORMATOS.find((f) => f.id === p.formato) || FORMATOS[0];
    const musicas = distribuir2(escolhidos.length);

    try {
      for (const [i, lugar] of escolhidos.entries()) {
        if (itens.length >= quantos) break;
        if (botao) {
          botao.innerHTML = `<span>${lugar.nome} — ${itens.length + 1} de ${quantos}…</span>`;
        }

        let clipes = [];
        let recusadosAqui = {};
        try {
          // Vários clipes do MESMO lugar, cada um conferido pela auditoria.
          ({ clipes, recusados: recusadosAqui = {} } = await clipesAuditadosDoLugar(lugar));
        } catch {
          // Um lugar sem paisagem não derruba o lote inteiro.
        }
        // Menos de dois clipes do lugar vira foto animada — ou clipe de outro
        // lugar. Melhor pular para o próximo sorteado.
        recusadosNoLote.push(recusadosAqui);
        if (clipes.length < 2) {
          pulados.push(lugar.nome);
          continue;
        }

        // A duração é a soma dos trechos, e cada trecho nunca passa do clipe
        // que o sustenta (com meio segundo de folga) — é isso que evita o
        // vídeo dar a volta no meio.
        const menorClipe = Math.min(...clipes.map((c) => (c.duracao || SEGUNDOS_POR_TRECHO + 1) - 0.5));
        const porTrecho = Math.min(SEGUNDOS_POR_TRECHO, Math.max(3, Math.floor(menorClipe)));
        const duracao = Math.min(TETO_PAISAGEM, Math.round(porTrecho * clipes.length));
        const fundo = clipes[0];

        itens.push({
          id: `${lugar.id}-${Date.now()}-${i}`,
          lugar,
          fundos: clipes,
          versiculo: {
            id: lugar.id,
            texto: lugar.legenda,
            referencia: `${lugar.nome}, ${lugar.regiao}`,
            tema: lugar.continente
          },
          fundo,
          musica: musicas[i],
          config: {
            ...p,
            duracao,
            // Paisagem é o formato em que a imagem É o conteúdo: vale a
            // resolução cheia, mesmo custando mais tempo de exportação.
            qualidade: "completo",
            largura: formato.largura,
            altura: formato.altura
          }
        });
      }
    } finally {
      if (botao) {
        botao.disabled = false;
        botao.innerHTML = rotulo;
      }
    }

    if (pulados.length) {
      avisar(`Sem clipes confirmados no Pexels, ficaram de fora: ${pulados.join(", ")}.`, "aviso", 8e3);
    }
    // O que a auditoria tirou, para dar para conferir que ela está agindo.
    const somaRecusa = (k) => recusadosNoLote.reduce((s, r) => s + (r[k] || 0), 0);
    const deOutro = somaRecusa("outro") + somaRecusa("regiao") + somaRecusa("nada");
    const parados = somaRecusa("parado");
    if (deOutro || parados) {
      avisar(`Auditoria das paisagens: ${deOutro} clipe(s) de outro lugar ou sem o nome do lugar e ${parados} quase parado(s) ficaram de fora.`, "info", 7e3);
    }
    if (!itens.length) {
      avisar("Não consegui trazer paisagens confirmadas agora. Tente de novo em instantes.", "erro", 7e3);
      return;
    }

    definirLote(itens);
    registrarLote(itens);
    avisar(`${itens.length} paisagem(ns) pronta(s).`, "ok");
    irPara("videos");
  }

  /**
   * Gera um lote de "passagem em etapas".
   *
   * A duração vem do tamanho do texto de cada passagem, não da preferência:
   * três etapas curtas não podem render o mesmo que três longas.
   */
  function gerarLoteDePassagens(p) {
    const tema = (p.temaPassagem || "todas") === "todas" ? null : p.temaPassagem;
    const escolhidas = sortearPassagens(p.quantidade, { tema });
    if (!escolhidas.length) {
      avisar(tema ? `Nenhuma passagem no tema ${tema}.` : "Nenhuma passagem na base.", "erro");
      return;
    }
    if (escolhidas.length < p.quantidade) {
      avisar(`Só há ${escolhidas.length} passagem(ns)${tema ? ` em ${tema}` : ""}: o lote saiu menor.`, "aviso", 6e3);
    }

    const formato = FORMATOS.find((f) => f.id === p.formato) || FORMATOS[0];
    const escolhido = fundoEscolhido();
    const fundos = escolhido
      ? Array.from({ length: escolhidas.length }, () => escolhido)
      : distribuir(obterFundos(), escolhidas.length);
    const musicas = distribuir2(escolhidas.length);

    const itens = escolhidas.map((passagem, i) => ({
      id: `${passagem.id}-${Date.now()}-${i}`,
      passagem,
      // O card, o histórico e os favoritos esperam um versículo: vai o que
      // fecha a passagem, que é um versículo de verdade. O título aparece no
      // card para identificar a história.
      versiculo: {
        id: passagem.id,
        texto: passagem.versiculo.texto,
        referencia: passagem.versiculo.referencia,
        tema: passagem.tema,
        titulo: passagem.titulo
      },
      fundo: fundos[i],
      musica: musicas[i],
      config: {
        ...p,
        duracao: duracaoDaPassagem(passagem),
        largura: formato.largura,
        altura: formato.altura
      }
    }));

    definirLote(itens);
    registrarLote(itens);
    avisar(`${itens.length} passagem(ns) pronta(s).`, "ok");
    irPara("videos");
  }

  /**
   * Gera um lote de curiosidades bíblicas.
   *
   * Mesmo contrato dos outros formatos: `versiculo` leva o versículo que
   * prova o fato (é um versículo de verdade, então histórico e favoritos
   * continuam fazendo sentido) e `tema` leva a categoria.
   */
  function gerarLoteDeCuriosidades(p) {
    const categoria = (p.categoriaCuriosidade || "todas") === "todas" ? null : p.categoriaCuriosidade;
    const escolhidas = sortearCuriosidades(p.quantidade, { categoria });
    if (!escolhidas.length) {
      avisar("Nenhuma curiosidade nesta categoria.", "erro");
      return;
    }
    if (escolhidas.length < p.quantidade) {
      avisar(`Só há ${escolhidas.length} curiosidade(s) nesta categoria: o lote saiu menor.`, "aviso", 6e3);
    }
    const formato = FORMATOS.find((f) => f.id === p.formato) || FORMATOS[0];
    const escolhido = fundoEscolhido();
    const fundos = escolhido
      ? Array.from({ length: escolhidas.length }, () => escolhido)
      : distribuir(obterFundos(), escolhidas.length);
    const musicas = distribuir2(escolhidas.length);
    const itens = escolhidas.map((curiosidade, i) => ({
      id: `${curiosidade.id}-${Date.now()}-${i}`,
      curiosidade,
      versiculo: {
        id: curiosidade.id,
        texto: curiosidade.versiculo.texto,
        referencia: curiosidade.versiculo.referencia,
        tema: curiosidade.categoria,
        titulo: curiosidade.titulo
      },
      fundo: fundos[i],
      musica: musicas[i],
      config: {
        ...p,
        duracao: duracaoDaCuriosidade(curiosidade),
        largura: formato.largura,
        altura: formato.altura
      }
    }));
    definirLote(itens);
    registrarLote(itens);
    avisar(`${itens.length} curiosidade(s) pronta(s).`, "ok");
    irPara("videos");
  }

  async function gerarLote() {
    const p = { ...obter().preferencias };
    const botao = document.getElementById("botao-gerar");

    // Auditoria bíblica (modulo-auditoria.js): confere a base contra a
    // Almeida antes do sorteio. Item reprovado sai do sorteio e o aviso diz
    // qual e por quê. Paisagem não tem texto bíblico e passa direto.
    if (p.modo !== "lugar" && globalThis.SemearAuditoria) {
      const rotuloAuditoria = botao?.innerHTML;
      if (botao) {
        botao.disabled = true;
        botao.innerHTML = "<span>Conferindo na Bíblia…</span>";
      }
      try {
        const auditoria = await globalThis.SemearAuditoria.antesDoLote(p.modo);
        if (auditoria?.aviso) avisar(auditoria.aviso, "aviso", 9e3);
      } catch (e) {
        avisar(`Auditoria não rodou: ${e.message}. Os itens seguem só com o selo.`, "aviso", 8e3);
      } finally {
        if (botao) {
          botao.disabled = false;
          botao.innerHTML = rotuloAuditoria;
        }
      }
    }

    // Cada formato tem roteiro e duração próprios.
    if (p.modo === "pares") {
      await garantirFundos(p, botao);
      gerarLoteDePares(p);
      return;
    }
    if (p.modo === "pergunta") {
      await garantirFundos(p, botao);
      gerarLoteDePerguntas(p);
      return;
    }
    if (p.modo === "curiosidade") {
      await garantirFundos(p, botao);
      gerarLoteDeCuriosidades(p);
      return;
    }
    if (p.modo === "passagem") {
      // Com um tema escolhido, as paisagens buscadas seguem esse tema.
      const temaPassagem = (p.temaPassagem || "todas") === "todas" ? null : p.temaPassagem;
      await garantirFundos(temaPassagem ? { ...p, tema: temaPassagem } : p, botao);
      gerarLoteDePassagens(p);
      return;
    }
    if (p.modo === "lugar") {
      await gerarLoteDeLugares(p, botao);
      return;
    }

    await garantirFundos(p, botao);
    const escolhidos = sortear(p.tema, p.quantidade, { evitarRecentes: p.evitarRepetidos });
    if (!escolhidos.length) {
      avisar(`Nenhum versículo encontrado no tema ${p.tema}.`, "erro");
      return;
    }
    criarLoteCom(escolhidos);
  }
  function criarLoteCom(versiculos) {
    if (!versiculos?.length) return;
    const p = { ...obter().preferencias };
    const formato = FORMATOS.find((f) => f.id === p.formato) || FORMATOS[0];
    const escolhido = fundoEscolhido();
    const fundos = escolhido ? Array.from({ length: versiculos.length }, () => escolhido) : distribuir(obterFundos(), versiculos.length);
    const musicas = distribuir2(versiculos.length);
    const itens = versiculos.map((versiculo, i) => ({
      id: `${versiculo.id}-${Date.now()}-${i}`,
      versiculo,
      fundo: fundos[i],
      musica: musicas[i],
      config: { ...p, largura: formato.largura, altura: formato.altura }
    }));
    definirLote(itens);
    registrarLote(itens);
    avisar(`${itens.length} vídeo(s) prontos para prévia e download.`, "ok");
    irPara("videos");
  }
